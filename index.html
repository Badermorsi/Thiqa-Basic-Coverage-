<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance All List</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f7;
    color:#222;
}

/* =========================
   TOP
========================= */

.top{
    background:#fff;
    padding:18px 20px 12px;
    border-bottom:1px solid #d9d9d9;
}

h1{
    margin:0 0 15px;
    text-align:center;
    font-size:26px;
    color:#1d3557;
}

/* =========================
   TABS
========================= */

.tabs{
    display:grid;
    grid-template-columns:repeat(8,minmax(0,1fr));
    gap:8px;

    width:100%;
    max-width:1600px;

    margin:0 auto 15px;
}

.tab{
    width:100%;

    border:1px solid #b8b8b8;
    background:#eee;

    padding:10px 7px;

    border-radius:6px 6px 0 0;

    cursor:pointer;

    font-weight:bold;
    font-size:13px;

    text-align:center;

    white-space:normal;
    line-height:16px;
}

.tab:hover{
    background:#e2e6ea;
}

.tab.active{
    background:#1d3557;
    color:#fff;
    border-color:#1d3557;
}

/* =========================
   SEARCH
========================= */

.search-container{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));

    gap:10px;

    max-width:1600px;
    margin:0 auto 10px;
}

.search-container input{
    width:100%;

    padding:10px 12px;

    border:1px solid #c5cbd1;
    border-radius:5px;

    font-size:14px;

    outline:none;
}

.search-container input:focus{
    border-color:#1d3557;
}

.controls{
    display:flex;
    justify-content:center;

    margin-bottom:10px;
}

.clear-btn{
    border:1px solid #1d3557;

    background:#1d3557;
    color:#fff;

    padding:9px 18px;

    border-radius:5px;

    cursor:pointer;

    font-weight:bold;
}

.clear-btn:hover{
    background:#16304e;
}

/* =========================
   STATUS
========================= */

.status{
    text-align:center;
    font-size:13px;
    color:#555;

    margin:6px 0 10px;
}

.error-box{
    display:none;

    max-width:1600px;

    margin:0 auto 10px;

    background:#f8d7da;
    color:#721c24;

    border:1px solid #f1b0b7;

    padding:10px;

    border-radius:5px;

    white-space:pre-wrap;
}

/* =========================
   EXCEL AREA
========================= */

.excel-area{
    position:relative;

    width:100%;

    height:calc(100vh - 225px);

    min-height:450px;

    overflow:auto;

    background:#fff;

    border-top:1px solid #c8c8c8;
}

/* =========================
   HEADER
========================= */

.excel-header{
    position:sticky;
    top:0;

    z-index:20;

    display:grid;

    width:max-content;
    min-width:100%;

    background:#e9edf2;

    border-bottom:2px solid #9ba6b2;
}

.header-cell{
    position:relative;

    min-width:0;

    min-height:54px;

    padding:7px 32px 7px 8px;

    border-right:1px solid #c7cbd0;

    display:flex;
    align-items:center;

    font-weight:bold;
    font-size:13px;
    line-height:16px;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.filter-btn{
    position:absolute;

    right:4px;
    top:50%;

    transform:translateY(-50%);

    width:22px;
    height:22px;

    border:1px solid #adb5bd;

    background:#fff;

    border-radius:4px;

    cursor:pointer;

    font-size:10px;

    padding:0;
}

.filter-btn:hover{
    background:#eef2f5;
}

.filter-btn.filtered{
    background:#1d3557;
    color:#fff;
}

/* =========================
   VIRTUAL CONTENT
========================= */

.virtual-content{
    position:relative;

    width:100%;

    min-width:max-content;
}

.data-row{
    position:absolute;

    left:0;

    display:grid;

    width:max-content;
    min-width:100%;

    background:#fff;
}

.data-cell{
    min-width:0;

    padding:7px 8px;

    border-right:1px solid #d5d8dc;
    border-bottom:1px solid #d5d8dc;

    font-size:13px;
    line-height:17px;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;

    overflow:visible;

    height:auto;
    min-height:42px;
}

.data-row:nth-child(even) .data-cell{
    background:#fafafa;
}

/* =========================
   THIQA / BASIC
========================= */

.thiqa-yes,
.basic-yes{
    background:#d9ead3 !important;

    color:#222 !important;

    font-weight:bold !important;

    text-align:center;
}

.thiqa-no,
.basic-no{
    background:#f4cccc !important;

    color:#222 !important;

    font-weight:bold !important;

    text-align:center;
}

/* =========================
   VITAMIN COVERAGE
========================= */

.vitamin-not-covered{
    background:#f4cccc !important;
    color:#222 !important;
    font-weight:bold !important;
}

/* =========================
   THIQA + BASIC FROZEN
========================= */

.frozen-thiqa{
    position:sticky;
    right:110px;
    z-index:7;
    background:#fff;
}

.frozen-basic{
    position:sticky;
    right:0;
    z-index:8;
    background:#fff;
}

.excel-header .frozen-thiqa{
    position:sticky;
    right:110px;
    z-index:12;
    background:#e9edf2;
}

.excel-header .frozen-basic{
    position:sticky;
    right:0;
    z-index:13;
    background:#e9edf2;
}

/* =========================
   FILTER POPUP
========================= */

.filter-popup{
    display:none;

    position:fixed;

    z-index:1000;

    width:280px;

    max-height:420px;

    background:#fff;

    border:1px solid #b9c1c8;

    border-radius:6px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.18);

    overflow:hidden;
}

.filter-popup.show{
    display:block;
}

.filter-popup-header{
    padding:10px;

    border-bottom:1px solid #ddd;

    background:#f5f7f9;

    font-weight:bold;

    font-size:13px;
}

.filter-search{
    padding:8px;

    border-bottom:1px solid #ddd;
}

.filter-search input{
    width:100%;

    padding:7px 8px;

    border:1px solid #c7cdd3;

    border-radius:4px;
}

.filter-actions{
    display:flex;

    gap:6px;

    padding:8px;

    border-bottom:1px solid #ddd;
}

.filter-actions button{
    flex:1;

    padding:7px;

    border:1px solid #c3cad1;

    background:#fff;

    border-radius:4px;

    cursor:pointer;

    font-weight:bold;
}

.filter-actions button:hover{
    background:#eef2f5;
}

.filter-values{
    max-height:280px;

    overflow-y:auto;

    padding:6px 8px;
}

.filter-value{
    display:flex !important;

    width:100%;

    align-items:center;

    gap:7px;

    padding:5px 2px;

    font-size:12px;

    line-height:16px;

    cursor:pointer;

    white-space:normal;
}

.filter-value:hover{
    background:#f3f5f7;
}

.filter-value input{
    flex:0 0 auto;

    width:auto;

    margin:0;

    cursor:pointer;
}

.filter-value span{
    display:block;

    min-width:0;

    word-break:break-word;

    overflow-wrap:anywhere;
}

/* =========================
   SPECIAL CONTENT
========================= */

.special-content{
    display:none;

    width:100%;

    background:#fff;

    padding:15px;
}

.proactive-image{
    display:block;

    width:100%;

    max-width:1600px;

    height:auto;

    margin:0 auto 20px;
}

.proactive-image:last-child{
    margin-bottom:0;
}

/* =========================
   PHONE CONTACTS
========================= */

.phone-layout{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr)
        minmax(0,1.35fr);

    gap:15px;

    width:100%;

    max-width:1600px;

    margin:0 auto;

    align-items:stretch;

}

.phone-table-box{

    width:100%;

    background:#fff;

    border:1px solid #bfc5cb;

    border-radius:5px;

    overflow:hidden;

}

.phone-middle{

    display:flex;

    flex-direction:column;

    gap:15px;

    min-width:0;

}

.phone-table{

    width:100%;

    border-collapse:collapse;

    table-layout:auto;

}

.phone-table th,
.phone-table td{

    border:1px solid #d5d8dc;

    padding:7px 8px;

    font-size:13px;

    line-height:17px;

    text-align:left;

    vertical-align:middle;

    overflow-wrap:anywhere;

    word-break:break-word;

}

/* =========================
   PHONE COLUMN HEADINGS
========================= */

.phone-table thead tr.phone-column-heading th{

    background:#e9edf2 !important;

    color:#222 !important;

    font-weight:bold !important;

    text-align:center !important;

    vertical-align:middle;

}

/* =========================
   PHONE SECTION TITLES
========================= */

.phone-section-title{

    background:#1d3557 !important;

    color:#fff !important;

    text-align:center !important;

    font-weight:bold !important;

    font-size:14px !important;

    padding:9px 8px !important;

}

/* =========================
   PHONE BODY
========================= */

.phone-table tbody tr:nth-child(even) td{

    background:#fafafa;

}

/* =========================
   PHONE TABLE 1
========================= */

.phone-table-contacts th:first-child,
.phone-table-contacts td:first-child{

    min-width:140px;

}

.phone-table-contacts th:nth-child(2),
.phone-table-contacts td:nth-child(2){

    min-width:110px;

    white-space:nowrap;

}

.phone-table-contacts th:nth-child(3),
.phone-table-contacts td:nth-child(3){

    min-width:120px;

    white-space:nowrap;

}

/* =========================
   APG
========================= */

.phone-table-apg th:first-child,
.phone-table-apg td:first-child{

    width:55%;

}

.phone-table-apg th:last-child,
.phone-table-apg td:last-child{

    width:45%;

    white-space:nowrap;

}

/* =========================
   ZAS
========================= */

.phone-table-zas th:first-child,
.phone-table-zas td:first-child{

    width:65%;

}

.phone-table-zas th:last-child,
.phone-table-zas td:last-child{

    width:35%;

    white-space:nowrap;

}

/* =========================
   INSURANCE
========================= */

.phone-table-insurance th:first-child,
.phone-table-insurance td:first-child{

    width:65%;

}

.phone-table-insurance th:last-child,
.phone-table-insurance td:last-child{

    width:35%;

    white-space:nowrap;

}

/* =========================
   PHONE LOADING
========================= */

.phone-loading{

    text-align:center;

    padding:30px;

    color:#555;

    font-size:14px;

}

/* =========================
   MOBILE
========================= */

@media(max-width:1100px){

    .tabs{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .search-container{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .phone-layout{

        grid-template-columns:
            minmax(0,1fr)
            minmax(0,1fr);

    }

    .phone-table-box:first-child{

        grid-column:1 / -1;

    }

    .phone-middle{

        grid-column:1 / -1;

    }

    .phone-table-box:last-child{

        grid-column:1 / -1;

    }

}

@media(max-width:800px){

    h1{
        font-size:21px;
    }

    .top{
        padding:12px 8px 8px;
    }

    .tabs{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
    }

    .tab{
        font-size:12px;
        padding:9px 5px;
    }

    .search-container{
        grid-template-columns:1fr;
    }

    .excel-area{
        height:calc(100vh - 360px);
    }

    .special-content{
        padding:8px;
    }

    .phone-layout{

        display:flex;

        flex-direction:column;

        gap:12px;

    }

    .phone-middle{

        display:flex;

        flex-direction:column;

        gap:12px;

    }

    .phone-table th,
    .phone-table td{

        font-size:12px;

        padding:6px;

    }

}

</style>
</head>

<body>

<div class="top">

<h1>
Insurance Coverage List
</h1>

<div
    class="tabs"
    id="tabs"
></div>

<div id="searchArea">

<div class="search-container">

<input
    id="brandSearch"
    type="text"
    placeholder="Search Brand Name..."
>

<input
    id="genericSearch"
    type="text"
    placeholder="Search Generic Name..."
>

<input
    id="strengthSearch"
    type="text"
    placeholder="Search Strength..."
>

<input
    id="dosageSearch"
    type="text"
    placeholder="Search Dosage Form..."
>

</div>

<div class="controls">

<button
    id="clearBtn"
    class="clear-btn"
    type="button"
>
Clear Search & Filters
</button>

</div>

</div>

<div
    class="status"
    id="status"
>
Loading...
</div>

<div
    class="error-box"
    id="errorBox"
></div>

</div>

<div
    class="excel-area"
    id="excelArea"
>

<div
    class="excel-header"
    id="excelHeader"
></div>

<div
    class="virtual-content"
    id="virtualContent"
></div>

<div
    class="special-content"
    id="specialContent"
></div>

</div>

<div
    class="filter-popup"
    id="filterPopup"
>

<div
    class="filter-popup-header"
    id="filterPopupHeader"
>
Filter
</div>

<div class="filter-search">

<input
    id="filterValueSearch"
    type="text"
    placeholder="Search values..."
>

</div>

<div class="filter-actions">

<button
    id="selectAllBtn"
    type="button"
>
Select All
</button>

<button
    id="applyFilterBtn"
    type="button"
>
Apply
</button>

</div>

<div
    class="filter-values"
    id="filterValues"
></div>

</div>


<script>

/* =========================================================
   WORKSHEETS
========================================================= */

const WORKSHEETS = [

{
    id:"thiqa",
    name:"Thiqa & Basic",
    file:"data.json"
},

{
    id:"haad",
    name:"HAAD",
    file:"HAAD_LIST.json"
},

{
    id:"apg",
    name:"APG FORMULARY 05-06",
    file:"APG FORMULARY 05-06.json"
},

{
    id:"icd10",
    name:"ICD10",
    file:"ICD10.json"
},

{
    id:"vitamin",
    name:"VITAMIN COVERAGE",
    file:"VITAMIN COVERAGE.json"
},

{
    id:"ppi",
    name:"PPI Coverage",
    file:"PPI Coverage.json"
},

{
    id:"proactive",
    name:"PROACTIVE INSTRUCTION",
    special:true
},

{
    id:"hcpc",
    name:"HCPC Cap & Ref Price",
    file:"HCPC Cap & REf Price.json"
},

{
    id:"validity",
    name:"VALIDITY AFTER OPENNING",
    file:"VALIDITY AFTER OPENNING.json"
},

{
    id:"cda",
    name:"CDA & CDB MAX DD",
    file:"CDA &CDB MAX DD.json"
},

{
    id:"adnic",
    name:"ADNIC (KHALIFA F.)",
    file:"ADNIC ( KHALIFA F. ).json"
},

{
    id:"nasHaad",
    name:"Nas TPA Formulary (HAAD)",
    file:"Nas TPA Formulary (HAAD).json"
},

{
    id:"nasDha",
    name:"Nas TPA Formulary (DHA)",
    file:"Nas TPA Formulary (DHA).json"
},

{
    id:"fmc",
    name:"FMC LIST 01-2026",
    file:"FMC LIST 01-2026.json"
},

{
    id:"oman",
    name:"OMAN FORMULARY 03-2024",
    file:"OMAN FORMULARY 03-2024.json"
},

{
    id:"phone",
    name:"PHONE CONTACTS",
    special:"phone",

    phoneFiles:[

        "PHONE CONTACTS 1.json",
        "PHONE CONTACTS 2.json",
        "PHONE CONTACTS 3.json",
        "PHONE CONTACTS 4.json"

    ]

}

];


/* =========================================================
   STORAGE
========================================================= */

const sheetData = {};
const sheetColumns = {};
const filteredData = {};
const columnFilters = {};

const rowOffsets = {};
const rowHeights = {};
const totalHeights = {};

let currentSheet = "thiqa";

let phoneLoaded = false;
let phoneLoading = false;

const ROW_HEIGHT = 42;

const BUFFER_ROWS = 30;


/* =========================================================
   FILTER STATE
========================================================= */

let filterPopupState = {

    column:null,

    sheet:null,

    allValues:[],

    selected:new Set(),

    selectAll:true,

    search:""

};


/* =========================================================
   DOM
========================================================= */

const tabsEl =
document.getElementById("tabs");

const statusEl =
document.getElementById("status");

const errorBox =
document.getElementById("errorBox");

const excelArea =
document.getElementById("excelArea");

const excelHeader =
document.getElementById("excelHeader");

const virtualContent =
document.getElementById("virtualContent");

const specialContent =
document.getElementById("specialContent");

const searchArea =
document.getElementById("searchArea");

const brandSearch =
document.getElementById("brandSearch");

const genericSearch =
document.getElementById("genericSearch");

const strengthSearch =
document.getElementById("strengthSearch");

const dosageSearch =
document.getElementById("dosageSearch");

const clearBtn =
document.getElementById("clearBtn");

const filterPopup =
document.getElementById("filterPopup");

const filterPopupHeader =
document.getElementById("filterPopupHeader");

const filterValueSearch =
document.getElementById("filterValueSearch");

const filterValues =
document.getElementById("filterValues");

const selectAllBtn =
document.getElementById("selectAllBtn");

const applyFilterBtn =
document.getElementById("applyFilterBtn");


/* =========================================================
   INITIALIZE STORAGE
========================================================= */

function initializeSheetStorage(){

    WORKSHEETS.forEach(sheet => {

        sheetData[sheet.id] = [];

        sheetColumns[sheet.id] = [];

        filteredData[sheet.id] = [];

        columnFilters[sheet.id] = {};

        rowOffsets[sheet.id] = [];

        rowHeights[sheet.id] = [];

        totalHeights[sheet.id] = 0;

    });

}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsEl.innerHTML = "";

    WORKSHEETS.forEach(sheet => {

        const button =
        document.createElement("button");

        button.type =
        "button";

        button.className =
        "tab";

        button.dataset.sheet =
        sheet.id;

        button.textContent =
        sheet.name;

        if(sheet.id === currentSheet){

            button.classList.add(
                "active"
            );

        }

        button.addEventListener(
            "click",
            () => {

                switchSheet(
                    sheet.id
                );

            }
        );

        tabsEl.appendChild(
            button
        );

    });

}


/* =========================================================
   LOAD NORMAL JSON FILES
========================================================= */

async function loadAllData(){

    errorBox.style.display =
        "none";

    const normalSheets =
    WORKSHEETS.filter(
        sheet =>
        !sheet.special
    );

    const results =
    await Promise.all(

        normalSheets.map(
            async sheet => {

                try{

                    const response =
                    await fetch(
                        encodeURI(
                            sheet.file
                        ),
                        {
                            cache:"default"
                        }
                    );

                    if(!response.ok){

                        throw new Error(
                            "HTTP " +
                            response.status
                        );

                    }

                    const json =
                    await response.json();

                    return {

                        sheet,

                        rows:
                        normalizeJSON(
                            json
                        ),

                        error:null

                    };

                }
                catch(error){

                    return {

                        sheet,

                        rows:[],

                        error

                    };

                }

            }
        )

    );

    const errors = [];

    results.forEach(
        result => {

            const sheet =
            result.sheet;

            sheetData[sheet.id] =
            result.rows;

            sheetColumns[sheet.id] =
            buildColumns(
                result.rows,
                sheet.id
            );

            filteredData[sheet.id] =
            result.rows.slice();

            columnFilters[sheet.id] =
            {};

            rowOffsets[sheet.id] =
            [];

            rowHeights[sheet.id] =
            [];

            totalHeights[sheet.id] =
            0;

            if(result.error){

                errors.push(
                    sheet.name +
                    ": " +
                    result.error.message
                );

            }

        }
    );

    switchSheet(
        "thiqa"
    );

    if(errors.length){

        errorBox.textContent =
        "Some sheets could not be loaded:\n\n" +
        errors.join("\n");

        errorBox.style.display =
        "block";

    }

}


/* =========================================================
   NORMALIZE JSON
========================================================= */

function normalizeJSON(json){

    if(Array.isArray(json)){

        return json;

    }

    if(
        json &&
        Array.isArray(json.data)
    ){

        return json.data;

    }

    if(
        json &&
        typeof json === "object"
    ){

        const keys =
        Object.keys(json);

        for(
            let i=0;
            i<keys.length;
            i++
        ){

            if(
                Array.isArray(
                    json[keys[i]]
                )
            ){

                return json[keys[i]];

            }

        }

    }

    return [];

}


/* =========================================================
   BUILD COLUMNS
========================================================= */

function buildColumns(rows, type){

    const columns = [];

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        const row =
        rows[i];

        if(
            !row ||
            typeof row !== "object" ||
            Array.isArray(row)
        ){

            continue;

        }

        const keys =
        Object.keys(row);

        for(
            let j=0;
            j<keys.length;
            j++
        ){

            const key =
            keys[j];

            if(
                columns.indexOf(key) === -1
            ){

                columns.push(key);

            }

        }

    }

    if(type === "validity"){

        const desiredOrder = [

            "HAAD CODE",
            "PROACTIVE NAME",
            "VALIDITY AFTER OPENING:",
            "NOTES",
            "Measurability",
            "Review date"

        ];

        const orderedColumns = [];

        for(
            let i=0;
            i<desiredOrder.length;
            i++
        ){

            const desired =
            desiredOrder[i];

            const actual =
            columns.find(
                column =>
                column.toLowerCase().trim() ===
                desired.toLowerCase().trim()
            );

            if(actual){

                orderedColumns.push(
                    actual
                );

            }

        }

        for(
            let i=0;
            i<columns.length;
            i++
        ){

            if(
                orderedColumns.indexOf(
                    columns[i]
                ) === -1
            ){

                orderedColumns.push(
                    columns[i]
                );

            }

        }

        return orderedColumns;

    }

    return columns;

}


/* =========================================================
   VALUE
========================================================= */

function displayValue(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    if(
        typeof value === "object"
    ){

        try{

            return JSON.stringify(
                value
            );

        }
        catch{

            return String(value);

        }

    }

    return String(value);

}


/* =========================================================
   MULTI SEARCH
   % = AND
========================================================= */

function matchesMultiSearch(
    value,
    search
){

    const query =
    String(
        search || ""
    )
    .trim()
    .toLowerCase();

    if(!query){

        return true;

    }

    const text =
    displayValue(value)
    .toLowerCase();

    const terms =
    query
    .split("%")
    .map(
        term =>
        term.trim()
    )
    .filter(Boolean);

    for(
        let i=0;
        i<terms.length;
        i++
    ){

        if(
            !text.includes(
                terms[i]
            )
        ){

            return false;

        }

    }

    return true;

}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(
    columns,
    patterns
){

    for(
        let i=0;
        i<patterns.length;
        i++
    ){

        const pattern =
        patterns[i];

        for(
            let j=0;
            j<columns.length;
            j++
        ){

            if(
                columns[j]
                .toLowerCase()
                .trim()
                .includes(pattern)
            ){

                return columns[j];

            }

        }

    }

    return null;

}

                        i++
                    ){

                        if(
                            matchesMultiSearch(
                                values[i],
                                brandQuery
                            )
                        ){

                            found = true;
                            break;

                        }

                    }

                    if(!found){

                        return false;

                    }

                }

            }


            /* =========================
               GENERIC
            ========================= */

            if(genericQuery){

                if(genericColumn){

                    if(
                        !matchesMultiSearch(
                            row[genericColumn],
                            genericQuery
                        )
                    ){

                        return false;

                    }

                }
                else{

                    let found = false;

                    const values =
                    Object.values(row);

                    for(
                        let i=0;
                        i<values.length;
                        i++
                    ){

                        if(
                            matchesMultiSearch(
                                values[i],
                                genericQuery
                            )
                        ){

                            found = true;
                            break;

                        }

                    }

                    if(!found){

                        return false;

                    }

                }

            }


            /* =========================
               STRENGTH
            ========================= */

            if(strengthQuery){

                if(strengthColumn){

                    if(
                        !matchesMultiSearch(
                            row[strengthColumn],
                            strengthQuery
                        )
                    ){

                        return false;

                    }

                }
                else{

                    let found = false;

                    const values =
                    Object.values(row);

                    for(
                        let i=0;
                        i<values.length;
                        i++
                    ){

                        if(
                            matchesMultiSearch(
                                values[i],
                                strengthQuery
                            )
                        ){

                            found = true;
                            break;

                        }

                    }

                    if(!found){

                        return false;

                    }

                }

            }


            /* =========================
               DOSAGE
            ========================= */

            if(dosageQuery){

                if(dosageColumn){

                    if(
                        !matchesMultiSearch(
                            row[dosageColumn],
                            dosageQuery
                        )
                    ){

                        return false;

                    }

                }
                else{

                    let found = false;

                    const values =
                    Object.values(row);

                    for(
                        let i=0;
                        i<values.length;
                        i++
                    ){

                        if(
                            matchesMultiSearch(
                                values[i],
                                dosageQuery
                            )
                        ){

                            found = true;
                            break;

                        }

                    }

                    if(!found){

                        return false;

                    }

                }

            }


            /* =================================================
               COLUMN FILTERS
            ================================================= */

            const filterColumns =
            Object.keys(filters);

            for(
                let i=0;
                i<filterColumns.length;
                i++
            ){

                const column =
                filterColumns[i];

                const selected =
                filters[column];

                if(!selected){

                    continue;

                }

                const value =
                displayValue(
                    row[column]
                );

                /* =========================================
                   TEXT FILTER
                   Excel-style:
                   Filter search text + Apply
                ========================================= */

                if(
                    selected &&
                    typeof selected === "object" &&
                    !(
                        selected instanceof Set
                    ) &&
                    Object.prototype.hasOwnProperty.call(
                        selected,
                        "text"

                ){

                        !matchesMultiSearch(

                        )
                    ){

                ========================================= */

                else if(

                ){

                    if(
                        !selected.has(
                            value
                        )
                    ){

                        return false;

                    }

                }

            }

            return true;

        }
    );

/* =========================================================

function getColumnWidth(

){

    const c =

    .toLowerCase()
    .trim();

    if(

        )

    if(

    ){

        ){

        }

        if(

            c.includes("active ingredients")
        ){

            return 380;

        }

    }

    if(
        c.includes("proactive name")
    ){

        return 400;

    }

    if(
        c.includes("generic") ||
        c.includes("active ingredient") ||
        c.includes("active ingredients") ||
        c.includes("package name") ||
        c.includes("product name") ||
        c.includes("item name") ||
        c.includes("description") ||
        c.includes("instruction") ||
        c.includes("indication") ||
        c.includes("manufacturer") ||
        c.includes("formulary") ||
        c.includes("agent") ||
        c.includes("daman")
    ){

        return 280;

    }

    if(
        c.includes("strength") ||
        c.includes("dosage form") ||
        c === "dosage"
    ){

        return 160;

    }

    if(
        c.includes("price") ||
        c.includes("markup") ||

        c.includes("copay") ||
        c.includes("cap")
    ){

        return 155;

    }

    if(
        c.includes("date")
    ){

        return 140;

    }

    return 150;

}


/* =========================================================
   FAST COLUMN WIDTH CALCULATION
========================================================= */

function getColumnWidths(type){

    const columns =
    sheetColumns[type] || [];

    if(!columns.length){

        return [];

    }

    const widths =
    columns.map(
        column =>
        getColumnWidth(
            column,
            type
        )
    );

    const available =
    excelArea.clientWidth ||
    window.innerWidth;

    const total =
    widths.reduce(
        (a,b) => a+b,
        0
    );

    if(total >= available){

        return widths;

    }

    const extra =
    available - total;

    const weights =
    columns.map(
        column => {

            const c =
            column
            .toLowerCase()
            .trim();

            if(
                type === "vitamin" &&
                (
                    c.includes("item name") ||
                    c.includes("active ingredient") ||
                    c.includes("active ingredients")
                )
            ){

                return 5;

            }

            if(
                c.includes("generic") ||
                c.includes("active ingredient") ||
                c.includes("item name") ||
                c.includes("package name") ||
                c.includes("description") ||
                c.includes("instruction") ||
                c.includes("indication") ||
                c.includes("proactive name")
            ){

                return 3;

            }

            return 1;

        }
    );

    let totalWeight = 0;

    for(
        let i=0;
        i<columns.length;
        i++
    ){

        const c =
        columns[i]
        .toLowerCase()
        .trim();

        const frozen =
        type === "thiqa" &&
        (
            c === "thiqa" ||
            c === "basic"
        );

        if(!frozen){

            totalWeight +=
            weights[i];

        }

    }

    if(totalWeight <= 0){

        return widths;

    }

    const finalWidths =
    widths.map(
        (width,index) => {

            const c =
            columns[index]
            .toLowerCase()
            .trim();

            const frozen =
            type === "thiqa" &&
            (
                c === "thiqa" ||
                c === "basic"
            );

            if(frozen){

                return width;

            }

            return Math.round(
                width +
                (
                    extra *
                    weights[index] /
                    totalWeight
                )
            );

        }
    );

    return finalWidths;

}


/* =========================================================
   GRID TEMPLATE
========================================================= */

function getGridTemplate(type){

    return getColumnWidths(type)
    .map(
        width =>
        width + "px"
    )
    .join(" ");

}


/* =========================================================
   CALCULATE ROW HEIGHT
========================================================= */

function calculateRowHeight(
    row,
    type
){

    const columns =
    sheetColumns[type] || [];

    const widths =
    getColumnWidths(type);

    let maxLines = 1;

    for(
        let i=0;
        i<columns.length;
        i++
    ){

        const column =
        columns[i];

        const value =
        displayValue(
            row[column]
        );

        if(!value){

            continue;

        }

        const width =
        widths[i] || 150;

        const availableWidth =
        Math.max(
            30,
            width - 16
        );

        const charsPerLine =
        Math.max(
            5,
            Math.floor(
                availableWidth / 6.5
            )
        );

        const paragraphs =
        value.split(/\r?\n/);

        let lines = 0;

        paragraphs.forEach(
            paragraph => {

                if(
                    paragraph.length === 0
                ){

                    lines += 1;

                    return;

                }

                lines += Math.max(
                    1,
                    Math.ceil(
                        paragraph.length /
                        charsPerLine
                    )
                );

            }
        );

        maxLines =
        Math.max(
            maxLines,
            lines
        );

    }

    const calculated =
    (
        maxLines * 17
    ) + 18;

    return Math.max(
        ROW_HEIGHT,
        calculated
    );

}


/* =========================================================
   BUILD VARIABLE ROW OFFSETS
========================================================= */

function buildRowOffsets(type){

    const rows =
    filteredData[type] || [];

    const offsets =
    new Array(
        rows.length
    );

    const heights =
    new Array(
        rows.length
    );

    let currentTop = 0;

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        const height =
        calculateRowHeight(
            rows[i],
            type
        );

        offsets[i] =
        currentTop;

        heights[i] =
        height;

        currentTop +=
        height;

    }

    rowOffsets[type] =
    offsets;

    rowHeights[type] =
    heights;

    totalHeights[type] =
    currentTop;

    if(
        currentSheet === type
    ){

        virtualContent.style.height =
        Math.max(
            60,
            currentTop
        ) + "px";

    }

}


/* =========================================================
   FIND ROW AT POSITION
========================================================= */

function findRowAtPosition(
    offsets,
    position
){

    if(!offsets.length){

        return 0;

    }

    let low = 0;

    let high =
    offsets.length - 1;

    while(
        low <= high
    ){

        const mid =
        Math.floor(
            (low + high) / 2
        );

        if(
            offsets[mid] <= position
        ){

            low =
            mid + 1;

        }
        else{

            high =
            mid - 1;

        }

    }

    return Math.max(
        0,
        Math.min(
            offsets.length - 1,
            high
        )
    );

}

/* =========================================================
   VISIBLE ROWS
========================================================= */

function renderVisibleRows(type){

    const rows =
    filteredData[type] || [];

    const columns =
    sheetColumns[type] || [];

    if(!rows.length){

        virtualContent.innerHTML =
        "";

        virtualContent.style.height =
        "60px";

        return;

    }

    if(
        !rowOffsets[type] ||
        rowOffsets[type].length !== rows.length
    ){

        buildRowOffsets(
            type
        );

    }

    const template =
    getGridTemplate(type);

    const offsets =
    rowOffsets[type];

    const heights =
    rowHeights[type];

    const totalHeight =
    totalHeights[type];

    virtualContent.style.height =
    Math.max(
        60,
        totalHeight
    ) + "px";

    const scrollTop =
    excelArea.scrollTop;

    const viewportHeight =
    excelArea.clientHeight;

    const firstVisible =
    findRowAtPosition(
        offsets,
        scrollTop
    );

    const start =
    Math.max(
        0,
        firstVisible -
        BUFFER_ROWS
    );

    const bottomPosition =
    scrollTop +
    viewportHeight;

    const lastVisible =
    findRowAtPosition(
        offsets,
        bottomPosition
    );

    const end =
    Math.min(
        rows.length - 1,
        lastVisible +
        BUFFER_ROWS
    );

    virtualContent.innerHTML =
    "";

    for(
        let i=start;
        i<=end;
        i++
    ){

        const row =
        rows[i];

        const rowHeight =
        heights[i] ||
        ROW_HEIGHT;

        const rowTop =
        offsets[i];

        const rowElement =
        document.createElement(
            "div"
        );

        rowElement.className =
        "data-row";

        rowElement.style.gridTemplateColumns =
        template;

        rowElement.style.height =
        rowHeight + "px";

        rowElement.style.minHeight =
        rowHeight + "px";

        rowElement.style.top =
        rowTop + "px";

        for(
            let c=0;
            c<columns.length;
            c++
        ){

            const column =
            columns[c];

            const cell =
            document.createElement(
                "div"
            );

            cell.className =
            "data-cell";

            const value =
            displayValue(
                row[column]
            );

            cell.textContent =
            value;

            /* =========================
               VITAMIN
            ========================= */

            if(type === "vitamin"){

                const normalizedColumn =
                column
                .toLowerCase()
                .trim();

                const normalizedValue =
                value
                .toLowerCase()
                .trim();

                if(
                    (
                        normalizedColumn ===
                        "enhanced" ||

                        normalizedColumn ===
                        "thiqa"
                    )
                    &&
                    (
                        normalizedValue ===
                        "nci" ||

                        normalizedValue ===
                        "not covered"
                    )
                ){

                    cell.classList.add(
                        "vitamin-not-covered"
                    );

                }

            }

            /* =========================
               THIQA / BASIC
            ========================= */

            if(
                type === "thiqa"
            ){

                const normalizedColumn =
                column
                .toLowerCase()
                .trim();

                const normalizedValue =
                value
                .toLowerCase()
                .trim();

                if(
                    normalizedColumn ===
                    "basic"
                ){

                    cell.classList.add(
                        "frozen-basic"
                    );

                    if(
                        normalizedValue ===
                        "yes"
                    ){

                        cell.classList.add(
                            "basic-yes"
                        );

                    }
                    else if(
                        normalizedValue ===
                        "no"
                    ){

                        cell.classList.add(
                            "basic-no"
                        );

                    }

                }

                if(
                    normalizedColumn ===
                    "thiqa"
                ){

                    cell.classList.add(
                        "frozen-thiqa"
                    );

                    if(
                        normalizedValue ===
                        "yes"
                    ){

                        cell.classList.add(
                            "thiqa-yes"
                        );

                    }
                    else if(
                        normalizedValue ===
                        "no"
                    ){

                        cell.classList.add(
                            "thiqa-no"
                        );

                    }

                }

            }

            rowElement.appendChild(
                cell
            );

        }

        virtualContent.appendChild(
            rowElement
        );

    }

}


/* =========================================================
   PHONE CONTACTS
========================================================= */

async function loadPhoneContacts(){

    if(phoneLoaded){

        renderPhoneContacts();

        return;

    }

    if(phoneLoading){

        return;

    }

    phoneLoading = true;

    specialContent.innerHTML =
    '<div class="phone-loading">Loading PHONE CONTACTS...</div>';

    statusEl.textContent =
    "Loading PHONE CONTACTS...";

    const phoneSheet =
    WORKSHEETS.find(
        sheet =>
        sheet.id === "phone"
    );

    try{

        const results =
        await Promise.all(

            phoneSheet.phoneFiles.map(
                async file => {

                    const response =
                    await fetch(
                        encodeURI(file),
                        {
                            cache:"default"
                        }
                    );

                    if(!response.ok){

                        throw new Error(
                            file +
                            " - HTTP " +
                            response.status
                        );

                    }

                    const json =
                    await response.json();

                    return normalizePhoneRows(
                        json
                    );

                }
            )

        );

        sheetData.phone = {

            contacts:
            results[0],

            apg:
            results[1],

            zas:
            results[2],

            insurance:
            results[3]

        };

        phoneLoaded = true;

        renderPhoneContacts();

    }
    catch(error){

        specialContent.innerHTML = "";

        const message =
        document.createElement(
            "div"
        );

        message.className =
        "error-box";

        message.style.display =
        "block";

        message.textContent =
        "PHONE CONTACTS could not be loaded:\n\n" +
        error.message;

        specialContent.appendChild(
            message
        );

        statusEl.textContent =
        "PHONE CONTACTS - Error";

    }
    finally{

        phoneLoading = false;

    }

}


/* =========================================================
   NORMALIZE PHONE JSON
========================================================= */

function normalizePhoneRows(json){

    if(Array.isArray(json)){

        return json;

    }

    if(
        json &&
        Array.isArray(json.data)
    ){

        return json.data;

    }

    if(
        json &&
        typeof json === "object"
    ){

        return [json];

    }

    return [];

}


/* =========================================================
   PHONE TABLE HEADERS
========================================================= */

function getPhoneColumns(rows){

    const columns = [];

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        const row =
        rows[i];

        if(
            !row ||
            typeof row !== "object"
        ){

            continue;

        }

        const keys =
        Object.keys(row);

        for(
            let j=0;
            j<keys.length;
            j++
        ){

            if(
                columns.indexOf(
                    keys[j]
                ) === -1
            ){

                columns.push(
                    keys[j]
                );

            }

        }

    }

    return columns;

}

    }

    const headerRow =
    document.createElement(
        "tr"
    );

    headerRow.className =
    "phone-column-heading";

    for(
        let i=0;
        i<columns.length;
        i++
    ){

        const th =
        document.createElement(
            "th"
        );

        if(
            className ===
            "phone-table-contacts" &&
            columns[i]
            .toLowerCase()
            .trim() ===
            "mobile"
        ){

            th.textContent =
            "MOB";

        }
        else{

            th.textContent =
            columns[i];

        }

        headerRow.appendChild(
            th
        );

    }

    thead.appendChild(
        headerRow
    );

    table.appendChild(
        thead
    );

    const tbody =
    document.createElement(
        "tbody"
    );

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        const row =
        rows[i];

        const tr =
        document.createElement(
            "tr"
        );

        for(
            let c=0;
            c<columns.length;
            c++
        ){

            const td =
            document.createElement(
                "td"
            );

            td.textContent =
            displayValue(
                row[
                    columns[c]
                ]
            );

            tr.appendChild(
                td
            );

        }

        tbody.appendChild(
            tr
        );

    }

    table.appendChild(
        tbody
    );

    box.appendChild(
        table
    );

    return box;

}


/* =========================================================
   RENDER PHONE CONTACTS
========================================================= */

function renderPhoneContacts(){

    if(!phoneLoaded){

        loadPhoneContacts();

        return;

    }

    specialContent.innerHTML =
    "";

    const layout =
    document.createElement(
        "div"
    );

    layout.className =
    "phone-layout";

    const contactsTable =
    createPhoneTable(

        sheetData.phone.contacts,

        "phone-table-contacts",

        null

    );

    layout.appendChild(
        contactsTable
    );

    const middle =
    document.createElement(
        "div"
    );

    middle.className =
    "phone-middle";

    const apgTable =
    createPhoneTable(

        sheetData.phone.apg,

        "phone-table-apg",

        "APG DEPARTMENTS"

    );

    middle.appendChild(
        apgTable
    );

    const zasTable =
    createPhoneTable(

        sheetData.phone.zas,

        "phone-table-zas",

    );

    middle.appendChild(
        zasTable
    );

    layout.appendChild(

    );

    const insuranceTable =

}


/* =========================================================
   SWITCH SHEET
========================================================= */

async function switchSheet(type){

    currentSheet =
    type;

    document
    .querySelectorAll(".tab")
    .forEach(
        tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.sheet === type
            );

        }
    );

    brandSearch.value = "";
    genericSearch.value = "";
    strengthSearch.value = "";
    dosageSearch.value = "";

    closeFilterPopup();

    if(
        type === "proactive"
    ){

        searchArea.style.display =
        "none";

        excelHeader.style.display =
        "none";

        virtualContent.style.display =
        "none";

        specialContent.style.display =
        "block";

        renderProactiveImages();

        statusEl.textContent =
        "PROACTIVE INSTRUCTION";

        return;

    }

    if(
        type === "phone"
    ){

        searchArea.style.display =
        "none";

        excelHeader.style.display =
        "none";

        virtualContent.style.display =
        "none";

        specialContent.style.display =
        "block";

        excelArea.scrollTop =
        0;

        await loadPhoneContacts();

        return;

    }

    searchArea.style.display =
    "block";

    excelHeader.style.display =
    "grid";

    virtualContent.style.display =
    "block";

    specialContent.style.display =
    "none";

    updatePlaceholders(
        type
    );

    filteredData[type] =
    getFilteredRows(
        type
    );

    buildRowOffsets(
        type
    );

    excelArea.scrollTop =
    0;

    renderVirtualTable(
        type
    );

    updateStatus(
        type
    );

}


/* =========================================================
   PROACTIVE IMAGES
========================================================= */

function renderProactiveImages(){

    specialContent.innerHTML =
    "";

    const files = [

        "proactive 1.png",

        "proactive 2.png"

    ];

    for(
        let i=0;
        i<files.length;
        i++
    ){

        const img =
        document.createElement(
            "img"
        );

        img.className =
        "proactive-image";

        img.src =
        encodeURI(
            files[i]
        );

        img.alt =
        "Proactive Instruction " +
        (i + 1);

        if(i === 1){

            img.loading =
            "lazy";

        }

        specialContent.appendChild(
            img
        );

    }

}


/* =========================================================
   PLACEHOLDERS
========================================================= */

function updatePlaceholders(type){

    const columns =
    sheetColumns[type] || [];

    const has =
    pattern =>
    columns.some(
        column =>
        column
        .toLowerCase()
        .includes(pattern)
    );

    brandSearch.placeholder =
    has("brand") ||
    has("item name")
        ? "Search Brand / Item..."
        : "Search Brand Name...";

    genericSearch.placeholder =
    has("generic") ||
    has("active ingredient") ||
    has("ingredient")
        ? "Search Generic / Active Ingredient..."
        : "Search Generic Name...";

    strengthSearch.placeholder =
    "Search Strength...";

    dosageSearch.placeholder =
    "Search Dosage Form...";

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(type){

    if(
        type === "proactive"
    ){

        statusEl.textContent =
        "PROACTIVE INSTRUCTION";

        return;

    }

    if(
        type === "phone"
    ){

        return;

    }

    const total =
    sheetData[type]
        ? sheetData[type].length
        : 0;

    const shown =
    filteredData[type]
        ? filteredData[type].length
        : 0;

    statusEl.textContent =
    "Showing " +
    shown.toLocaleString() +
    " of " +
    total.toLocaleString() +
    " records";

}


/* =========================================================
   OPEN FILTER POPUP
========================================================= */

function openFilterPopup(
    type,
    column,
    button
){

    if(
        type === "proactive" ||
        type === "phone"
    ){

        return;

    }

    const rows =
    sheetData[type] || [];

    const valueSet =
    new Set();

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        valueSet.add(
            displayValue(
                rows[i][column]
            )
        );

    }

    const values =
    Array.from(
        valueSet
    )
    .sort(
        (a,b) =>
        a.localeCompare(
            b,
            undefined,
            {
                numeric:true,
                sensitivity:"base"
            }
        )
    );

    const existing =
    columnFilters[type][column];

    let selected =
    new Set(values);

    let selectAll =
    true;

    /*
       Restore existing checkbox filter.
    */

    if(
        existing instanceof Set
    ){

        selected =
        new Set(existing);

        selectAll =
        selected.size ===
        values.length;

    }

    /*
       Restore existing text filter.
    */

    let existingSearch = "";

    if(
        existing &&
        typeof existing === "object" &&
        !(existing instanceof Set) &&
        Object.prototype.hasOwnProperty.call(
            existing,
            "text"
        )
    ){

        existingSearch =
        existing.text || "";

    }

    filterPopupState = {

        column,

        sheet:type,

        allValues:values,

        selected,

        selectAll,

        search:existingSearch

    };

    filterPopupHeader.textContent =
    "Filter: " +
    column;

    filterValueSearch.value =
    existingSearch;

    updateSelectAllButton();

    renderFilterValues();

    const rect =
    button.getBoundingClientRect();

    let left =
    rect.left;

    let top =
    rect.bottom + 5;

    if(
        left + 280 >
        window.innerWidth
    ){

        left =
        window.innerWidth -
        290;

    }

    if(
        top + 420 >
        window.innerHeight
    ){

        top =
        window.innerHeight -
        430;

    }

    filterPopup.style.left =
    Math.max(
        5,
        left
    ) + "px";

    filterPopup.style.top =
    Math.max(
        5,
        top
    ) + "px";

    filterPopup.classList.add(
        "show"
    );

}


/* =========================================================
   SELECT ALL BUTTON
========================================================= */

function updateSelectAllButton(){

    selectAllBtn.textContent =
    "Select All";

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
    filterValueSearch.value
    .trim()
    .toLowerCase();

    const values =
    filterPopupState.allValues.filter(
        value =>
        matchesMultiSearch(
            value,
            search
        )
    );

    filterValues.innerHTML =
    "";

    if(!values.length){

        const empty =
        document.createElement(
            "div"
        );

        empty.style.padding =
        "10px 4px";

        empty.style.fontSize =
        "12px";

        empty.style.color =
        "#666";

        empty.textContent =
        "No matching values";

        filterValues.appendChild(
            empty
        );

        return;

    }

    values.forEach(
        value => {

            const label =
            document.createElement(
                "label"
            );

            label.className =
            "filter-value";

            const checkbox =
            document.createElement(
                "input"
            );

            checkbox.type =
            "checkbox";

            checkbox.checked =
            filterPopupState.selectAll
                ? true
                : filterPopupState.selected.has(
                    value
                );

            checkbox.addEventListener(
                "change",
                () => {

                    filterPopupState.selectAll =
                    false;

                    if(
                        checkbox.checked
                    ){

                        filterPopupState.selected.add(
                            value
                        );

                    }
                    else{

                        filterPopupState.selected.delete(
                            value
                        );

                    }

                    if(
                        filterPopupState.selected.size ===
                        filterPopupState.allValues.length
                    ){

                        filterPopupState.selectAll =
                        true;

                    }

                    renderFilterValues();

                    updateSelectAllButton();

                }
            );

            const text =
            document.createElement(
                "span"
            );

            text.textContent =
            value || "(Blanks)";

            label.appendChild(
                checkbox
            );

            label.appendChild(
                text
            );

            filterValues.appendChild(
                label
            );

        }
    );

}


/* =========================================================
   APPLY POPUP FILTER
========================================================= */

function applyPopupFilter(){

    const type =
    filterPopupState.sheet;

    const column =
    filterPopupState.column;

    if(
        !type ||
        !column
    ){

        return;

    }

    const searchText =
    filterValueSearch.value
    .trim()
    .toLowerCase();

    /*
       =====================================================
       EXCEL-STYLE TEXT SEARCH
       =====================================================

       If the user typed something into:

       Search values...

       then that text becomes the actual
       column filter.

       Example:

       amoxicillin

       or:

       500%10

       means the cell must contain BOTH 500 and 10.
    */

    if(searchText){

        columnFilters[type][column] = {

            text:searchText

        };

    }

    /*
       =====================================================
       NO TEXT SEARCH
       =====================================================

       Use normal checkbox filtering.
    */

    else{

        const allValues =
        filterPopupState.allValues;

        const selected =
        filterPopupState.selected;

        if(
            filterPopupState.selectAll ||
            selected.size ===
            allValues.length
        ){

            delete columnFilters[type][column];

        }
        else{

            columnFilters[type][column] =
            new Set(
                selected
            );

        }

    }

    applyFilters(
        type
    );

}


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters(type){

    if(
        type === "proactive" ||
        type === "phone"
    ){

        return;

    }

    filteredData[type] =
    getFilteredRows(
        type
    );

    buildRowOffsets(
        type
    );

    renderVirtualTable(
        type
    );

    updateStatus(
        type
    );

}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterValueSearch.addEventListener(
    "input",
    () => {

        filterPopupState.search =
        filterValueSearch.value
        .trim()
        .toLowerCase();

        /*
           This searches ONLY the values
           displayed inside the popup.

           The actual table changes only
           after clicking Apply.
        */

        renderFilterValues();

        updateSelectAllButton();

    }
);


/* =========================================================
   SELECT ALL TOGGLE
========================================================= */

selectAllBtn.addEventListener(
    "click",
    () => {

        const search =
        filterValueSearch.value
        .trim()
        .toLowerCase();

        const visibleValues =
        filterPopupState.allValues.filter(
            value =>
            matchesMultiSearch(
                value,
                search
            )
        );

        const allVisibleSelected =
        visibleValues.every(
            value =>
            filterPopupState.selected.has(
                value
            )
        );

        if(
            allVisibleSelected
        ){

            visibleValues.forEach(
                value => {

                    filterPopupState.selected.delete(
                        value
                    );

                }
            );

        }
        else{

            visibleValues.forEach(
                value => {

                    filterPopupState.selected.add(
                        value
                    );

                }
            );

        }

        filterPopupState.selectAll =
        filterPopupState.selected.size ===
        filterPopupState.allValues.length;

        renderFilterValues();

        updateSelectAllButton();

    }
);


/* =========================================================
   APPLY FILTER BUTTON
========================================================= */

applyFilterBtn.addEventListener(
    "click",
    () => {

        /*
           Save the current text first.
        */

        filterPopupState.search =
        filterValueSearch.value
        .trim()
        .toLowerCase();

        /*
           Apply the filter.
        */

        applyPopupFilter();

        /*
           Close popup after Apply.
        */

        closeFilterPopup();

    }
);


/* =========================================================
   CLOSE POPUP
========================================================= */

function closeFilterPopup(){

    filterPopup.classList.remove(
        "show"
    );

}


document.addEventListener(
    "click",
    event => {

        if(
            !filterPopup.contains(
                event.target
            )
        ){

            closeFilterPopup();

        }

    }
);


/* =========================================================
   MAIN SEARCH
========================================================= */

let searchTimer = null;

[
    brandSearch,
    genericSearch,
    strengthSearch,
    dosageSearch
]
.forEach(
    input => {

        input.addEventListener(
            "input",
            () => {

                if(
                    currentSheet ===
                    "proactive" ||
                    currentSheet ===
                    "phone"
                ){

                    return;

                }

                clearTimeout(
                    searchTimer
                );

                searchTimer =
                setTimeout(
                    () => {

                        applyFilters(
                            currentSheet
                        );

                    },
                    100
                );

            }
        );

    }
);


/* =========================================================
   CLEAR SEARCH & FILTERS
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        brandSearch.value = "";

        genericSearch.value = "";

        strengthSearch.value = "";

        dosageSearch.value = "";

        if(
            currentSheet !==
            "proactive" &&
            currentSheet !==
            "phone"
        ){

            columnFilters[
                currentSheet
            ] = {};

            applyFilters(
                currentSheet
            );

        }

    }
);


/* =========================================================
   FAST SCROLL
========================================================= */

let scrollFrame = null;

excelArea.addEventListener(
    "scroll",
    () => {

        if(
            currentSheet ===
            "proactive" ||
            currentSheet ===
            "phone"
        ){

            return;

        }

        if(scrollFrame){

            cancelAnimationFrame(
                scrollFrame
            );

        }

        scrollFrame =
        requestAnimationFrame(
            () => {

                renderVisibleRows(
                    currentSheet
                );

            }
        );

    },
    {
        passive:true
    }
);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer = null;

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );

        resizeTimer =
        setTimeout(
            () => {

                if(
                    currentSheet ===
                    "proactive" ||
                    currentSheet ===
                    "phone"
                ){

                    return;

                }

                buildRowOffsets(
                    currentSheet
                );

                renderVirtualTable(
                    currentSheet
                );

            },
            150
        );

    }
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        createTabs();

        initializeSheetStorage();

        loadAllData();

    }
);

</script>
