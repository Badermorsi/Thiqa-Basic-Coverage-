<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Coverage List</title>

<style>
*{
    box-sizing:border-box;
}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f7;
    color:#222;
}
.top{
    background:#fff;
    padding:18px 20px 12px;
    border-bottom:1px solid #d9d9d9;
}
h1{
    margin:0 0 15px;
    text-align:center;
    font-size:26px;
    color:#1d3557;
}

/* =========================================================
   TABS
========================================================= */
.tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:15px;
    flex-wrap:wrap;
    max-width:1500px;
    margin-left:auto;
    margin-right:auto;
}

.tab{
    flex:0 0 auto;
    border:1px solid #b8b8b8;
    background:#eee;
    padding:11px 20px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
}

.tab:hover{
    background:#e2e2e2;
}

.tab.active{
    background:#1d3557;
    color:#fff;
    border-color:#1d3557;
}

/* =========================================================
   SEARCH
========================================================= */
.search-container{
    display:grid;
    grid-template-columns:repeat(4,minmax(180px,1fr));
    gap:10px;
    max-width:1400px;
    margin:0 auto;
}
.search-box{
    position:relative;
}
.search-box input{
    width:100%;
    padding:11px 38px 11px 12px;
    border:1px solid #bcbcbc;
    border-radius:5px;
    font-size:14px;
    outline:none;
}
.search-box input:focus{
    border-color:#1d3557;
    box-shadow:0 0 0 2px rgba(29,53,87,.1);
}
.search-icon{
    position:absolute;
    right:11px;
    top:10px;
    color:#777;
}

/* =========================================================
   BUTTONS
========================================================= */
.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:12px;
    flex-wrap:wrap;
}
.control-btn{
    border:none;
    border-radius:5px;
    padding:10px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}
.clear-btn{
    background:#dc3545;
    color:#fff;
}
.clear-btn:hover{
    background:#b02a37;
}

/* =========================================================
   STATUS
========================================================= */
.status{
    text-align:center;
    padding:10px;
    font-size:14px;
    color:#555;
}
.error{
    margin:15px auto;
    max-width:1000px;
    background:#ffe5e5;
    color:#a40000;
    border:1px solid #ff9b9b;
    border-radius:6px;
    padding:15px;
    white-space:pre-wrap;
    font-family:monospace;
    text-align:left;
}

/* =========================================================
   TABLE
========================================================= */
.excel-area{
    position:relative;
    width:100%;
    height:calc(100vh - 225px);
    min-height:450px;
    overflow:auto;
    background:#fff;
    border-top:1px solid #c8c8c8;
}
.excel-header{
    position:sticky;
    top:0;
    z-index:20;
    display:grid;
    background:#e9edf2;
    border-bottom:2px solid #9ba6b2;
    min-width:max-content;
}
.header-cell{
    min-height:54px;
    padding:7px 8px;
    border-right:1px solid #c7cbd0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
    font-weight:bold;
    font-size:13px;
    line-height:16px;
}
.header-title{
    overflow-wrap:anywhere;
}

/* =========================================================
   FILTER BUTTON
========================================================= */
.filter-button{
    flex:0 0 auto;
    width:25px;
    height:25px;
    border:1px solid #9ca3aa;
    border-radius:4px;
    background:#fff;
    cursor:pointer;
    font-size:13px;
}
.filter-button:hover{
    background:#dce6f2;
}
.filter-button.active{
    background:#1d3557;
    color:#fff;
    border-color:#1d3557;
}

/* =========================================================
   VIRTUAL TABLE
========================================================= */
.virtual-content{
    position:relative;
    min-width:max-content;
}
.data-row{
    position:absolute;
    left:0;
    display:grid;
    min-width:max-content;
    width:max-content;
}
.data-cell{
    padding:7px 8px;
    border-right:1px solid #d5d8dc;
    border-bottom:1px solid #d5d8dc;
    font-size:13px;
    line-height:17px;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
    overflow:visible;
    background:#fff;
}
.data-row:nth-child(even) .data-cell{
    background:#fafafa;
}

/* =========================================================
   FROZEN THIQA / BASIC COLUMNS
   ONLY USED FOR data.json
========================================================= */

.frozen-right{
    position:sticky !important;
    z-index:15 !important;
}

/* BASIC = far right */
.frozen-basic{
    position:sticky !important;
    right:0;
    z-index:18 !important;
    box-shadow:-3px 0 4px rgba(0,0,0,.08);
}

/* THIQA = immediately left of BASIC */
.frozen-thiqa{
    position:sticky !important;
    right:110px;
    z-index:18 !important;
    box-shadow:-2px 0 3px rgba(0,0,0,.05);
}

/* Header versions must be above data rows */
.excel-header .frozen-basic,
.excel-header .frozen-thiqa{
    z-index:25 !important;
    background:#e9edf2;
}
    
/* =========================================================
   THIQA / BASIC
========================================================= */
.thiqa-yes,
.basic-yes{
    background:#d9ead3!important;
    color:#222!important;
    font-weight:bold!important;
    text-align:center;
    vertical-align:middle;
}
.thiqa-no,
.basic-no{
    background:#f4cccc!important;
    color:#222!important;
    font-weight:bold!important;
    text-align:center;
    vertical-align:middle;
}

/* =========================================================
   FILTER POPUP
========================================================= */
.filter-popup{
    position:fixed;
    z-index:1000;
    width:330px;
    max-width:calc(100vw - 20px);
    background:#fff;
    border:1px solid #aaa;
    border-radius:6px;
    box-shadow:0 5px 25px rgba(0,0,0,.25);
    display:none;
}
.filter-popup.show{
    display:block;
}
.filter-popup-header{
    padding:10px;
    background:#f0f2f4;
    border-bottom:1px solid #ddd;
    font-weight:bold;
}
.filter-search{
    padding:9px;
    border-bottom:1px solid #ddd;
}
.filter-search input{
    width:100%;
    padding:8px;
    border:1px solid #aaa;
    border-radius:4px;
}
.filter-actions{
    display:flex;
    gap:7px;
    padding:8px;
    border-bottom:1px solid #ddd;
}
.filter-actions button{
    flex:1;
    padding:7px;
    border:1px solid #aaa;
    background:#fff;
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
}
.filter-actions button:hover{
    background:#edf2f7;
}
.filter-values{
    max-height:260px;
    overflow-y:auto;
    padding:5px 8px;
}
.filter-value{
    display:flex;
    align-items:center;
    gap:7px;
    padding:5px 3px;
    font-size:13px;
}
.filter-value:hover{
    background:#f2f2f2;
}
.filter-value span{
    overflow-wrap:anywhere;
    word-break:break-word;
}
.filter-footer{
    display:flex;
    gap:8px;
    padding:9px;
    border-top:1px solid #ddd;
}
.filter-footer button{
    flex:1;
    padding:8px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-weight:bold;
}
.apply-filter{
    background:#198754;
    color:#fff;
}
.cancel-filter{
    background:#6c757d;
    color:#fff;
}

/* =========================================================
   MOBILE
========================================================= */
@media(max-width:800px){

    h1{
        font-size:21px;
    }    

    .tabs{
        justify-content:flex-start;
        flex-wrap:nowrap;
        overflow-x:auto;
    }

    .tab{
        white-space:nowrap;
        padding:10px 16px;
    }

    .search-container{
        grid-template-columns:1fr;
    }

    .excel-area{
        height:calc(100vh - 360px);
    }
}
</style>
</head>

<body>

<div class="top">

<h1>Insurance Coverage List</h1>

<!-- =======================================================
     WORKSHEET TABS
======================================================= -->
<div id="tabs" class="tabs"></div>

<!-- =======================================================
     SEARCH
======================================================= -->
<div class="search-container">

<div class="search-box">
    <input
        id="brandSearch"
        type="text"
        placeholder="Search by Brand Name"
        oninput="applySearch()">
    <span class="search-icon">🔎</span>
</div>

<div class="search-box">
    <input
        id="genericSearch"
        type="text"
        placeholder="Search by Generic Name"
        oninput="applySearch()">
    <span class="search-icon">🔎</span>
</div>

<div class="search-box">
    <input
        id="strengthSearch"
        type="text"
        placeholder="Search by Strength"
        oninput="applySearch()">
    <span class="search-icon">🔎</span>
</div>

<div class="search-box">
    <input
        id="formSearch"
        type="text"
        placeholder="Search by Dosage Form"
        oninput="applySearch()">
    <span class="search-icon">🔎</span>
</div>

</div>

<div class="controls">
<button
    class="control-btn clear-btn"
    onclick="clearSearchAndFilters()">
    Clear Search & Filters
</button>
</div>

</div>

<div id="status" class="status">
    Loading...
</div>

<div
    id="errorBox"
    class="error"
    style="display:none">
</div>

<div
    id="excelArea"
    class="excel-area">

<div
    id="excelHeader"
    class="excel-header">
</div>

<div
    id="virtualContent"
    class="virtual-content">
</div>

</div>

<!-- =======================================================
     FILTER POPUP
======================================================= -->
<div
    id="filterPopup"
    class="filter-popup">

<div
    id="filterPopupHeader"
    class="filter-popup-header">
    Filter
</div>

<div class="filter-search">
    <input
        id="filterValueSearch"
        type="text"
        placeholder="Search values..."
        oninput="renderFilterValues()">
</div>

<div class="filter-actions">

<button onclick="selectAllFilterValues()">
    Select All
</button>

<button onclick="clearAllFilterValues()">
    Clear All
</button>

</div>

<div
    id="filterValues"
    class="filter-values">
</div>

<div class="filter-footer">

<button
    class="apply-filter"
    onclick="applyColumnFilter()">
    Apply
</button>

<button
    class="cancel-filter"
    onclick="closeFilter()">
    Cancel
</button>

</div>
</div>

<script>

/* =========================================================
   WORKSHEETS
   EXACT ORDER REQUESTED
========================================================= */

const WORKSHEETS = [

    {
        id: "thiqa",
        name: "Thiqa & Basic",
        file: "data.json"
    },

    {
        id: "haad",
        name: "HAAD",
        file: "HAAD_LIST.json"
    },

    {
        id: "apg",
        name: "APG FORMULARY 05-06",
        file: "APG FORMULARY 05-06.json"
    },

    {
        id: "icd10",
        name: "ICD10",
        file: "ICD10.json"
    },

    {
        id: "vitamin",
        name: "VITAMIN COVERAGE",
        file: "VITAMIN COVERAGE.json"
    },

    {
        id: "ppi",
        name: "PPI Coverage",
        file: "PPI Coverage.json"
    },

    {
        id: "proactive",
        name: "PROACTIVE INSTRUCTION",
        file: "PROACTIVE INSTRUCTION.json"
    },

    {
        id: "hcpc",
        name: "HCPC Cap & Ref Price",
        file: "HCPC Cap & REf Price.json"
    },

    {
        id: "validity",
        name: "VALIDITY AFTER OPENNING",
        file: "VALIDITY AFTER OPENNING.json"
    },

    {
        id: "cda",
        name: "CDA & CDB MAX DD",
        file: "CDA &CDB MAX DD.json"
    },

    {
        id: "adnic",
        name: "ADNIC (KHALIFA F.)",
        file: "ADNIC ( KHALIFA F. ).json"
    },

    {
        id: "nasHaad",
        name: "Nas TPA Formulary (HAAD)",
        file: "Nas TPA Formulary (HAAD).json"
    },

    {
        id: "nasDha",
        name: "Nas TPA Formulary (DHA)",
        file: "Nas TPA Formulary (DHA).json"
    },

    {
        id: "fmc",
        name: "FMC LIST 01-2026",
        file: "FMC LIST 01-2026.json"
    },

    {
        id: "oman",
        name: "OMAN FORMULARY 03-2024",
        file: "OMAN FORMULARY 03-2024.json"
    },

    {
        id: "phone",
        name: "PHONE CONTACTS",
        file: "PHONE CONTACTS.json"
    }

];

/* =========================================================
   DATA STORAGE
========================================================= */

const sheetData = {};
const sheetColumns = {};
const filteredData = {};
const columnFilters = {};
const rowOffsets = {};
const totalHeights = {};

/* =========================================================
   CURRENT SHEET
   THIQA & BASIC IS DEFAULT
========================================================= */

let currentSheet = "thiqa";

let renderTimer = null;

/* =========================================================
   VIRTUAL SCROLLING
========================================================= */

const MIN_ROW_HEIGHT = 42;
const LINE_HEIGHT = 17;
const ROW_VERTICAL_PADDING = 14;
const BUFFER_ROWS = 30;

/* =========================================================
   FILTER POPUP
========================================================= */

let filterPopupState = {
    column: null,
    sheet: null,
    allValues: [],
    selected: new Set()
};

/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        createTabs();

        initializeSheetStorage();

        loadAllData();

        document.addEventListener(
            "click",
            function(event){

                const popup =
                    document.getElementById(
                        "filterPopup"
                    );

                if(
                    !popup.contains(event.target) &&
                    !event.target.classList.contains(
                        "filter-button"
                    )
                ){
                    closeFilter();
                }

            }
        );

    }
);

/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    const tabs =
        document.getElementById(
            "tabs"
        );

    tabs.innerHTML = "";

    WORKSHEETS.forEach(
        sheet => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "tab";

            if(
                sheet.id ===
                currentSheet
            ){
                button.classList.add(
                    "active"
                );
            }

            button.id =
                "tab-" +
                sheet.id;

            button.textContent =
                sheet.name;

            button.addEventListener(
                "click",
                function(){

                    switchSheet(
                        sheet.id
                    );

                }
            );

            tabs.appendChild(
                button
            );

        }
    );

}

/* =========================================================
   INITIALIZE STORAGE
========================================================= */

function initializeSheetStorage(){

    WORKSHEETS.forEach(
        sheet => {

            sheetData[sheet.id] = [];

            sheetColumns[sheet.id] = [];

            filteredData[sheet.id] = [];

            columnFilters[sheet.id] =
                new Map();

            rowOffsets[sheet.id] = [0];

            totalHeights[sheet.id] = 0;

        }
    );

}

/* =========================================================
   LOAD ALL DATA
========================================================= */

async function loadAllData(){

    const status =
        document.getElementById(
            "status"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );

    status.textContent =
        "Loading worksheets...";

    errorBox.style.display =
        "none";

    try{

        /*
           Load every JSON independently.

           If one file fails, the other sheets
           can still work.
        */

        const results =
            await Promise.all(
                WORKSHEETS.map(
                    async sheet => {

                        try{

                            const response =
                                await fetch(
                                    encodeURI(
                                        sheet.file
                                    ) +
                                    "?v=" +
                                    Date.now(),
                                    {
                                        cache:
                                            "no-store"
                                    }
                                );

                            if(
                                !response.ok
                            ){

                                throw new Error(
                                    "HTTP " +
                                    response.status
                                );

                            }

                            const json =
                                await response.json();

                            const data =
                                normalizeData(
                                    json
                                );

                            return {
                                sheet:
                                    sheet,
                                data:
                                    data,
                                error:
                                    null
                            };

                        }
                        catch(error){

                            return {
                                sheet:
                                    sheet,
                                data:
                                    [],
                                error:
                                    error
                            };

                        }

                    }
                )
            );

        let loadedCount = 0;
        let errors = [];

        results.forEach(
            result => {

                const id =
                    result.sheet.id;

                if(
                    result.error
                ){

                    errors.push(
                        result.sheet.name +
                        " → " +
                        result.sheet.file +
                        " → " +
                        result.error.message
                    );

                    sheetData[id] = [];
                    sheetColumns[id] = [];
                    filteredData[id] = [];

                    return;

                }

                if(
                    !Array.isArray(
                        result.data
                    )
                ){

                    errors.push(
                        result.sheet.name +
                        " → JSON is not an array."
                    );

                    return;

                }

                sheetData[id] =
                    result.data;

                /*
                   Automatically detect
                   the actual columns in
                   each JSON file.
                */

                sheetColumns[id] =
                    getColumns(
                        result.data
                    );

                filteredData[id] =
                    [
                        ...result.data
                    ];

                columnFilters[id].clear();

                buildRowOffsets(
                    id
                );

                loadedCount++;

            }
        );

        /*
           Thiqa & Basic MUST be
           the first sheet displayed.
        */

        currentSheet = "thiqa";

        updateTabActiveState();

        if(
            sheetData.thiqa.length === 0
        ){

            throw new Error(
                "data.json could not be loaded or contains 0 records."
            );

        }

        renderVirtualTable(
            currentSheet
        );

        updateSearchPlaceholders();

        updateStatus();

        if(
            errors.length > 0
        ){

            errorBox.style.display =
                "block";

            errorBox.textContent =
                "Some worksheets could not be loaded:\n\n" +
                errors.join(
                    "\n"
                );

        }

    }
    catch(error){

        console.error(
            "Insurance Coverage List Error:",
            error
        );

        status.textContent =
            "Unable to load data.";

        errorBox.style.display =
            "block";

        errorBox.textContent =
            "ERROR LOADING DATA\n\n" +
            error.message;

    }

}

/* =========================================================
   NORMALIZE JSON
========================================================= */

function normalizeData(json){

    if(
        Array.isArray(json)
    ){

        return json;

    }

    if(
        json &&
        Array.isArray(
            json.data
        )
    ){

        return json.data;

    }

    /*
       Also support common
       JSON object formats.
    */

    if(
        json &&
        typeof json === "object"
    ){

        const keys =
            Object.keys(json);

        for(
            const key of keys
        ){

            if(
                Array.isArray(
                    json[key]
                )
            ){

                return json[key];

            }

        }

    }

    return [];

}

/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(data){

    if(
        !Array.isArray(data) ||
        data.length === 0
    ){

        return [];

    }

    /*
       Collect ALL keys from all
       records, not just the first row.

       This protects against JSON files
       where some columns appear later.
    */

    const columns = [];

    const seen =
        new Set();

    data.forEach(
        row => {

            if(
                row &&
                typeof row === "object"
            ){

                Object.keys(
                    row
                ).forEach(
                    key => {

                        if(
                            !seen.has(key)
                        ){

                            seen.add(key);

                            columns.push(
                                key
                            );

                        }

                    }
                );

            }

        }
    );

    return columns;

}

/* =========================================================
   SWITCH SHEET
========================================================= */

function switchSheet(type){

    if(
        !sheetData.hasOwnProperty(
            type
        )
    ){

        return;

    }

    currentSheet = type;

    updateTabActiveState();

    /*
       Close any filter belonging
       to the previous worksheet.
    */

    closeFilter();

    /*
       Clear search boxes when
       changing worksheet.
    */

    document
        .getElementById(
            "brandSearch"
        )
        .value = "";

    document
        .getElementById(
            "genericSearch"
        )
        .value = "";

    document
        .getElementById(
            "strengthSearch"
        )
        .value = "";

    document
        .getElementById(
            "formSearch"
        )
        .value = "";

    /*
       Restore all rows for this sheet
       according to its own filters.
    */

    filteredData[type] =
        getFilteredRows(
            type
        );

    buildRowOffsets(
        type
    );

    /*
       Return to top when changing
       worksheet.
    */

    const area =
        document.getElementById(
            "excelArea"
        );

    area.scrollTop = 0;
    area.scrollLeft = 0;

    updateSearchPlaceholders();

    renderVirtualTable(
        type
    );

    updateStatus();

}

/* =========================================================
   ACTIVE TAB
========================================================= */

function updateTabActiveState(){

    WORKSHEETS.forEach(
        sheet => {

            const tab =
                document.getElementById(
                    "tab-" +
                    sheet.id
                );

            if(tab){

                tab.classList.toggle(
                    "active",
                    sheet.id ===
                    currentSheet
                );

            }

        }
    );

}

/* =========================================================
   SEARCH PLACEHOLDERS
========================================================= */

function updateSearchPlaceholders(){

    const columns =
        sheetColumns[
            currentSheet
        ] || [];

    const brand =
        findColumn(
            columns,
            [
                "proactive name",
                "brand name",
                "package name"
            ]
        );

    const generic =
        findColumn(
            columns,
            [
                "generic name"
            ]
        );

    const strength =
        findColumn(
            columns,
            [
                "strength"
            ]
        );

    const dosage =
        findColumn(
            columns,
            [
                "dosage form"
            ]
        );

    const brandInput =
        document.getElementById(
            "brandSearch"
        );

    const genericInput =
        document.getElementById(
            "genericSearch"
        );

    const strengthInput =
        document.getElementById(
            "strengthSearch"
        );

    const formInput =
        document.getElementById(
            "formSearch"
        );

    brandInput.placeholder =
        brand
            ? "Search by " + brand
            : "Search all data";

    genericInput.placeholder =
        generic
            ? "Search by " + generic
            : "Search all data";

    strengthInput.placeholder =
        strength
            ? "Search by " + strength
            : "Search all data";

    formInput.placeholder =
        dosage
            ? "Search by " + dosage
            : "Search all data";

}

/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(
    columns,
    possibleNames
){

    for(
        const wanted of possibleNames
    ){

        const exact =
            columns.find(
                column =>
                    column
                        .toLowerCase()
                        .trim() ===
                    wanted
                        .toLowerCase()
                        .trim()
            );

        if(exact){

            return exact;

        }

    }

    return null;

}

/* =========================================================
   SEARCH
========================================================= */

function parseSearch(value){

    return value
        .toLowerCase()
        .split("%")
        .map(
            item =>
                item.trim()
        )
        .filter(Boolean);

}

function cellMatchesSearch(
    value,
    searchText
){

    const terms =
        parseSearch(
            searchText
        );

    if(
        terms.length === 0
    ){

        return true;

    }

    const text =
        String(
            value ?? ""
        ).toLowerCase();

    return terms.every(
        term =>
            text.includes(
                term
            )
    );

}

   APPLY SEARCH
========================================================= */

function applySearch(){

    filteredData[
        currentSheet
    ] =
        getFilteredRows(
            currentSheet
        );

    buildRowOffsets(
        currentSheet
    );

    renderVirtualTable(
        currentSheet
    );

    updateStatus();

}

/* =========================================================
   FILTER DATA
========================================================= */

function getFilteredRows(
    type
){

    const data =
        sheetData[type] || [];

    const columns =
        sheetColumns[type] || [];

    /*
       Identify standard medicine
       columns if they exist.
    */

    const brandColumn =
        findColumn(
            columns,
            [
                "proactive name",
                "brand name",
                "package name"
            ]
        );

    const genericColumn =
        findColumn(
            columns,
            [
                "generic name"
            ]
        );

    const strengthColumn =
        findColumn(
            columns,
            [
                "strength"
            ]
        );

    const formColumn =
        findColumn(
            columns,
            [
                "dosage form"
            ]
        );

    const brandSearch =
        document.getElementById(
            "brandSearch"
        ).value;

    const genericSearch =
        document.getElementById(
            "genericSearch"
        ).value;

    const strengthSearch =
        document.getElementById(
            "strengthSearch"
        ).value;

    const formSearch =
        document.getElementById(
            "formSearch"
        ).value;

    /*
       If this worksheet has the
       standard medicine columns,
       use the four dedicated searches.

       Otherwise, use any entered search
       as a search across the whole row.
    */

    const hasStandardColumns =
        brandColumn ||
        genericColumn ||
        strengthColumn ||
        formColumn;

    return data.filter(
        row => {

            if(
                !rowPassesFilters(
                    row,
                    type
                )
            ){

                return false;

            }

            if(
                hasStandardColumns
            ){

                if(
                    brandColumn &&
                    !cellMatchesSearch(
                        row[brandColumn],
                        brandSearch
                    )
                ){

                    return false;

                }

                if(
                    genericColumn &&
                    !cellMatchesSearch(
                        row[genericColumn],
                        genericSearch
                    )
                ){

                    return false;

                }

                if(
                    strengthColumn &&
                    !cellMatchesSearch(
                        row[strengthColumn],
                        strengthSearch
                    )
                ){

                    return false;

                }

                if(
                    formColumn &&
                    !cellMatchesSearch(
                        row[formColumn],
                        formSearch
                    )
                ){

                    return false;

                }

                /*
                   If a search box is being used
                   but its corresponding column
                   does not exist, search the whole
                   row.
                */

                if(
                    !brandColumn &&
                    parseSearch(
                        brandSearch
                    ).length > 0 &&
                    !rowContainsTerms(
                        row,
                        brandSearch
                    )
                ){

                    return false;

                }

                if(
                    !genericColumn &&
                    parseSearch(
                        genericSearch
                    ).length > 0 &&
                    !rowContainsTerms(
                        row,
                        genericSearch
                    )
                ){

                    return false;

                }

                if(
                    !strengthColumn &&
                    parseSearch(
                        strengthSearch
                    ).length > 0 &&
                    !rowContainsTerms(
                        row,
                        strengthSearch
                    )
                ){

                    return false;

                }

                if(
                    !formColumn &&
                    parseSearch(
                        formSearch
                    ).length > 0 &&
                    !rowContainsTerms(
                        row,
                        formSearch
                    )
                ){

                    return false;

                }

                return true;

            }

            /*
               Completely different worksheet
               structure:
               search across the entire row.
            */

            const allSearches = [
                brandSearch,
                genericSearch,
                strengthSearch,
                formSearch
            ];

            for(
                const searchText
                of allSearches
            ){

                if(
                    parseSearch(
                        searchText
                    ).length > 0 &&
                    !rowContainsTerms(
                        row,
                        searchText
                    )
                ){

                    return false;

                }

            }

            return true;

        }
    );

}

/* =========================================================
   SEARCH WHOLE ROW
========================================================= */

function rowContainsTerms(
    row,
    searchText
){

    const terms =
        parseSearch(
            searchText
        );

    if(
        terms.length === 0
    ){

        return true;

    }

    const rowText =
        Object.values(
            row || {}
        )
        .map(
            value =>
                String(
                    value ?? ""
                ).toLowerCase()
        )
        .join(" ");

    return terms.every(
        term =>
            rowText.includes(
                term
            )
    );

}

/* =========================================================
   COLUMN FILTERS
========================================================= */

function rowPassesFilters(
    row,
    type
){

    const filters =
        columnFilters[type];

    for(
        const [
            column,
            selectedValues
        ]
        of filters.entries()
    ){

        const value =
            String(
                row[column] ?? ""
            );

        if(
            selectedValues.size === 0
        ){

            return false;

        }

        if(
            !selectedValues.has(
                value
            )
        ){

            return false;

        }

    }

    return true;

}

========================================================= */

function openFilter(
    column,
    button
){

    const popup =
        document.getElementById(
            "filterPopup"
        );

    filterPopupState.column =
        column;

    filterPopupState.sheet =
        currentSheet;

    document
        .getElementById(
            "filterPopupHeader"
        )
        .textContent =
            "Filter: " +
            column;

    document
        .getElementById(
            "filterValueSearch"
        )
        .value = "";

    const data =
        sheetData[
            currentSheet
        ] || [];

    const values = [
        ...new Set(
            data.map(
                row =>
                    String(
                        row[column] ?? ""
                    )
            )
        )
    ].sort(
        (a,b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );

    filterPopupState.allValues =
        values;

    const existing =
        columnFilters[
            currentSheet
        ].get(
            column
        );

    if(existing){

        filterPopupState.selected =
            new Set(
                existing
            );

    }
    else{

        filterPopupState.selected =
            new Set(
                values
            );

    }

    renderFilterValues();

    const rect =
        button.getBoundingClientRect();

    const popupWidth = 330;
    const popupHeight = 420;

    let left =
        rect.left;

    let top =
        rect.bottom + 5;

    if(
        left + popupWidth >
        window.innerWidth
    ){

        left =
            window.innerWidth -
            popupWidth -
            10;

    }

    if(
        top + popupHeight >
        window.innerHeight
    ){

        top =
            rect.top -
            popupHeight -
            5;

    }

    if(
        top < 10
    ){

        top = 10;

    }

    if(
        left < 10
    ){

        left = 10;

    }

    popup.style.left =
        left + "px";

    popup.style.top =
        top + "px";

    popup.classList.add(
        "show"
    );

}

/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValues(){

    const container =
        document.getElementById(
            "filterValues"
        );

    const search =
        document
            .getElementById(
                "filterValueSearch"
            )
            .value
            .trim()
            .toLowerCase();

    const allValues =
        filterPopupState.allValues ||
        [];

    const selected =
        filterPopupState.selected ||
        new Set();

    const visibleValues =
        allValues.filter(
            value =>
                value
                    .toLowerCase()
                    .includes(
                        search
                    )
        );

    container.innerHTML = "";

    if(
        visibleValues.length === 0
    ){

        container.innerHTML =
            '<div style="padding:12px;color:#777;">No matching values</div>';

        return;

    }

    const fragment =
        document.createDocumentFragment();

    visibleValues.forEach(
        value => {

            const label =
                document.createElement(
                    "label"
                );

            label.className =
                "filter-value";

            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.checked =
                selected.has(
                    value
                );

            checkbox.addEventListener(
                "change",
                function(){

                    if(
                        checkbox.checked
                    ){

                        selected.add(
                            value
                        );

                    }
                    else{

                        selected.delete(
                            value
                        );

                    }

                }
            );

            const span =
                document.createElement(
                    "span"
                );

            span.textContent =
                value === ""
                    ? "(Blank)"
                    : value;

            label.appendChild(
                checkbox
            );

            label.appendChild(
                span
            );

            fragment.appendChild(
                label
            );

        }
    );

    container.appendChild(
        fragment
    );

}

/* =========================================================
   APPLY FILTER
========================================================= */

function applyColumnFilter(){

    const column =
        filterPopupState.column;

    const type =
        filterPopupState.sheet;

    const allValues =
        filterPopupState.allValues ||
        [];

    const selected =
        filterPopupState.selected ||
        new Set();

    const search =
        document
            .getElementById(
                "filterValueSearch"
            )
            .value
            .trim()
            .toLowerCase();

    if(
        search !== ""
    ){

        const matchingValues =
            allValues.filter(
                value =>
                    value
                        .toLowerCase()
                        .includes(
                            search
                        )
            );

        if(
            matchingValues.length ===
            allValues.length
        ){

            columnFilters[type]
                .delete(
                    column
                );

        }
        else{

            columnFilters[type]
                .set(
                    column,
                    new Set(
                        matchingValues
                    )
                );

        }

    }
    else{

        if(
            selected.size ===
            allValues.length
        ){

            columnFilters[type]
                .delete(
                    column
                );

        }
        else{

            columnFilters[type]
                .set(
                    column,
                    new Set(
                        selected
                    )
                );

        }

    }

    closeFilter();

    filteredData[type] =
        getFilteredRows(
            type
        );

    buildRowOffsets(
        type
    );

    renderVirtualTable(
        type
    );

    updateStatus();

}

/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(
    column
){

    const lower =
        column.toLowerCase();

    if(
        lower.includes(
            "generic name"
        ) ||
        lower.includes(
            "package name"
        ) ||
        lower.includes(
            "manufacturer"
        ) ||
        lower.includes(
            "agent name"
        ) ||
        lower.includes(
            "insurance coverage"
        ) ||
        lower.includes(
            "formulary"
        ) ||
        lower.includes(
            "proactive name"
        ) ||
        lower.includes(
            "daman coverage"
        ) ||
        lower.includes(
            "description"
        ) ||
        lower.includes(
            "instruction"
        ) ||
        lower.includes(
            "indication"
        )
    ){

        return 280;

    }

    if(
        lower.includes(
            "strength"
        ) ||
        lower.includes(
            "dosage form"
        )
    ){

        return 160;

    }

    if(
        lower.includes(
            "price"
        ) ||
        lower.includes(
            "markup"
        ) ||
        lower.includes(
            "reimbursement"
        ) ||
        lower.includes(
            "co-pay"
        ) ||
        lower.includes(
            "copay"
        )
    ){

        return 155;

    }

    if(
        lower.includes(
            "date"
        )
    ){

        return 140;

    }

    if(
        lower === "thiqa" ||
        lower === "basic"
    ){

        return 110;

    }

    return 150;

}

/* =========================================================
   GRID
========================================================= */

function getGridTemplate(
    type
){

    return sheetColumns[type]
        .map(
            column =>
                getColumnWidth(
                    column
                ) +
                "px"
        )
        .join(" ");

}

/* =========================================================
   ROW HEIGHT
========================================================= */

function calculateRowHeight(
    row,
    type
){

    let maxLines = 1;

    const columns =
        sheetColumns[type] || [];

    columns.forEach(
        column => {

            const value =
                String(
                    row[column] ?? ""
                );

            const width =
                getColumnWidth(
                    column
                );

            const charsPerLine =
                Math.max(
                    8,
                    Math.floor(
                        width / 7
                    )
                );

            const paragraphs =
                value.split(
                    "\n"
                );

            let lines = 0;

            paragraphs.forEach(
                paragraph => {

                    if(
                        paragraph.length === 0
                    ){

                        lines += 1;

                    }
                    else{

                        lines += Math.max(
                            1,
                            Math.ceil(
                                paragraph.length /
                                charsPerLine
                            )
                        );

                    }

                }
            );

            maxLines =
                Math.max(
                    maxLines,
                    lines
                );

        }
    );

    return Math.max(
        MIN_ROW_HEIGHT,
        maxLines *
        LINE_HEIGHT +
        ROW_VERTICAL_PADDING
    );

}

/* =========================================================
   ROW OFFSETS
========================================================= */

function buildRowOffsets(
    type
){

    const data =
        filteredData[type] || [];

    const offsets =
        new Array(
            data.length + 1
        );

    offsets[0] = 0;

    for(
        let i = 0;
        i < data.length;
        i++
    ){

        offsets[i + 1] =
            offsets[i] +
            calculateRowHeight(
                data[i],
                type
            );

    }

    rowOffsets[type] =
        offsets;

    totalHeights[type] =
        offsets[
            offsets.length - 1
        ] || 0;

}

/* =========================================================
   FIND ROW
========================================================= */

function findRowAtPosition(
    offsets,
    position
){

    let low = 0;

    let high =
        offsets.length - 1;

    while(
        low < high
    ){

        const mid =
            Math.floor(
                (low + high) / 2
            );

        if(
            offsets[mid] <=
            position
        ){

            low =
                mid + 1;

        }
        else{

            high =
                mid;

        }

    }

    return Math.max(
        0,
        low - 1
    );

}

                    }

                    if(
                        normalized === "no"
                    ){

                        cell.classList.add(
                            "basic-no"
                        );

                    }

                }

                row.appendChild(
                    cell
                );

            }
        );

        fragment.appendChild(
            row
        );

    }

    content.appendChild(
        fragment
    );

}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        buildRowOffsets(
            currentSheet
        );

        renderVirtualTable(
            currentSheet
        );

    }
);

</script>
