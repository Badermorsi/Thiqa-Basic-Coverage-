<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f7;
    color:#222;
}

body{
    overflow-x:hidden;
}

/* =========================
   TOP
========================= */

.top{
    background:#fff;
    padding:18px 20px 12px;
    border-bottom:1px solid #d9d9d9;
}

h1{
    margin:0 0 15px;
    text-align:center;
    font-size:26px;
    color:#1d3557;
}

/* =========================
   TABS
========================= */

.tabs{
    display:grid;
    grid-template-columns:repeat(8,minmax(0,1fr));
    gap:8px;
    width:100%;
    max-width:1600px;
    margin:0 auto 15px;
}

.tab{
    width:100%;
    border:1px solid #b8b8b8;
    background:#eee;
    padding:10px 7px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
    text-align:center;
    white-space:normal;
    line-height:16px;
}

.tab:hover{
    background:#e1e5e9;
}

.tab.active{
    background:#1d3557;
    color:#fff;
    border-color:#1d3557;
}

/* =========================
   SEARCH
========================= */

.search-container{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    max-width:1600px;
    margin:0 auto 10px;
}

.search-container input{
    width:100%;
    padding:10px 12px;
    border:1px solid #c5cbd1;
    border-radius:5px;
    font-size:14px;
    outline:none;
    background:#fff;
}

.search-container input:focus{
    border-color:#1d3557;
}

.controls{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
}

.clear-btn{
    border:1px solid #1d3557;
    background:#1d3557;
    color:#fff;
    padding:9px 18px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.clear-btn:hover{
    background:#16304e;
}

/* =========================
   STATUS
========================= */

.status{
    text-align:center;
    font-size:13px;
    color:#555;
    margin:6px 0 10px;
}

.error-box{
    display:none;
    max-width:1600px;
    margin:0 auto 10px;
    background:#f8d7da;
    color:#721c24;
    border:1px solid #f1b0b7;
    padding:10px;
    border-radius:5px;
    white-space:pre-wrap;
}

/* =========================
   EXCEL AREA
========================= */

.excel-area{
    position:relative;
    width:100%;
    height:calc(100vh - 225px);
    min-height:450px;
    overflow:auto;
    background:#fff;
    border-top:1px solid #c8c8c8;
}

/*
   Inner scrolling container.
   The table can become wider than the
   screen only when necessary.
*/

.excel-scroll{
    position:relative;
    width:100%;
    min-width:100%;
}

/* =========================
   TABLE HEADER
========================= */

.excel-header{
    position:sticky;
    top:0;
    z-index:20;

    display:grid;

    width:max-content;
    min-width:100%;

    background:#e9edf2;
    border-bottom:2px solid #9ba6b2;
}

.header-cell{
    position:relative;

    min-width:0;
    min-height:54px;

    padding:7px 32px 7px 8px;

    border-right:1px solid #c7cbd0;

    display:flex;
    align-items:center;

    font-weight:bold;
    font-size:13px;
    line-height:16px;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.filter-btn{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);

    width:22px;
    height:22px;

    border:1px solid #adb5bd;
    background:#fff;
    border-radius:4px;

    cursor:pointer;
    font-size:10px;
    padding:0;
}

.filter-btn:hover{
    background:#eef2f5;
}

.filter-btn.filtered{
    background:#1d3557;
    color:#fff;
}

/* =========================
   VIRTUAL TABLE
========================= */

.virtual-content{
    position:relative;
    width:100%;
    min-width:max-content;
}

.data-row{
    position:absolute;
    left:0;

    display:grid;

    width:max-content;
    min-width:100%;

    background:#fff;
}

.data-cell{
    min-width:0;

    padding:7px 8px;

    border-right:1px solid #d5d8dc;
    border-bottom:1px solid #d5d8dc;

    font-size:13px;
    line-height:17px;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;

    overflow:visible;
}

.data-row:nth-child(even) .data-cell{
    background:#fafafa;
}

/* =========================
   THIQA / BASIC
========================= */

.thiqa-yes,
.basic-yes{
    background:#d9ead3 !important;
    color:#222 !important;
    font-weight:bold !important;
    text-align:center;
}

.thiqa-no,
.basic-no{
    background:#f4cccc !important;
    color:#222 !important;
    font-weight:bold !important;
    text-align:center;
}

/* =========================
   FROZEN COLUMNS
========================= */

.frozen-basic{
    position:sticky !important;
    right:0;
    z-index:18 !important;
    box-shadow:-3px 0 4px rgba(0,0,0,.08);
}

.frozen-thiqa{
    position:sticky !important;
    right:var(--basic-width,110px);
    z-index:18 !important;
    box-shadow:-2px 0 3px rgba(0,0,0,.05);
}

.excel-header .frozen-basic,
.excel-header .frozen-thiqa{
    z-index:25 !important;
}

/* =========================
   FILTER POPUP
========================= */

.filter-popup{
    display:none;

    position:fixed;
    z-index:1000;

    width:280px;
    max-height:420px;

    background:#fff;

    border:1px solid #b9c1c8;
    border-radius:6px;

    box-shadow:0 5px 20px rgba(0,0,0,.18);

    overflow:hidden;
}

.filter-popup.show{
    display:block;
}

.filter-popup-header{
    padding:10px;
    border-bottom:1px solid #ddd;
    background:#f5f7f9;
    font-weight:bold;
    font-size:13px;
}

.filter-search{
    padding:8px;
    border-bottom:1px solid #ddd;
}

.filter-search input{
    width:100%;
    padding:7px 8px;
    border:1px solid #c7cdd3;
    border-radius:4px;
}

.filter-actions{
    display:flex;
    gap:6px;
    padding:8px;
    border-bottom:1px solid #ddd;
}

.filter-actions button{
    flex:1;
    padding:7px;

    border:1px solid #c3cad1;
    background:#fff;
    border-radius:4px;

    cursor:pointer;
}

.filter-actions button:hover{
    background:#eef2f5;
}

.filter-values{
    max-height:280px;
    overflow-y:auto;
    padding:6px 8px;
}

.filter-value{
    display:flex;
    align-items:center;
    gap:7px;

    padding:5px 2px;

    font-size:12px;
}

.filter-value input{
    margin:0;
}

/* =========================
   PROACTIVE INSTRUCTION
========================= */

.special-content{
    display:none;

    width:100%;
    min-height:calc(100vh - 170px);

    background:#fff;

    padding:15px;
}

.proactive-image{
    display:block;

    width:100%;
    max-width:1600px;
    height:auto;

    margin:0 auto 20px;

    object-fit:contain;
}

.proactive-image:last-child{
    margin-bottom:0;
}

.proactive-error{
    text-align:center;
    color:#a94442;
    font-weight:bold;
    padding:20px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .tabs{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .search-container{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}

@media(max-width:800px){

    h1{
        font-size:21px;
    }

    .top{
        padding:12px 8px 8px;
    }

    .tabs{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
    }

    .tab{
        font-size:12px;
        padding:9px 5px;
    }

    .search-container{
        grid-template-columns:1fr;
    }

    .excel-area{
        height:calc(100vh - 360px);
    }

    .special-content{
        padding:8px;
    }

}

</style>
</head>

<script>

/* =========================================================
   WORKSHEETS
========================================================= */

const WORKSHEETS = [

    {
        id:"thiqa",
        name:"Thiqa & Basic",
        file:"data.json"
    },

    {
        id:"haad",
        name:"HAAD",
        file:"HAAD_LIST.json"
    },

    {
        id:"apg",
        name:"APG FORMULARY 05-06",
        file:"APG FORMULARY 05-06.json"
    },

    {
        id:"icd10",
        name:"ICD10",
        file:"ICD10.json"
    },

    {
        id:"vitamin",
        name:"VITAMIN COVERAGE",
        file:"VITAMIN COVERAGE.json"
    },

    {
        id:"ppi",
        name:"PPI Coverage",
        file:"PPI Coverage.json"
    },

    {
        id:"proactive",
        name:"PROACTIVE INSTRUCTION",
        special:true
    },

    {
        id:"hcpc",
        name:"HCPC Cap & Ref Price",
        file:"HCPC Cap & REf Price.json"
    },

    {
        id:"validity",
        name:"VALIDITY AFTER OPENNING",
        file:"VALIDITY AFTER OPENNING.json"
    },

    {
        id:"cda",
        name:"CDA & CDB MAX DD",
        file:"CDA &CDB MAX DD.json"
    },

    {
        id:"adnic",
        name:"ADNIC (KHALIFA F.)",
        file:"ADNIC ( KHALIFA F. ).json"
    },

    {
        id:"nasHaad",
        name:"Nas TPA Formulary (HAAD)",
        file:"Nas TPA Formulary (HAAD).json"
    },

    {
        id:"nasDha",
        name:"Nas TPA Formulary (DHA)",
        file:"Nas TPA Formulary (DHA).json"
    },

    {
        id:"fmc",
        name:"FMC LIST 01-2026",
        file:"FMC LIST 01-2026.json"
    },

    {
        id:"oman",
        name:"OMAN FORMULARY 03-2024",
        file:"OMAN FORMULARY 03-2024.json"
    },

    {
        id:"phone",
        name:"PHONE CONTACTS",
        file:"PHONE CONTACTS.json"
    }

];


/* =========================================================
   DATA STORAGE
========================================================= */

const sheetData = {};
const sheetColumns = {};
const filteredData = {};
const columnFilters = {};

const rowOffsets = {};
const totalHeights = {};

let currentSheet = "thiqa";

let renderFrame = null;

const MIN_ROW_HEIGHT = 42;
const LINE_HEIGHT = 17;
const ROW_VERTICAL_PADDING = 14;

const BUFFER_ROWS = 25;


/* =========================================================
   FILTER STATE
========================================================= */

let filterPopupState = {

    column:null,

    sheet:null,

    allValues:[],

    selected:new Set()

};


/* =========================================================
   DOM
========================================================= */

const tabsEl =
    document.getElementById(
        "tabs"
    );

const statusEl =
    document.getElementById(
        "status"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const excelArea =
    document.getElementById(
        "excelArea"
    );

const excelScroll =
    document.getElementById(
        "excelScroll"
    );

const excelHeader =
    document.getElementById(
        "excelHeader"
    );

const virtualContent =
    document.getElementById(
        "virtualContent"
    );

const specialContent =
    document.getElementById(
        "specialContent"
    );

const searchArea =
    document.getElementById(
        "searchArea"
    );

const brandSearch =
    document.getElementById(
        "brandSearch"
    );

const genericSearch =
    document.getElementById(
        "genericSearch"
    );

const strengthSearch =
    document.getElementById(
        "strengthSearch"
    );

const dosageSearch =
    document.getElementById(
        "dosageSearch"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const filterPopup =
    document.getElementById(
        "filterPopup"
    );

const filterPopupHeader =
    document.getElementById(
        "filterPopupHeader"
    );

const filterValueSearch =
    document.getElementById(
        "filterValueSearch"
    );

const filterValues =
    document.getElementById(
        "filterValues"
    );

const selectAllBtn =
    document.getElementById(
        "selectAllBtn"
    );

const clearFilterBtn =
    document.getElementById(
        "clearFilterBtn"
    );


/* =========================================================
   INITIALIZE
========================================================= */

function initializeSheetStorage(){

    WORKSHEETS.forEach(sheet => {

        sheetData[sheet.id] = [];

        sheetColumns[sheet.id] = [];

        filteredData[sheet.id] = [];

        columnFilters[sheet.id] = {};

        rowOffsets[sheet.id] = [];

        totalHeights[sheet.id] = 0;

    });

}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsEl.innerHTML = "";

    WORKSHEETS.forEach(sheet => {

        const button =
            document.createElement(
                "button"
            );

        button.type = "button";

        button.className = "tab";

        button.dataset.sheet =
            sheet.id;

        button.textContent =
            sheet.name;


        if(sheet.id === currentSheet){

            button.classList.add(
                "active"
            );

        }


        button.addEventListener(
            "click",
            () => {

                switchSheet(
                    sheet.id
                );

            }
        );


        tabsEl.appendChild(
            button
        );

    });

}


/* =========================================================
   LOAD ALL JSON FILES
   FAST PARALLEL LOADING
========================================================= */

async function loadAllData(){

    errorBox.style.display =
        "none";


    const results =
        await Promise.all(

            WORKSHEETS.map(
                async sheet => {

                    /*
                       PROACTIVE has no JSON
                    */

                    if(sheet.special){

                        return {
                            sheet,
                            rows:[],
                            error:null
                        };

                    }


                    try{

                        const response =
                            await fetch(
                                encodeURI(
                                    sheet.file
                                ) +
                                "?v=" +
                                Date.now(),
                                {
                                    cache:
                                        "no-store"
                                }
                            );


                        if(!response.ok){

                            throw new Error(
                                "HTTP " +
                                response.status
                            );

                        }


                        const json =
                            await response.json();


                        return {

                            sheet,

                            rows:
                                normalizeJSON(
                                    json
                                ),

                            error:null

                        };

                    }
                    catch(error){

                        console.error(
                            sheet.name,
                            error
                        );


                        return {

                            sheet,

                            rows:[],

                            error

                        };

                    }

                }
            )

        );


    const errors = [];


    results.forEach(
        result => {

            const sheet =
                result.sheet;


            if(sheet.special){
                return;
            }


            sheetData[sheet.id] =
                result.rows;


            sheetColumns[sheet.id] =
                buildColumns(
                    result.rows
                );


            filteredData[sheet.id] =
                result.rows.slice();


            columnFilters[sheet.id] =
                {};


            if(result.error){

                errors.push(
                    sheet.name +
                    ": " +
                    result.error.message
                );

            }

        }
    );


    /*
       Do NOT calculate every row
       for every worksheet during loading.

       Only the active sheet gets
       calculated.
    */

    switchSheet(
        "thiqa"
    );


    if(errors.length){

        errorBox.textContent =
            "Some sheets could not be loaded:\n\n" +
            errors.join("\n");

        errorBox.style.display =
            "block";

    }

}


/* =========================================================
   NORMALIZE JSON
========================================================= */

function normalizeJSON(json){

    if(Array.isArray(json)){
        return json;
    }


    if(
        json &&
        Array.isArray(json.data)
    ){

        return json.data;

    }


    if(
        json &&
        typeof json === "object"
    ){

        const keys =
            Object.keys(json);


        for(
            let i = 0;
            i < keys.length;
            i++
        ){

            const value =
                json[keys[i]];


            if(Array.isArray(value)){

                return value;

            }

        }

    }


    return [];

}


/* =========================================================
   BUILD COLUMNS
========================================================= */

function buildColumns(rows){

    const columns = [];


    for(
        let i = 0;
        i < rows.length;
        i++
    ){

        const row =
            rows[i];


        if(
            !row ||
            typeof row !== "object" ||
            Array.isArray(row)
        ){
            continue;
        }


        const keys =
            Object.keys(row);


        for(
            let j = 0;
            j < keys.length;
            j++
        ){

            const key =
                keys[j];


            if(
                !columns.includes(key)
            ){

                columns.push(key);

            }

        }

    }


    return columns;

}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function displayValue(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    if(
        typeof value === "object"
    ){

        try{

            return JSON.stringify(
                value
            );

        }
        catch{

            return String(value);

        }

    }


    return String(value);

}


/* =========================================================
   MULTI TERM SEARCH
   Example:
   500%10
========================================================= */

function matchesMultiSearch(
    value,
    search
){

    const query =
        String(
            search || ""
        )
        .trim()
        .toLowerCase();


    if(!query){
        return true;
    }


    const text =
        displayValue(
            value
        )
        .toLowerCase();


    const terms =
        query
            .split("%")
            .map(
                term =>
                    term.trim()
            )
            .filter(Boolean);


    for(
        let i = 0;
        i < terms.length;
        i++
    ){

        if(
            !text.includes(
                terms[i]
            )
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(
    columns,
    patterns
){

    for(
        let i = 0;
        i < patterns.length;
        i++
    ){

        const pattern =
            patterns[i];


        for(
            let j = 0;
            j < columns.length;
            j++
        ){

            if(
                columns[j]
                    .toLowerCase()
                    .trim()
                    .includes(pattern)
            ){

                return columns[j];

            }

        }

    }


    return null;

}


/* =========================================================
   GET FILTERED ROWS
========================================================= */

function getFilteredRows(type){

    const rows =
        sheetData[type] || [];


    const columns =
        sheetColumns[type] || [];


    if(!rows.length){
        return [];
    }


    const brandColumn =
        findColumn(
            columns,
            [
                "brand name",
                "brand",
                "product name",
                "item name",
                "package name"
            ]
        );


    const genericColumn =
        findColumn(
            columns,
            [
                "generic name",
                "active ingredient",
                "active ingredients",
                "generic",
                "ingredient"
            ]
        );


    const strengthColumn =
        findColumn(
            columns,
            [
                "strength"
            ]
        );


    const dosageColumn =
        findColumn(
            columns,
            [
                "dosage form",
                "dosage"
            ]
        );


    const brandQuery =
        brandSearch.value;


    const genericQuery =
        genericSearch.value;


    const strengthQuery =
        strengthSearch.value;


    const dosageQuery =
        dosageSearch.value;


    const filters =
        columnFilters[type] || {};


    return rows.filter(
        row => {


            /*
               BRAND
            */

            if(brandQuery){

                if(brandColumn){

                    if(
                        !matchesMultiSearch(
                            row[brandColumn],
                            brandQuery
                        )
                    ){

                        return false;

                    }

                }
                else{

                    const found =
                        Object.values(row)
                            .some(
                                value =>
                                    matchesMultiSearch(
                                        value,
                                        brandQuery
                                    )
                            );


                    if(!found){
                        return false;
                    }

                }

            }


            /*
               GENERIC
            */

            if(genericQuery){

                if(genericColumn){

                    if(
                        !matchesMultiSearch(
                            row[genericColumn],
                            genericQuery
                        )
                    ){

                        return false;

                    }

                }
                else{

                    const found =
                        Object.values(row)
                            .some(
                                value =>
                                    matchesMultiSearch(
                                        value,
                                        genericQuery
                                    )
                            );


                    if(!found){
                        return false;
                    }

                }

            }


            /*
               STRENGTH
            */

            if(strengthQuery){

                if(strengthColumn){

                    if(
                        !matchesMultiSearch(
                            row[strengthColumn],
                            strengthQuery
                        )
                    ){

                        return false;

                    }

                }
                else{

                    const found =
                        Object.values(row)
                            .some(
                                value =>
                                    matchesMultiSearch(
                                        value,
                                        strengthQuery
                                    )
                            );


                    if(!found){
                        return false;
                    }

                }

            }


            /*
               DOSAGE
            */

            if(dosageQuery){

                if(dosageColumn){

                    if(
                        !matchesMultiSearch(
                            row[dosageColumn],
                            dosageQuery
                        )
                    ){

                        return false;

                    }

                }
                else{

                    const found =
                        Object.values(row)
                            .some(
                                value =>
                                    matchesMultiSearch(
                                        value,
                                        dosageQuery
                                    )
                            );


                    if(!found){
                        return false;
                    }

                }

            }


            /*
               COLUMN FILTERS
            */

            const filterColumns =
                Object.keys(filters);


            for(
                let i = 0;
                i < filterColumns.length;
                i++
            ){

                const column =
                    filterColumns[i];


                const selected =
                    filters[column];


                if(
                    selected &&
                    selected.size > 0
                ){

                    const value =
                        displayValue(
                            row[column]
                        );


                    if(
                        !selected.has(
                            value
                        )
                    ){

                        return false;

                    }

                }

            }


            return true;

        }
    );

}


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters(type){

    if(type === "proactive"){
        return;
    }


    filteredData[type] =
        getFilteredRows(type);


    buildRowOffsets(type);


    renderVirtualTable(type);


    updateStatus(type);

}


/* =========================================================
   UPDATE PLACEHOLDERS
========================================================= */

function updatePlaceholders(type){

    const columns =
        sheetColumns[type] || [];


    const has =
        pattern =>
            columns.some(
                column =>
                    column
                        .toLowerCase()
                        .includes(pattern)
            );


    brandSearch.placeholder =
        has("brand") ||
        has("item name")
            ? "Search Brand / Item..."
            : "Search Brand Name...";


    genericSearch.placeholder =
        has("generic") ||
        has("active ingredient") ||
        has("ingredient")
            ? "Search Generic / Active Ingredient..."
            : "Search Generic Name...";


    strengthSearch.placeholder =
        has("strength")
            ? "Search Strength..."
            : "Search Strength / Value...";


    dosageSearch.placeholder =
        has("dosage")
            ? "Search Dosage Form..."
            : "Search Dosage / Form...";

}


/* =========================================================
   SWITCH SHEET
========================================================= */

function switchSheet(type){

    currentSheet = type;


    /*
       Update active tab
    */

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.sheet === type
            );

        });


    /*
       Clear search when changing
       worksheet
    */

    brandSearch.value = "";
    genericSearch.value = "";
    strengthSearch.value = "";
    dosageSearch.value = "";


    closeFilterPopup();


    /*
       PROACTIVE
    */

    if(type === "proactive"){

        searchArea.style.display =
            "none";

        excelHeader.style.display =
            "none";

        virtualContent.style.display =
            "none";

        specialContent.style.display =
            "block";


        renderProactiveImages();


        statusEl.textContent =
            "PROACTIVE INSTRUCTION";


        return;

    }


    /*
       NORMAL SHEET
    */

    searchArea.style.display =
        "block";

    excelHeader.style.display =
        "grid";

    virtualContent.style.display =
        "block";

    specialContent.style.display =
        "none";


    updatePlaceholders(type);


    /*
       Only filter the active sheet
    */

    filteredData[type] =
        getFilteredRows(type);


    /*
       Build row offsets once
    */

    buildRowOffsets(type);


    excelScroll.scrollTop = 0;
    excelScroll.scrollLeft = 0;


    renderVirtualTable(type);


    updateStatus(type);

}

/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(column){

    const c =
        column
            .toLowerCase()
            .trim();


    /*
       Frozen columns
    */

    if(
        c === "thiqa" ||
        c === "basic"
    ){

        return 110;

    }


    /*
       Vitamin needs larger columns
       through the expansion algorithm
    */

    if(
        c.includes("generic") ||
        c.includes("active ingredient") ||
        c.includes("active ingredients") ||
        c.includes("package name") ||
        c.includes("product name") ||
        c.includes("item name") ||
        c.includes("description") ||
        c.includes("instruction") ||
        c.includes("indication") ||
        c.includes("manufacturer") ||
        c.includes("formulary") ||
        c.includes("agent") ||
        c.includes("daman")
    ){

        return 280;

    }


    if(
        c.includes("strength") ||
        c.includes("dosage form") ||
        c === "dosage"
    ){

        return 160;

    }


    if(
        c.includes("price") ||
        c.includes("markup") ||
        c.includes("reimbursement") ||
        c.includes("copay") ||
        c.includes("cap")
    ){

        return 155;

    }


    if(
        c.includes("date")
    ){

        return 140;

    }


    return 150;

}


/* =========================================================
   GET ACTUAL COLUMN WIDTHS
========================================================= */

function getColumnWidths(type){

    const columns =
        sheetColumns[type] || [];


    if(!columns.length){
        return [];
    }


    const baseWidths =
        columns.map(
            column =>
                getColumnWidth(
                    column
                )
        );


    const availableWidth =
        excelArea.clientWidth ||
        window.innerWidth;


    const baseTotal =
        baseWidths.reduce(
            (sum,width) =>
                sum + width,
            0
        );


    /*
       Already wider than screen.
       Keep natural widths.
    */

    if(
        baseTotal >=
        availableWidth
    ){

        return baseWidths;

    }


    const extra =
        availableWidth -
        baseTotal;


    /*
       Give extra space according
       to content type.
    */

    const weights =
        columns.map(
            column => {

                const c =
                    column
                        .toLowerCase()
                        .trim();


                /*
                   Vitamin:
                   Item Name and Active
                   Ingredients get most
                   of the additional width.
                */

                if(
                    type === "vitamin"
                ){

                    if(
                        c.includes(
                            "item name"
                        )
                    ){

                        return 5;

                    }


                    if(
                        c.includes(
                            "active ingredient"
                        ) ||
                        c.includes(
                            "active ingredients"
                        )
                    ){

                        return 5;

                    }

                }


                if(
                    c.includes("generic") ||
                    c.includes("active ingredient") ||
                    c.includes("item name") ||
                    c.includes("package name") ||
                    c.includes("product name") ||
                    c.includes("description") ||
                    c.includes("instruction") ||
                    c.includes("indication")
                ){

                    return 3;

                }


                return 1;

            }
        );


    /*
       Thiqa / Basic remain fixed.
    */

    const frozen =
        columns.map(
            column => {

                const c =
                    column
                        .toLowerCase()
                        .trim();


                return (
                    type === "thiqa" &&
                    (
                        c === "thiqa" ||
                        c === "basic"
                    )
                );

            }
        );


    const totalWeight =
        weights.reduce(
            (sum,weight,index) => {

                if(
                    frozen[index]
                ){

                    return sum;

                }

                return sum + weight;

            },
            0
        );


    if(totalWeight <= 0){

        return baseWidths;

    }


    const finalWidths =
        baseWidths.map(
            (width,index) => {

                if(
                    frozen[index]
                ){

                    return width;

                }


                return Math.round(
                    width +
                    (
                        extra *
                        weights[index] /
                        totalWeight
                    )
                );

            }
        );


    /*
       Frozen Basic width
    */

    if(type === "thiqa"){

        const basicIndex =
            columns.findIndex(
                column =>
                    column
                        .toLowerCase()
                        .trim() ===
                    "basic"
            );


        if(
            basicIndex >= 0
        ){

            document.documentElement
                .style
                .setProperty(
                    "--basic-width",
                    finalWidths[
                        basicIndex
                    ] + "px"
                );

        }

    }


    return finalWidths;

}


/* =========================================================
   GRID TEMPLATE
========================================================= */

function getGridTemplate(type){

    return getColumnWidths(type)
        .map(
            width =>
                width + "px"
        )
        .join(" ");

}


/* =========================================================
   ROW HEIGHT
========================================================= */

function calculateRowHeight(
    type,
    row,
    widths
){

    const columns =
        sheetColumns[type] || [];


    if(!columns.length){

        return MIN_ROW_HEIGHT;

    }


    let maxLines = 1;


    for(
        let i = 0;
        i < columns.length;
        i++
    ){

        const column =
            columns[i];


        const value =
            displayValue(
                row[column]
            );


        if(!value){
            continue;
        }


        const width =
            widths[i] || 150;


        /*
           Padding is 16px total.
        */

        const charsPerLine =
            Math.max(
                10,
                Math.floor(
                    (width - 16) /
                    7
                )
            );


        const explicitLines =
            value.split("\n");


        let lineCount = 0;


        for(
            let j = 0;
            j < explicitLines.length;
            j++
        ){

            lineCount +=
                Math.max(
                    1,
                    Math.ceil(
                        explicitLines[j]
                            .length /
                        charsPerLine
                    )
                );

        }


        if(
            lineCount >
            maxLines
        ){

            maxLines =
                lineCount;

        }

    }


    return Math.max(
        MIN_ROW_HEIGHT,
        maxLines *
        LINE_HEIGHT +
        ROW_VERTICAL_PADDING
    );

}


/* =========================================================
   BUILD ROW OFFSETS
========================================================= */

function buildRowOffsets(type){

    const rows =
        filteredData[type] || [];


    const widths =
        getColumnWidths(type);


    const offsets =
        new Array(
            rows.length
        );


    let currentHeight = 0;


    for(
        let i = 0;
        i < rows.length;
        i++
    ){

        offsets[i] =
            currentHeight;


        currentHeight +=
            calculateRowHeight(
                type,
                rows[i],
                widths
            );

    }


    rowOffsets[type] =
        offsets;


    totalHeights[type] =
        currentHeight;


    if(
        currentSheet === type
    ){

        virtualContent.style.height =
            currentHeight + "px";

    }

}


/* =========================================================
   FIND ROW AT POSITION
========================================================= */

function findRowAtPosition(
    offsets,
    position
){

    if(!offsets.length){
        return 0;
    }


    let low = 0;

    let high =
        offsets.length - 1;


    while(
        low <= high
    ){

        const mid =
            (low + high) >> 1;


        if(
            offsets[mid] <=
            position
        ){

            if(
                mid ===
                offsets.length - 1 ||
                offsets[mid + 1] >
                position
            ){

                return mid;

            }


            low =
                mid + 1;

        }
        else{

            high =
                mid - 1;

        }

    }


    return 0;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderVirtualTable(type){

    if(type === "proactive"){

        renderProactiveImages();

        return;

    }


    const columns =
        sheetColumns[type] || [];


    if(!columns.length){

        excelHeader.innerHTML = "";

        virtualContent.innerHTML = "";

        virtualContent.style.height =
            "60px";

        return;

    }


    const template =
        getGridTemplate(type);


    /*
       HEADER
    */

    excelHeader.style.gridTemplateColumns =
        template;


    excelHeader.innerHTML = "";


    for(
        let i = 0;
        i < columns.length;
        i++
    ){

        const column =
            columns[i];


        const headerCell =
            document.createElement(
                "div"
            );


        headerCell.className =
            "header-cell";


        headerCell.textContent =
            column;


        /*
           Frozen header columns
        */

        if(type === "thiqa"){

            const normalized =
                column
                    .toLowerCase()
                    .trim();


            if(
                normalized === "basic"
            ){

                headerCell.classList.add(
                    "frozen-basic"
                );

            }


            if(
                normalized === "thiqa"
            ){

                headerCell.classList.add(
                    "frozen-thiqa"
                );

            }

        }


        const filterButton =
            document.createElement(
                "button"
            );


        filterButton.type =
            "button";


        filterButton.className =
            "filter-btn";


        filterButton.textContent =
            "▼";


        const activeFilter =
            columnFilters[type][column];


        if(
            activeFilter &&
            activeFilter.size > 0
        ){

            filterButton.classList.add(
                "filtered"
            );

        }


        filterButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openFilterPopup(
                    type,
                    column,
                    filterButton
                );

            }
        );


        headerCell.appendChild(
            filterButton
        );


        excelHeader.appendChild(
            headerCell
        );

    }


    /*
       VISIBLE ROWS
    */

    renderVisibleRows(type);

}


/* =========================================================
   RENDER VISIBLE ROWS
========================================================= */

function renderVisibleRows(type){

    if(type === "proactive"){
        return;
    }


    const rows =
        filteredData[type] || [];


    const columns =
        sheetColumns[type] || [];


    if(!rows.length){

        virtualContent.innerHTML = "";

        virtualContent.style.height =
            "60px";

        return;

    }


    const template =
        getGridTemplate(type);


    const widths =
        getColumnWidths(type);


    /*
       Use the actual scroll position.
    */

    const scrollTop =
        excelScroll.scrollTop;


    const viewportHeight =
        excelScroll.clientHeight ||
        window.innerHeight;


    const headerHeight =
        excelHeader.offsetHeight ||
        54;


    const startPosition =
        Math.max(
            0,
            scrollTop -
            headerHeight
        );


    const endPosition =
        scrollTop +
        viewportHeight;


    let startIndex =
        findRowAtPosition(
            rowOffsets[type],
            startPosition
        );


    let endIndex =
        findRowAtPosition(
            rowOffsets[type],
            endPosition
        );


    startIndex =
        Math.max(
            0,
            startIndex -
            BUFFER_ROWS
        );


    endIndex =
        Math.min(
            rows.length - 1,
            endIndex +
            BUFFER_ROWS
        );


    virtualContent.innerHTML = "";


    /*
       Only create visible rows.
    */

    for(
        let i = startIndex;
        i <= endIndex;
        i++
    ){

        const row =
            rows[i];


        const rowElement =
            document.createElement(
                "div"
            );


        rowElement.className =
            "data-row";


        rowElement.style.gridTemplateColumns =
            template;


        const height =
            calculateRowHeight(
                type,
                row,
                widths
            );


        rowElement.style.height =
            height + "px";


        rowElement.style.top =
            rowOffsets[type][i] +
            "px";


        for(
            let c = 0;
            c < columns.length;
            c++
        ){

            const column =
                columns[c];


            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "data-cell";


            const value =
                displayValue(
                    row[column]
                );


            cell.textContent =
                value;


            /*
               Thiqa / Basic
            */

            if(
                type === "thiqa"
            ){

                const normalizedColumn =
                    column
                        .toLowerCase()
                        .trim();


                const normalizedValue =
                    value
                        .toLowerCase()
                        .trim();


                if(
                    normalizedColumn ===
                    "basic"
                ){

                    cell.classList.add(
                        "frozen-basic"
                    );


                    if(
                        normalizedValue ===
                        "yes"
                    ){

                        cell.classList.add(
                            "basic-yes"
                        );

                    }
                    else if(
                        normalizedValue ===
                        "no"
                    ){

                        cell.classList.add(
                            "basic-no"
                        );

                    }

                }


                if(
                    normalizedColumn ===
                    "thiqa"
                ){

                    cell.classList.add(
                        "frozen-thiqa"
                    );


                    if(
                        normalizedValue ===
                        "yes"
                    ){

                        cell.classList.add(
                            "thiqa-yes"
                        );

                    }
                    else if(
                        normalizedValue ===
                        "no"
                    ){

                        cell.classList.add(
                            "thiqa-no"
                        );

                    }

                }

            }


            rowElement.appendChild(
                cell
            );

        }


        virtualContent.appendChild(
            rowElement
        );

    }

}


/* =========================================================
   SCROLL
========================================================= */

function handleScroll(){

    if(
        currentSheet ===
        "proactive"
    ){

        return;

    }


    if(renderFrame){

        cancelAnimationFrame(
            renderFrame
        );

    }


    renderFrame =
        requestAnimationFrame(
            () => {

                renderVisibleRows(
                    currentSheet
                );

            }
        );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilterPopup(
    type,
    column,
    button
){

    if(type === "proactive"){
        return;
    }


    const rows =
        sheetData[type] || [];


    const valueSet =
        new Set();


    for(
        let i = 0;
        i < rows.length;
        i++
    ){

        valueSet.add(
            displayValue(
                rows[i][column]
            )
        );

    }


    const values =
        Array.from(
            valueSet
        )
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
        );


    const existing =
        columnFilters[type][column];


    filterPopupState = {

        column,

        sheet:type,

        allValues:values,

        selected:
            existing
                ? new Set(existing)
                : new Set(values)

    };


    filterPopupHeader.textContent =
        "Filter: " +
        column;


    filterValueSearch.value =
        "";


    renderFilterValues();


    const rect =
        button.getBoundingClientRect();


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if(
        left + 280 >
        window.innerWidth
    ){

        left =
            window.innerWidth -
            290;

    }


    if(
        top + 420 >
        window.innerHeight
    ){

        top =
            window.innerHeight -
            430;

    }


    filterPopup.style.left =
        Math.max(
            5,
            left
        ) + "px";


    filterPopup.style.top =
        Math.max(
            5,
            top
        ) + "px";


    filterPopup.classList.add(
        "show"
    );

}


/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
        filterValueSearch.value
            .trim()
            .toLowerCase();


    filterValues.innerHTML =
        "";


    const values =
        filterPopupState
            .allValues
            .filter(
                value =>
                    value
                        .toLowerCase()
                        .includes(search)
            );


    for(
        let i = 0;
        i < values.length;
        i++
    ){

        const value =
            values[i];


        const label =
            document.createElement(
                "label"
            );


        label.className =
            "filter-value";


        const checkbox =
            document.createElement(
                "input"
            );


        checkbox.type =
            "checkbox";


        checkbox.checked =
            filterPopupState
                .selected
                .has(value);


        checkbox.addEventListener(
            "change",
            () => {

                if(
                    checkbox.checked
                ){

                    filterPopupState
                        .selected
                        .add(value);

                }
                else{

                    filterPopupState
                        .selected
                        .delete(value);

                }


                applyPopupFilter();

            }
        );


        const text =
            document.createElement(
                "span"
            );


        text.textContent =
            value === ""
                ? "(Blanks)"
                : value;


        label.appendChild(
            checkbox
        );


        label.appendChild(
            text
        );


        filterValues.appendChild(
            label
        );

    }

}


/* =========================================================
   APPLY POPUP FILTER
========================================================= */

function applyPopupFilter(){

    const sheet =
        filterPopupState.sheet;


    const column =
        filterPopupState.column;


    const selected =
        filterPopupState.selected;


    const allValues =
        filterPopupState.allValues;


    if(
        selected.size ===
        allValues.length
    ){

        delete columnFilters[
            sheet
        ][column];

    }
    else{

        columnFilters[
            sheet
        ][column] =
            new Set(selected);

    }


    applyFilters(
        sheet
    );

}

selectAllBtn.addEventListener(

filterValueSearch.addEventListener(

    );

}


document.addEventListener(

            )

/* =========================================================
   SEARCH EVENTS
========================================================= */

[
    brandSearch,
    genericSearch,
    strengthSearch,
    dosageSearch
]
.forEach(
    input => {

        input.addEventListener(
            "input",
            () => {

                if(
                    currentSheet ===
                    "proactive"
                ){

                    return;

                }


                /*
                   Small debounce prevents
                   repeated rendering while
                   typing quickly.
                */

                clearTimeout(
                    input.searchTimer
                );


                input.searchTimer =
                    setTimeout(
                        () => {

                            applyFilters(
                                currentSheet
                            );

                        },
                        80
                    );

            }
        );

    }
);


/* =========================================================
   CLEAR SEARCH
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        brandSearch.value = "";
        genericSearch.value = "";
        strengthSearch.value = "";
        dosageSearch.value = "";


        if(
            currentSheet !==
            "proactive"
        ){

            columnFilters[
                currentSheet
            ] = {};


            applyFilters(
                currentSheet
            );

        }

    }
);


/* =========================================================
   SCROLL EVENT
========================================================= */

excelScroll.addEventListener(
    "scroll",
    handleScroll,
    {
        passive:true
    }
);


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer = null;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    if(
                        currentSheet ===
                        "proactive"
                    ){

                        return;

                    }


                    /*
                       Recalculate only the
                       active worksheet.
                    */

                    buildRowOffsets(
                        currentSheet
                    );


                    renderVirtualTable(
                        currentSheet
                    );

                },
                150
            );

    }
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        createTabs();

        initializeSheetStorage();

        loadAllData();

    }
);

</script>

</body>
</html>
