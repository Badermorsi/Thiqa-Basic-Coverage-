<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thiqa & Basic Coverage Finder</title>

<style>

:root{
    --border:#d9dee7;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#667085;
    --header:#17365d;
    --header2:#eef2f7;
    --yes:#087443;
    --no:#b42318;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    font-family:Arial,Helvetica,sans-serif;
    color:var(--text);
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#17365d,#245b91);
    color:white;
    padding:22px 24px;
}

.header h1{
    margin:0;
    font-size:25px;
}

/* ================= CONTAINER ================= */

.container{
    padding:18px;
    max-width:1800px;
    margin:auto;
}

/* ================= TOP SEARCH ================= */

.search-panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
}

.search-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.search-box label{
    display:block;
    font-weight:700;
    font-size:13px;
    margin-bottom:7px;
}

.search-box input{
    width:100%;
    height:42px;
    border:1px solid #bfc7d4;
    border-radius:8px;
    padding:0 12px;
    font-size:15px;
    outline:none;
}

.search-box input:focus{
    border-color:#3276b1;
    box-shadow:0 0 0 3px rgba(50,118,177,.12);
}

/* ================= TOOLBAR ================= */

.toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
}

button{
    border:1px solid var(--border);
    background:white;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
}

button:hover{
    background:#f1f5f9;
}

.stats{
    font-size:13px;
    color:var(--muted);
    margin-left:auto;
}

.small{
    font-size:12px;
    color:var(--muted);
}

/* ================= TABLE ================= */

.table-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(16,24,40,.05);
}

.table-wrap{
    overflow:auto;
    max-height:calc(100vh - 300px);
}

table{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
    min-width:1500px;
    font-size:13px;
}

th,
td{
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:9px 10px;
    text-align:left;
    vertical-align:top;
}

/* ================= TABLE HEADER ================= */

thead tr:first-child th{
    background:var(--header);
    color:white;
    position:sticky;
    top:0;
    z-index:10;
    font-weight:700;
    white-space:nowrap;
    padding:0;
}

/* Header content */

.header-cell{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:42px;
    padding-left:10px;
}

.header-title{
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= FILTER BUTTON ================= */

.filter-button{
    width:34px;
    height:42px;
    border:0;
    border-left:1px solid rgba(255,255,255,.25);
    border-radius:0;
    background:transparent;
    color:white;
    font-size:15px;
    padding:0;
    flex-shrink:0;
}

.filter-button:hover{
    background:rgba(255,255,255,.15);
}

.filter-button.active{
    background:#3d78ad;
}

/* ================= ROWS ================= */

tbody tr:nth-child(even){
    background:#fafbfc;
}

tbody tr:hover{
    background:#f0f7ff;
}

/* ================= COVERAGE ================= */

.coverage{
    font-weight:800;
    text-align:center;
    border-radius:6px;
    display:inline-block;
    min-width:42px;
    padding:4px 8px;
}

.yes{
    color:var(--yes);
    background:#e7f6ee;
}

.no{
    color:var(--no);
    background:#fdecec;
}

/* ================= FILTER POPUP ================= */

.filter-popup{
    position:fixed;
    width:280px;
    max-height:430px;
    background:white;
    border:1px solid #cbd5e1;
    border-radius:9px;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    z-index:9999;
    display:none;
    overflow:hidden;
}

.filter-popup.show{
    display:block;
}

/* Search */

.filter-search{
    padding:10px;
    border-bottom:1px solid var(--border);
    background:#fff;
}

.filter-search input{
    width:100%;
    height:34px;
    border:1px solid #c7cfda;
    border-radius:6px;
    padding:0 9px;
    font-size:13px;
    outline:none;
}

.filter-search input:focus{
    border-color:#3276b1;
}

/* Select all */

.select-all{
    padding:9px 11px;
    border-bottom:1px solid var(--border);
    background:#fafafa;
}

.select-all label,
.filter-value label{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
}

.select-all input,
.filter-value input{
    width:16px;
    height:16px;
    cursor:pointer;
}

/* Values */

.filter-values{
    max-height:270px;
    overflow-y:auto;
    padding:5px 0;
}

.filter-value{
    padding:7px 11px;
    font-size:13px;
}

.filter-value:hover{
    background:#f1f5f9;
}

.filter-value.hidden{
    display:none;
}

.value-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* Buttons */

.filter-actions{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid var(--border);
    background:#fafafa;
}

.filter-actions button{
    flex:1;
    font-weight:600;
}

.apply-button{
    background:#17365d;
    color:white;
    border-color:#17365d;
}

.apply-button:hover{
    background:#245b91;
}

.clear-filter-button:hover{
    background:#feecec;
    color:#b42318;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:35px;
    color:var(--muted);
}

.empty{
    text-align:center;
    padding:45px;
    color:var(--muted);
    font-size:15px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

    .search-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .stats{
        margin-left:0;
        width:100%;
    }
}

@media(max-width:550px){

    .container{
        padding:10px;
    }

    .search-grid{
        grid-template-columns:1fr;
    }

    .header{
        padding:17px;
    }

    .header h1{
        font-size:21px;
    }

    .filter-popup{
        width:calc(100vw - 20px);
        left:10px !important;
        right:10px;
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

    <h1>Thiqa & Basic Coverage Finder</h1>

</div>


<div class="container">


<!-- ================= TOP SEARCH PANEL ================= -->

<section class="search-panel">

    <div class="search-grid">

        <!-- BRAND -->

        <div class="search-box">

            <label for="brandSearch">

            </label>

            <input

            >

<!-- ================= TABLE ================= -->

<section class="table-card">

<table>

<thead>

<tr>

        <div class="header-cell">
            <span class="header-title">Proactive ID</span>
            <button class="filter-button" data-col="0">▼</button>

    </th>

    </th>


    <th>
        <div class="header-cell">
            <span class="header-title">Generic Code</span>

    </th>


    <th>
        <div class="header-cell">

<!-- ================= FILTER POPUP ================= -->

<div
    id="filterPopup"
    class="filter-popup"
>

    <div class="filter-search">

        <input
            id="filterSearch"
            type="search"
            placeholder="Search values..."

        >

                type="checkbox"

        id="filterValues"

            id="clearColumn"

            id="applyFilter"

        </button>

<script>

/* =========================================================
   DATABASE STATE
========================================================= */

const state = {

    data: [],

    normalized: [],

    search: ["","","",""],

    filters: Array(14).fill(null).map(() => new Set()),

    filterColumn: null,

    filterTemp: new Set(),

    raf: 0

};


/* =========================================================
   DATA COLUMNS
========================================================= */

const keys = [

    "Proactive ID",
    "HAAD CODE",
    "proactive name",
    "Generic Code",
    "Haad Price",
    "Generic Name",
    "Strength",
    "Dosage Form",
    "Package Size",
    "Is UPP Scope",
    "THIQA",
    "BASIC",
    "Markup",
    "Daman Coverage"

];


/* =========================================================
   NORMALIZE
========================================================= */

function norm(value){

    return String(value ?? "")
        .toLowerCase()
        .trim();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "").replace(

        /[&<>"']/g,

        function(c){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[c];

        }

    );

}


/* =========================================================
   CELL DISPLAY
========================================================= */

function cell(value,col){

    const text = value ?? "";


    /* THIQA / BASIC */

    if(

        (col === 10 || col === 11) &&
        (text === "Yes" || text === "No")

    ){

        return `

            <span class="coverage ${text === "Yes" ? "yes" : "no"}">

                ${text}

            </span>

        `;

    }


    return escapeHtml(text);

}


/* =========================================================
   CHECK WHETHER ROW MATCHES
   % = AND
   Order does not matter
========================================================= */

function matches(index){

    const row = state.normalized[index];


    /* =====================================================
       HELPER:
       Split search by %
       Every part must be found
    ===================================================== */

    function allTermsMatch(text, search){

        if(!search){
            return true;
        }

        const terms =
            search
                .split("%")
                .map(term => term.trim())
                .filter(term => term !== "");


        return terms.every(term =>
            text.includes(term)
        );

    }


    /* =====================================================
       HELPER:
       EXACT NUMBER MATCHING
       
       Example:
       100 does NOT match 1000
       35 does NOT match 350
       4.2 does NOT match 14.2

       But:
       1000 matches 1000 mg
       350 matches 350 mg
    ===================================================== */

    function allExactNumbersMatch(text, search){

        if(!search){
            return true;
        }

        const terms =
            search
                .split("%")
                .map(term => term.trim())
                .filter(term => term !== "");


        return terms.every(term => {

            /*
               Escape special regex characters
            */

            const escaped =
                term.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );


            /*
               Make sure the number is not part
               of another number.

               Example:
               100  -> does NOT match 1000
               35   -> does NOT match 350
            */

            const regex =
                new RegExp(
                    "(?<![0-9.])" +
                    escaped +
                    "(?![0-9.])"
                );


            return regex.test(text);

        });

    }


    /* =====================================================
       TOP BRAND SEARCH
       % = AND
    ===================================================== */

    if(
        !allTermsMatch(
            row[2],
            state.search[0]
        )
    ){

        return false;

    }


    /* =====================================================
       TOP ACTIVE INGREDIENT SEARCH
       % = AND
    ===================================================== */

    if(
        !allTermsMatch(
            row[5],
            state.search[1]
        )
    ){

        return false;

    }


    /* =====================================================
       TOP STRENGTH SEARCH
       % = AND + EXACT NUMBERS
    ===================================================== */

    if(
        !allExactNumbersMatch(
            row[6],
            state.search[2]
        )
    ){

        return false;

    }


    /* =====================================================
       TOP DOSAGE FORM SEARCH
       % = AND
    ===================================================== */

    if(
        !allTermsMatch(
            row[7],
            state.search[3]
        )
    ){

        return false;

    }


    /* =====================================================
       EXCEL STYLE COLUMN FILTERS
    ===================================================== */

    for(let col = 0; col < 14; col++){

        const selected =
            state.filters[col];


        if(selected.size > 0){

            if(!selected.has(row[col])){

                return false;

            }

        }

    }


    return true;

}

/* =========================================================
   RENDER TABLE
========================================================= */

function render(){

    const tbody =
        document.getElementById("tbody");


    const output = [];

    let count = 0;


    for(

        let i = 0;

        i < state.data.length;

        i++

    ){

        if(matches(i)){

            const row = state.data[i];


            output.push(

                "<tr>" +

                row.map(

                    (value,col) =>

                    "<td>" +

                    cell(value,col) +

                    "</td>"

                ).join("") +

                "</tr>"

            );


            count++;

        }

    }


    if(output.length){

        tbody.innerHTML =
            output.join("");

    }

    else{

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="14"
                    class="empty">

                    No matching records found.

                </td>

            </tr>

        `;

    }


    document.getElementById("stats").textContent =

        `${count.toLocaleString()} matching record${count === 1 ? "" : "s"} / ${state.data.length.toLocaleString()} total`;

}


/* =========================================================
   SCHEDULE RENDER
========================================================= */

function scheduleRender(){

    cancelAnimationFrame(state.raf);

    state.raf =
        requestAnimationFrame(render);

}


/* =========================================================
   TOP SEARCH
========================================================= */

document
    .querySelectorAll(".search-box input")
    .forEach((input,index)=>{

        input.addEventListener(

            "input",

            function(){

                state.search[index] =
                    norm(this.value);

                scheduleRender();

            }

        );

    });


/* =========================================================
   OPEN EXCEL STYLE FILTER
========================================================= */

const filterPopup =
    document.getElementById("filterPopup");

const filterSearch =
    document.getElementById("filterSearch");

const filterValues =
    document.getElementById("filterValues");

const selectAll =
    document.getElementById("selectAll");


document
    .querySelectorAll(".filter-button")
    .forEach(button=>{

        button.addEventListener(

            "click",

            function(event){

                event.stopPropagation();

                openFilter(
                    Number(this.dataset.col),
                    this
                );

            }

        );

    });


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(col,button){

    state.filterColumn = col;


    /* Copy current filter */

    state.filterTemp =
        new Set(state.filters[col]);


    filterSearch.value = "";


    buildFilterValues();


    /* Position popup */

    const rect =
        button.getBoundingClientRect();


    const popupWidth = 280;

    let left =
        rect.left;

    let top =
        rect.bottom + 4;


    /* Prevent right overflow */

    if(

        left + popupWidth >
        window.innerWidth - 10

    ){

        left =
            window.innerWidth -
            popupWidth -
            10;

    }


    /* Prevent left overflow */

    if(left < 10){

        left = 10;

    }


    /* Prevent bottom overflow */

    if(

        top + 430 >
        window.innerHeight

    ){

        top =
            rect.top -
            434;

    }


    filterPopup.style.left =
        left + "px";

    filterPopup.style.top =
        top + "px";


    filterPopup.classList.add("show");


    /* Active button */

    document
        .querySelectorAll(".filter-button")
        .forEach(b =>
            b.classList.remove("active")
        );


    if(state.filters[col].size > 0){

        button.classList.add("active");

    }


    setTimeout(
        () => filterSearch.focus(),
        20
    );

}


/* =========================================================
   BUILD FILTER VALUES
========================================================= */

function buildFilterValues(){

    const col =
        state.filterColumn;


    if(col === null){

        return;

    }


    /* Get unique values */

    const values =
        new Map();


    for(

        let i = 0;

        i < state.normalized.length;

        i++

    ){

        const original =
            String(state.data[i][col] ?? "");

        const normalized =
            state.normalized[i][col];


        if(!values.has(normalized)){

            values.set(
                normalized,
                original
            );

        }

    }


    /* Sort */

    const sorted =
        [...values.entries()]
        .sort(

            (a,b)=>
                a[1].localeCompare(
                    b[1],
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )

        );


    filterValues.innerHTML = "";


    sorted.forEach(

        ([normalized,display])=>{

            const div =
                document.createElement("div");

            div.className =
                "filter-value";


            const label =
                document.createElement("label");


            const checkbox =
                document.createElement("input");

            checkbox.type =
                "checkbox";

            checkbox.dataset.value =
                normalized;

            checkbox.checked =
                state.filterTemp.has(normalized);


            const span =
                document.createElement("span");

            span.className =
                "value-text";

            span.textContent =
                display === ""
                    ? "(Blank)"
                    : display;


            label.appendChild(
                checkbox
            );

            label.appendChild(
                span
            );

            div.appendChild(
                label
            );

            filterValues.appendChild(
                div
            );

        }

    );


    updateSelectAll();

}


/* =========================================================
   SEARCH INSIDE FILTER
========================================================= */

filterSearch.addEventListener(

    "input",

    function(){

        const search =
            norm(this.value);


        document
            .querySelectorAll(
                "#filterValues .filter-value"
            )
            .forEach(item=>{

                const text =
                    norm(
                        item
                        .querySelector(".value-text")
                        .textContent
                    );


                item.classList.toggle(

                    "hidden",

                    search &&
                    !text.includes(search)

                );

            });


        updateSelectAll();

    }

);


/* =========================================================
   SELECT ALL
========================================================= */

selectAll.addEventListener(

    "change",

    function(){

        const checked =
            this.checked;


        document
            .querySelectorAll(
                "#filterValues .filter-value:not(.hidden) input"
            )
            .forEach(cb=>{

                cb.checked =
                    checked;


                if(checked){

                    state.filterTemp.add(
                        cb.dataset.value
                    );

                }
                else{

                    state.filterTemp.delete(

                    );

                }

            });

);


/* =========================================================
   INDIVIDUAL CHECKBOX
========================================================= */

filterValues.addEventListener(

    "change",

    function(event){

        if(

            event.target.tagName !==
            "INPUT"

        ){

            return;

        }


        const value =
            event.target.dataset.value;


        if(event.target.checked){

            state.filterTemp.add(
                value
            );

        }
        else{

            state.filterTemp.delete(
                value
            );

        }


        updateSelectAll();

    }

);


/* =========================================================
   UPDATE SELECT ALL STATE
========================================================= */

function updateSelectAll(){

    const visible =
        [
            ...document.querySelectorAll(
                "#filterValues .filter-value:not(.hidden) input"
            )
        ];


    if(!visible.length){

        selectAll.checked = false;

        selectAll.indeterminate = false;

        return;

    }


    const checked =
        visible.filter(
            cb => cb.checked
        ).length;


    selectAll.checked =
        checked === visible.length;


    selectAll.indeterminate =
        checked > 0 &&
        checked < visible.length;

}
