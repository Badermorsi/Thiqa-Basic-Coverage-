<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f2f3f5;
    color:#222;
}

/* =========================================================
   TOP AREA
========================================================= */

.top{
    background:#fff;
    padding:10px 15px 8px;
    border-bottom:1px solid #d5d8dc;
}

h1{
    margin:0 0 10px;
    text-align:center;
    color:#1d3557;
    font-size:24px;
}

/* =========================================================
   TABS
========================================================= */

.tabs{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:5px;
}

.tab{
    border:1px solid #bfc5cc;
    background:#e9edf2;
    color:#1d3557;
    padding:8px 5px;
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
    text-align:center;
    min-width:0;
}

.tab:hover{
    background:#dce6f1;
}

.tab.active{
    background:#1d3557;
    color:#fff;
    border-color:#1d3557;
}

/* =========================================================
   SEARCH AREA
========================================================= */

.search-area{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.search-box{
    position:relative;
}

.search-box input{
    width:100%;
    padding:9px 35px 9px 10px;
    border:1px solid #bfc5cc;
    border-radius:4px;
    font-size:13px;
    outline:none;
}

.search-box input:focus{
    border-color:#1d3557;
}

.clear-search{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#777;
    font-weight:bold;
    display:none;
}

.clear-search:hover{
    color:#111;
}

/* =========================================================
   STATUS / ERROR
========================================================= */

.status{
    margin-top:7px;
    font-size:12px;
    color:#555;
}

.error-box{
    display:none;
    margin-top:7px;
    padding:8px;
    background:#f8d7da;
    border:1px solid #f1aeb5;
    color:#842029;
    border-radius:4px;
    font-size:12px;
}

/* =========================================================
   EXCEL AREA
========================================================= */

.excel-area{
    height:calc(100vh - 225px);
    min-height:450px;
    overflow:auto;
    background:#fff;
    margin:0;
    position:relative;
}

/* =========================================================
   EXCEL TABLE
========================================================= */

.excel-table{
    width:max-content;
    min-width:100%;
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
}

.excel-table th,
.excel-table td{
    border-right:1px solid #d5d8dc;
    border-bottom:1px solid #d5d8dc;
    padding:8px 9px;
    font-size:12px;
    line-height:16px;
    height:42px;
    vertical-align:middle;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.excel-table thead th{
    position:sticky;
    top:0;
    z-index:20;
    background:#1d3557;
    color:#fff;
    font-weight:bold;
    text-align:center;
}

.excel-table tbody td{
    background:#fff;
}

.excel-table tbody tr:nth-child(even) td{
    background:#fafafa;
}

/* =========================================================
   FROZEN THIQA / BASIC COLUMNS
========================================================= */

.frozen-thiqa{
    position:sticky !important;
    right:var(--basic-width,0px);
    z-index:15 !important;
    background:#eef5fb !important;
}

.frozen-basic{
    position:sticky !important;
    right:0;
    z-index:16 !important;
    background:#eef5fb !important;
}

thead .frozen-thiqa,
thead .frozen-basic{
    z-index:30 !important;
    background:#1d3557 !important;
    color:#fff !important;
}

/* =========================================================
   VITAMIN COVERAGE SPECIAL CELLS
========================================================= */

.vitamin-nci,
.vitamin-not-covered{
    color:#c00000 !important;
    font-weight:bold;
}

/* =========================================================
   FILTER
========================================================= */

.filter-button{
    margin-left:5px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px;
    height:16px;
    border:1px solid rgba(255,255,255,.7);
    border-radius:2px;
    cursor:pointer;
    font-size:9px;
    background:rgba(255,255,255,.12);
}

.filter-button:hover{
    background:rgba(255,255,255,.25);
}

.filter-button.active{
    background:#fff;
    color:#1d3557;
}

/* =========================================================
   FILTER POPUP
========================================================= */

.filter-popup{
    position:fixed;
    z-index:1000;
    width:260px;
    max-height:400px;
    background:#fff;
    border:1px solid #aaa;
    border-radius:5px;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
    display:none;
    overflow:hidden;
}

.filter-popup-header{
    padding:8px;
    background:#1d3557;
    color:#fff;
    font-size:12px;
    font-weight:bold;
}

.filter-popup-actions{
    display:flex;
    gap:5px;
    padding:7px;
    border-bottom:1px solid #ddd;
}

.filter-popup-actions button{
    flex:1;
    padding:5px;
    font-size:11px;
    cursor:pointer;
    border:1px solid #bbb;
    background:#f4f4f4;
    border-radius:3px;
}

.filter-popup-actions button:hover{
    background:#e5e5e5;
}

.filter-list{
    max-height:320px;
    overflow:auto;
    padding:5px 7px;
}

.filter-option{
    display:flex;
    align-items:flex-start;
    gap:6px;
    padding:4px 2px;
    font-size:11px;
    cursor:pointer;
}

.filter-option input{
    margin-top:2px;
}

.filter-footer{
    padding:7px;
    border-top:1px solid #ddd;
}

.filter-apply{
    width:100%;
    padding:6px;
    border:0;
    background:#1d3557;
    color:#fff;
    border-radius:3px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

/* =========================================================
   SPECIAL CONTENT
========================================================= */

.special-content{
    display:none;
    width:100%;
    background:#fff;
    min-height:100%;
    padding:15px;
}

/* =========================================================
   PROACTIVE
========================================================= */

.proactive-container{
    display:flex;
    flex-direction:column;
    gap:15px;
    align-items:center;
}

.proactive-container img{
    max-width:100%;
    height:auto;
    display:block;
    border:1px solid #ddd;
}

/* =========================================================
   PHONE CONTACTS
========================================================= */

.phone-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.25fr);
    gap:15px;
    width:100%;
    align-items:stretch;
}

.phone-middle{
    display:flex;
    flex-direction:column;
    gap:15px;
    min-width:0;
}

.phone-table-box{
    background:#fff;
    border:1px solid #c8c8c8;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
    min-width:0;
}

.phone-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

/* All cells */

.phone-table th,
.phone-table td{
    border-right:1px solid #d5d8dc;
    border-bottom:1px solid #d5d8dc;
    padding:8px 9px;
    font-size:13px;
    line-height:17px;
    text-align:left;
    vertical-align:middle;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.phone-table th:last-child,
.phone-table td:last-child{
    border-right:0;
}

.phone-table tbody tr:last-child td{
    border-bottom:0;
}

/* Section title:
   APG DEPARTMENTS
   ZAS BUSINESS UNITS
*/

.phone-table thead tr.phone-title-row th{
    background:#1d3557;
    color:#fff;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    padding:10px 8px;
    border-right:0;
}

/* Column headings */

.phone-table thead tr.phone-header-row th{
    background:#dce6f1;
    color:#222;
    font-weight:bold;
    text-align:center;
    vertical-align:middle;
    padding:9px 8px;
}

/* Data rows */

.phone-table tbody tr:nth-child(even) td{
    background:#fafafa;
}

/* =========================================================
   PHONE TABLE 1
========================================================= */

.phone-layout > .phone-table-box:first-child
.phone-table th:first-child,
.phone-layout > .phone-table-box:first-child
.phone-table td:first-child{
    width:42%;
}

.phone-layout > .phone-table-box:first-child
.phone-table th:nth-child(2),
.phone-layout > .phone-table-box:first-child
.phone-table td:nth-child(2),
.phone-layout > .phone-table-box:first-child
.phone-table th:nth-child(3),
.phone-layout > .phone-table-box:first-child
.phone-table td:nth-child(3){
    width:29%;
}

/* =========================================================
   PHONE TABLES 2 & 3
========================================================= */

.phone-middle .phone-table th:first-child,
.phone-middle .phone-table td:first-child{
    width:68%;
}

.phone-middle .phone-table th:last-child,
.phone-middle .phone-table td:last-child{
    width:32%;
}

/* =========================================================
   PHONE TABLE 4
========================================================= */

.phone-layout > .phone-table-box:last-child
.phone-table th:first-child,
.phone-layout > .phone-table-box:last-child
.phone-table td:first-child{
    width:62%;
}

.phone-layout > .phone-table-box:last-child
.phone-table th:last-child,
.phone-layout > .phone-table-box:last-child
.phone-table td:last-child{
    width:38%;
}

.phone-loading{
    text-align:center;
    padding:40px 15px;
    color:#555;
    font-size:14px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .tabs{
        grid-template-columns:repeat(4,1fr);
    }

    .search-area{
        grid-template-columns:repeat(2,1fr);
    }

    .phone-layout{
        grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    }

    .phone-layout > .phone-table-box:last-child{
        grid-column:1 / -1;
    }
}

@media(max-width:800px){

    h1{
        font-size:20px;
    }

    .tabs{
        grid-template-columns:repeat(2,1fr);
    }

    .search-area{
        grid-template-columns:1fr;
    }

    .excel-area{
        height:calc(100vh - 300px);
    }

    .phone-layout{
        grid-template-columns:1fr;
    }

    .phone-layout > .phone-table-box:last-child{
        grid-column:auto;
    }

    .special-content{
        padding:8px;
    }
}

</style>
</head>


<body>

<div class="top">

    <h1>Insurance Coverage List</h1>

    <div class="tabs" id="tabs"></div>

    <div class="search-area" id="searchArea">

        <div class="search-box">
            <input
                type="text"
                id="globalSearch"
                placeholder="Search all columns..."
                autocomplete="off">
            <span class="clear-search" id="clearSearch">×</span>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="strengthSearch"
                placeholder="Strength / exact terms..."
                autocomplete="off">
            <span class="clear-search" id="clearStrengthSearch">×</span>
        </div>

    </div>

    <div class="status" id="status">
        Loading...
    </div>

    <div class="error-box" id="errorBox"></div>

</div>


<div class="excel-area" id="excelArea">

    <div id="excelHeader"></div>

    <div id="virtualContent"></div>

    <div
        class="special-content"
        id="specialContent">
    </div>

</div>


<div
    class="filter-popup"
    id="filterPopup">

    <div
        class="filter-popup-header"
        id="filterPopupHeader">
    </div>

    <div class="filter-popup-actions">

        <button id="filterSelectAll">
            Select All
        </button>

        <button id="filterClearAll">
            Clear
        </button>

    </div>

    <div
        class="filter-list"
        id="filterList">
    </div>

    <div class="filter-footer">

        <button
            class="filter-apply"
            id="filterApply">
            Apply
        </button>

    </div>

</div>


<script>

/* =========================================================
   WORKSHEETS
========================================================= */

const WORKSHEETS = [

    {
        id:"thiqa",
        name:"Thiqa & Basic",
        file:"data.json"
    },

    {
        id:"haad",
        name:"HAAD",
        file:"HAAD_LIST.json"
    },

    {
        id:"apg",
        name:"APG FORMULARY 05-06",
        file:"APG FORMULARY 05-06.json"
    },

    {
        id:"icd10",
        name:"ICD10",
        file:"ICD10.json"
    },

    {
        id:"vitamin",
        name:"VITAMIN COVERAGE",
        file:"VITAMIN COVERAGE.json"
    },

    {
        id:"ppi",
        name:"PPI Coverage",
        file:"PPI Coverage.json"
    },

    {
        id:"proactive",
        name:"PROACTIVE INSTRUCTION",
        special:true
    },

    {
        id:"hcpc",
        name:"HCPC Cap & Ref Price",
        file:"HCPC Cap & REf Price.json"
    },

    {
        id:"validity",
        name:"VALIDITY AFTER OPENNING",
        file:"VALIDITY AFTER OPENNING.json"
    },

    {
        id:"cda",
        name:"CDA & CDB MAX DD",
        file:"CDA &CDB MAX DD.json"
    },

    {
        id:"adnic",
        name:"ADNIC (KHALIFA F.)",
        file:"ADNIC ( KHALIFA F. ).json"
    },

    {
        id:"nasHaad",
        name:"Nas TPA Formulary (HAAD)",
        file:"Nas TPA Formulary (HAAD).json"
    },

    {
        id:"nasDha",
        name:"Nas TPA Formulary (DHA)",
        file:"Nas TPA Formulary (DHA).json"
    },

    {
        id:"fmc",
        name:"FMC LIST 01-2026",
        file:"FMC LIST 01-2026.json"
    },

    {
        id:"oman",
        name:"OMAN FORMULARY 03-2024",
        file:"OMAN FORMULARY 03-2024.json"
    },

    /* =====================================================
       PHONE CONTACTS
       4 SEPARATE JSON FILES
    ===================================================== */

    {
        id:"phone",
        name:"PHONE CONTACTS",
        special:"phone",

        phoneFiles:[
            "PHONE CONTACTS 1.json",
            "PHONE CONTACTS 2.json",
            "PHONE CONTACTS 3.json",
            "PHONE CONTACTS 4.json"
        ]
    }

];


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentSheet = "thiqa";

let sheetData = {};

let filteredData = [];

let columns = [];

let filters = {};

let currentFilterColumn = null;

let phoneLoaded = false;

let phoneLoading = false;

const phoneData = {

    contacts:[],
    apg:[],
    zas:[],
    insurance:[]

};

const ROW_HEIGHT = 42;

const BUFFER_ROWS = 30;


/* =========================================================
   ELEMENTS
========================================================= */

const tabsEl =
    document.getElementById("tabs");

const searchArea =
    document.getElementById("searchArea");

const globalSearch =
    document.getElementById("globalSearch");

const strengthSearch =
    document.getElementById("strengthSearch");

const clearSearch =
    document.getElementById("clearSearch");

const clearStrengthSearch =
    document.getElementById("clearStrengthSearch");

const statusEl =
    document.getElementById("status");

const errorBox =
    document.getElementById("errorBox");

const excelArea =
    document.getElementById("excelArea");

const excelHeader =
    document.getElementById("excelHeader");

const virtualContent =
    document.getElementById("virtualContent");

const specialContent =
    document.getElementById("specialContent");

const filterPopup =
    document.getElementById("filterPopup");

const filterPopupHeader =
    document.getElementById("filterPopupHeader");

const filterList =
    document.getElementById("filterList");

const filterSelectAll =
    document.getElementById("filterSelectAll");

const filterClearAll =
    document.getElementById("filterClearAll");

const filterApply =
    document.getElementById("filterApply");


/* =========================================================
   NORMALIZE JSON
========================================================= */

function normalizeJSON(json){

    if(Array.isArray(json)){
        return json;
    }

    if(json && Array.isArray(json.data)){
        return json.data;
    }

    if(json && typeof json === "object"){
        return [json];
    }

    return [];
}


/* =========================================================
   PHONE JSON NORMALIZER
========================================================= */

function normalizePhoneJSON(json){

    return normalizeJSON(json);

}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsEl.innerHTML = "";

    WORKSHEETS.forEach(sheet => {

        const button =
            document.createElement("button");

        button.className = "tab";

        button.dataset.id = sheet.id;

        button.textContent = sheet.name;

        button.addEventListener(
            "click",
            () => switchSheet(sheet.id)
        );

        tabsEl.appendChild(button);

    });

}


/* =========================================================
   UPDATE ACTIVE TAB
========================================================= */

function updateActiveTab(){

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.id === currentSheet
            );

        });

}


/* =========================================================
   LOAD ALL NORMAL DATA
========================================================= */

async function loadAllData(){

    errorBox.style.display = "none";

    try{

        const normalSheets =
            WORKSHEETS.filter(
                sheet => !sheet.special
            );

        const results =
            await Promise.all(

                normalSheets.map(
                    async sheet => {

                        const response =
                            await fetch(
                                encodeURI(
                                    sheet.file
                                ) +
                                "?v=" +
                                Date.now(),
                                {
                                    cache:"no-store"
                                }
                            );

                        if(!response.ok){
                            throw new Error(
                                "Could not load " +
                                sheet.file
                            );
                        }

                        const json =
                            await response.json();

                        return {
                            id:sheet.id,
                            data:normalizeJSON(json)
                        };

                    }
                )

            );

        results.forEach(result => {

            sheetData[result.id] =
                result.data;

        });

        switchSheet("thiqa");

    }
    catch(error){

        console.error(error);

        errorBox.textContent =
            "Error loading data: " +
            error.message;

        errorBox.style.display = "block";

        statusEl.textContent =
            "Loading error";

    }

}


/* =========================================================
   GET OBJECT COLUMNS
========================================================= */

function getObjectColumns(
    rows,
    fallback=[]
){

    const result = [];

    rows.forEach(row => {

        if(
            !row ||
            typeof row !== "object" ||
            Array.isArray(row)
        ){
            return;
        }

        Object.keys(row).forEach(key => {

            if(!result.includes(key)){
                result.push(key);
            }

        });

    });

    if(result.length){
        return result;
    }

    return fallback;

}


/* =========================================================
   SWITCH SHEET
========================================================= */

function switchSheet(id){

    const sheet =
        WORKSHEETS.find(
            item => item.id === id
        );

    if(!sheet){
        return;
    }

    currentSheet = id;

    updateActiveTab();

    errorBox.style.display = "none";

    filters = {};

    globalSearch.value = "";

    strengthSearch.value = "";

    clearSearch.style.display = "none";

    clearStrengthSearch.style.display = "none";

    filterPopup.style.display = "none";


    /* =====================================================
       PROACTIVE
    ===================================================== */

    if(sheet.id === "proactive"){

        searchArea.style.display = "none";

        excelHeader.innerHTML = "";

        virtualContent.innerHTML = "";

        virtualContent.style.display = "none";

        specialContent.style.display = "block";

        renderProactive();

        statusEl.textContent =
            "PROACTIVE INSTRUCTION";

        return;

    }


    /* =====================================================
       PHONE CONTACTS
    ===================================================== */

    if(sheet.id === "phone"){

        searchArea.style.display = "none";

        excelHeader.innerHTML = "";

        virtualContent.innerHTML = "";

        virtualContent.style.display = "none";

        specialContent.style.display = "block";

        renderPhoneContacts();

        statusEl.textContent =
            "PHONE CONTACTS";

        return;

    }


    /* =====================================================
       NORMAL SHEET
    ===================================================== */

    searchArea.style.display = "grid";

    specialContent.style.display = "none";

    virtualContent.style.display = "block";

    const data =
        sheetData[id] || [];

    columns =
        getObjectColumns(data);

    filteredData =
        [...data];

    updatePlaceholders();

    buildExcelHeader();

    applyFilters();

    statusEl.textContent =
        sheet.name +
        " — " +
        data.length +
        " records";

}


/* =========================================================
   PROACTIVE
========================================================= */

function renderProactive(){

    specialContent.innerHTML = `

        <div class="proactive-container">

            <img
                src="proactive 1.png"
                alt="Proactive Instruction 1">

            <img
                src="proactive 2.png"
                alt="Proactive Instruction 2">

        </div>

    `;

}


/* =========================================================
   PHONE CONTACTS LOADER
========================================================= */

async function renderPhoneContacts(){

    if(phoneLoaded){

        if(currentSheet === "phone"){
            buildPhoneContacts();
        }

        return;

    }

    if(phoneLoading){
        return;
    }

    phoneLoading = true;

    specialContent.innerHTML = `

        <div class="phone-loading">
            Loading phone contacts...
        </div>

    `;

    try{

        const phoneSheet =
            WORKSHEETS.find(
                sheet => sheet.id === "phone"
            );

        const results =
            await Promise.all(

                phoneSheet.phoneFiles.map(
                    async file => {

                        const response =
                            await fetch(
                                encodeURI(file),
                                {
                                    cache:"no-store"
                                }
                            );

                        if(!response.ok){

                            throw new Error(
                                "Could not load " +
                                file
                            );

                        }

                        const json =
                            await response.json();

                        return normalizePhoneJSON(
                            json
                        );

                    }
                )

            );


        phoneData.contacts =
            results[0];

        phoneData.apg =
            results[1];

        phoneData.zas =
            results[2];

        phoneData.insurance =
            results[3];

        phoneLoaded = true;

        phoneLoading = false;


        if(currentSheet !== "phone"){
            return;
        }

        buildPhoneContacts();

        statusEl.textContent =
            "PHONE CONTACTS";

    }
    catch(error){

        phoneLoading = false;

        console.error(error);

        specialContent.innerHTML = "";

        errorBox.textContent =
            "Error loading phone contacts: " +
            error.message;

        errorBox.style.display = "block";

        statusEl.textContent =
            "PHONE CONTACTS — Loading error";

    }

}


/* =========================================================
   CREATE PHONE TABLE
========================================================= */

function createPhoneTable(
    rows,
    title,
    headerMap={},
    fallbackColumns=[]
){

    const box =
        document.createElement("div");

    box.className =
        "phone-table-box";


    const table =
        document.createElement("table");

    table.className =
        "phone-table";


    const actualRows =
        Array.isArray(rows)
            ? rows
            : [];


    const tableColumns =
        getObjectColumns(
            actualRows,
            fallbackColumns
        );


    const thead =
        document.createElement("thead");


    /* =====================================================
       SECTION TITLE ROW
    ===================================================== */

    if(title){

        const titleRow =
            document.createElement("tr");

        titleRow.className =
            "phone-title-row";


        const titleCell =
            document.createElement("th");

        titleCell.colSpan =
            tableColumns.length;

        titleCell.textContent =
            title;


        titleRow.appendChild(
            titleCell
        );

        thead.appendChild(
            titleRow
        );

    }


    /* =====================================================
       COLUMN HEADING ROW
    ===================================================== */

    const headerRow =
        document.createElement("tr");

    headerRow.className =
        "phone-header-row";


    tableColumns.forEach(column => {

        const th =
            document.createElement("th");

        th.textContent =
            headerMap[column] ||
            column;

        headerRow.appendChild(th);

    });


    thead.appendChild(
        headerRow
    );

    table.appendChild(
        thead
    );


    /* =====================================================
       DATA
    ===================================================== */

    const tbody =
        document.createElement("tbody");


    actualRows.forEach(row => {

        const tr =
            document.createElement("tr");


        tableColumns.forEach(column => {

            const td =
                document.createElement("td");


            let value =
                row[column];


            if(
                value === undefined ||
                value === null
            ){
                value = "";
            }


            td.textContent =
                String(value);


            tr.appendChild(td);

        });


        tbody.appendChild(tr);

    });


    table.appendChild(
        tbody
    );


    box.appendChild(
        table
    );


    return box;

}

/* =========================================================
   BUILD EXCEL HEADER
========================================================= */

function buildExcelHeader(){

    excelHeader.innerHTML = "";

    if(!columns.length){
        return;
    }


    const table =
        document.createElement("table");

    table.className =
        "excel-table";


    const thead =
        document.createElement("thead");

    const tr =
        document.createElement("tr");


    columns.forEach(
        (column,index) => {

            const th =
                document.createElement("th");

            th.textContent =
                column;


            /* Thiqa / Basic frozen */

            if(
                currentSheet === "thiqa" &&
                (
                    column.toUpperCase() === "THIQA" ||
                    column.toUpperCase() === "BASIC"
                )
            ){

                if(
                    column.toUpperCase() === "THIQA"
                ){
                    th.classList.add(
                        "frozen-thiqa"
                    );
                }

                if(
                    column.toUpperCase() === "BASIC"
                ){
                    th.classList.add(
                        "frozen-basic"
                    );
                }

            }


            const filterButton =
                document.createElement("span");

            filterButton.className =
                "filter-button";

            filterButton.textContent =
                "▼";

            filterButton.title =
                "Filter";


            filterButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openFilterPopup(
                        column,
                        filterButton
                    );

                }
            );


            th.appendChild(
                filterButton
            );


            tr.appendChild(th);

        }
    );


    thead.appendChild(tr);

    table.appendChild(thead);

    excelHeader.appendChild(table);


    updateFrozenWidths();

}


/* =========================================================
   UPDATE FROZEN WIDTHS
========================================================= */

function updateFrozenWidths(){

    if(currentSheet !== "thiqa"){
        return;
    }

    const headers =
        excelHeader.querySelectorAll(
            "thead th"
        );

    let basicWidth = 0;


    headers.forEach(th => {

        if(
            th.classList.contains(
                "frozen-basic"
            )
        ){

            basicWidth =
                th.getBoundingClientRect()
                    .width;

        }

    });


    document.documentElement.style
        .setProperty(
            "--basic-width",
            basicWidth + "px"
        );

}


/* =========================================================
   FILTER POPUP
========================================================= */

function openFilterPopup(
    column,
    button
){

    if(
        currentSheet === "proactive" ||
        currentSheet === "phone"
    ){
        return;
    }


    currentFilterColumn =
        column;


    filterPopupHeader.textContent =
        column;


    const data =
        sheetData[currentSheet] || [];


    const values = [];


    data.forEach(row => {

        let value =
            row[column];

        if(
            value === undefined ||
            value === null
        ){
            value = "";
        }

        value = String(value);

        if(!values.includes(value)){
            values.push(value);
        }

    });


    values.sort(
        (a,b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );


    filterList.innerHTML = "";


    const selected =
        filters[column]
            ? filters[column]
            : new Set(values);


    values.forEach(value => {

        const label =
            document.createElement("label");

        label.className =
            "filter-option";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.value =
            value;

        checkbox.checked =
            selected.has(value);


        const span =
            document.createElement("span");

        span.textContent =
            value === ""
                ? "(Blank)"
                : value;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            span
        );


        filterList.appendChild(
            label
        );

    });


    const rect =
        button.getBoundingClientRect();


    let left =
        rect.left;

    let top =
        rect.bottom + 5;


    if(left + 260 > window.innerWidth){
        left =
            window.innerWidth - 270;
    }

    if(top + 400 > window.innerHeight){
        top =
            Math.max(
                10,
                rect.top - 405
            );
    }


    filterPopup.style.left =
        left + "px";

    filterPopup.style.top =
        top + "px";

    filterPopup.style.display =
        "block";

}

/* =========================================================
   APPLY FILTER
========================================================= */

filterApply.addEventListener(
    "click",
    () => {

        if(!currentFilterColumn){
            return;
        }


        const selected =
            new Set();


        filterList
            .querySelectorAll(
                'input[type="checkbox"]:checked'
            )
            .forEach(
                checkbox =>
                    selected.add(
                        checkbox.value
                    )
            );


        filters[currentFilterColumn] =
            selected;


        filterPopup.style.display =
            "none";


        applyFilters();

    }
);


/* =========================================================
   APPLY FILTERS + SEARCH
========================================================= */

function applyFilters(){

    if(
        currentSheet === "proactive" ||
        currentSheet === "phone"
    ){
        return;
    }


    const data =
        sheetData[currentSheet] || [];


    const globalTerm =
        globalSearch.value
            .trim()
            .toLowerCase();


    const strengthTerm =
        strengthSearch.value
            .trim()
            .toLowerCase();


    filteredData =
        data.filter(row => {


            /* =============================================
               COLUMN FILTERS
            ============================================= */

            for(
                const column in filters
            ){

                const selected =
                    filters[column];


                let value =
                    row[column];


                if(
                    value === undefined ||
                    value === null
                ){
                    value = "";
                }


                value =
                    String(value);


                if(
                    selected.size === 0 ||
                    !selected.has(value)
                ){
                    return false;
                }

            }


            /* =============================================
               GLOBAL SEARCH
            ============================================= */

            if(globalTerm){

                const terms =
                    globalTerm
                        .split(/\s+/)
                        .filter(Boolean);


                const rowText =
                    columns
                        .map(column => {

                            let value =
                                row[column];

                            if(
                                value === undefined ||
                                value === null
                            ){
                                value = "";
                            }

                            return String(value)
                                .toLowerCase();

                        })
                        .join(" ");


                for(
                    const term of terms
                ){

                    if(
                        !rowText.includes(term)
                    ){
                        return false;
                    }

                }

            }


            /* =============================================
               STRENGTH / % SEARCH
               Each % term must exist in SAME CELL
            ============================================= */

            if(strengthTerm){

                const searchParts =
                    strengthTerm
                        .split("%")
                        .map(
                            part =>
                                part.trim()
                                    .toLowerCase()
                        )
                        .filter(Boolean);


                if(searchParts.length){

                    const found =
                        columns.some(
                            column => {

                                let value =
                                    row[column];


                                if(
                                    value === undefined ||
                                    value === null
                                ){
                                    value = "";
                                }


                                value =
                                    String(value)
                                        .toLowerCase();


                                return searchParts.every(
                                    term =>
                                        value.includes(
                                            term
                                        )
                                );

                            }
                        );


                    if(!found){
                        return false;
                    }

                }

            }


            return true;

        });


    updateFilterButtons();

    renderVirtualTable();

    updateStatus();

}


/* =========================================================
   FILTER BUTTON STATES
========================================================= */

function updateFilterButtons(){

    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(button => {

            const th =
                button.parentElement;

            if(!th){
                return;
            }

            const column =
                th.firstChild &&
                th.firstChild.textContent
                    ? th.firstChild.textContent
                    : "";


            button.classList.toggle(
                "active",
                false
            );

        });


    const headers =
        excelHeader.querySelectorAll(
            "thead th"
        );


    headers.forEach(th => {

        const button =
            th.querySelector(
                ".filter-button"
            );

        if(!button){
            return;
        }


        const column =
            Array.from(th.childNodes)
                .filter(
                    node =>
                        node.nodeType ===
                        Node.TEXT_NODE
                )
                .map(
                    node =>
                        node.textContent
                )
                .join("")
                .trim();


        button.classList.toggle(
            "active",
            !!filters[column]
        );

    });

}


/* =========================================================
   VIRTUAL TABLE
========================================================= */

function renderVirtualTable(){

    if(
        currentSheet === "proactive" ||
        currentSheet === "phone"
    ){
        return;
    }


    virtualContent.innerHTML = "";


    if(!columns.length){

        virtualContent.textContent =
            "No data";

        return;

    }


    const wrapper =
        document.createElement("div");

    wrapper.style.position =
        "relative";

    wrapper.style.height =
        (
            filteredData.length *
            ROW_HEIGHT
        ) + "px";


    const table =
        document.createElement("table");

    table.className =
        "excel-table";

    table.style.position =
        "absolute";

    table.style.top =
        "0";

    table.style.left =
        "0";


    const tbody =
        document.createElement("tbody");

    table.appendChild(
        tbody
    );


    wrapper.appendChild(
        table
    );

    virtualContent.appendChild(
        wrapper
    );


    const scrollTop =
        excelArea.scrollTop;


    const start =
        Math.max(
            0,
            Math.floor(
                scrollTop / ROW_HEIGHT
            ) - BUFFER_ROWS
        );


    const visibleCount =
        Math.ceil(
            excelArea.clientHeight /
            ROW_HEIGHT
        ) +
        BUFFER_ROWS * 2;


    const end =
        Math.min(
            filteredData.length,
            start + visibleCount
        );


    table.style.top =
        (
            start *
            ROW_HEIGHT
        ) + "px";


    for(
        let i = start;
        i < end;
        i++
    ){

        const row =
            filteredData[i];


        const tr =
            document.createElement("tr");

        tr.style.height =
            ROW_HEIGHT + "px";


        columns.forEach(
            column => {

                const td =
                    document.createElement("td");


                let value =
                    row[column];


                if(
                    value === undefined ||
                    value === null
                ){
                    value = "";
                }


                td.textContent =
                    String(value);


                /* =====================================
                   VITAMIN SPECIAL
                ===================================== */

                if(
                    currentSheet === "vitamin"
                ){

                    const upper =
                        String(value)
                            .toUpperCase()
                            .trim();


                    if(
                        upper === "NCI" ||
                        upper === "NOT COVERED"
                    ){

                        td.classList.add(
                            "vitamin-nci"
                        );

                    }

                }


                /* =====================================
                   FROZEN THIQA / BASIC
                ===================================== */

                if(
                    currentSheet === "thiqa"
                ){

                    const upperColumn =
                        column
                            .toUpperCase()
                            .trim();


                    if(
                        upperColumn === "THIQA"
                    ){

                        td.classList.add(
                            "frozen-thiqa"
                        );

                    }


                    if(
                        upperColumn === "BASIC"
                    ){

                        td.classList.add(
                            "frozen-basic"
                        );

                    }

                }


                tr.appendChild(td);

            }
        );


        tbody.appendChild(
            tr
        );

    }

}


/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus(){

    const sheet =
        WORKSHEETS.find(
            item =>
                item.id === currentSheet
        );


    if(!sheet){
        return;
    }


    statusEl.textContent =
        sheet.name +
        " — " +
        filteredData.length +
        " / " +
        (
            sheetData[currentSheet] || []
        ).length +
        " records";

}


/* =========================================================
   SEARCH EVENTS
========================================================= */

globalSearch.addEventListener(

        if(

            return;

/* =========================================================
   CLEAR SEARCH
========================================================= */

clearSearch.addEventListener(
    "click",

        globalSearch.value = "";

        clearSearch.style.display =
            "none";

        applyFilters();

    }
);


clearStrengthSearch.addEventListener(

        clearStrengthSearch.style.display =

/* =========================================================
   CLOSE FILTER WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    event => {

        if(
            !filterPopup.contains(event.target) &&
            !event.target.classList.contains(
                "filter-button"
            )
        ){

            filterPopup.style.display =
                "none";

        }

    }
);


/* =========================================================
   SCROLL
========================================================= */

excelArea.addEventListener(
    "scroll",
    () => {

        if(
            currentSheet === "proactive" ||
            currentSheet === "phone"
        ){
            return;
        }

        renderVirtualTable();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if(
            currentSheet === "proactive" ||
            currentSheet === "phone"
        ){
            return;
        }

        updateFrozenWidths();

        renderVirtualTable();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        createTabs();

        loadAllData();

    }
);
