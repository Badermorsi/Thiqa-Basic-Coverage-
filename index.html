<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Coverage List</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#222;
}

body{
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    background:#1f4e78;
    color:white;
    padding:18px 20px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:100%;
    max-width:1700px;
    margin:0 auto;
    padding:15px;
}

/* =========================
   TABS
========================= */

.tabs{
    display:grid;
    grid-template-columns:repeat(8,minmax(0,1fr));
    gap:8px;
    width:100%;
    margin:0 auto 15px auto;
}

.tab{
    border:1px solid #b7c3cf;
    background:#e9edf2;
    color:#222;
    padding:11px 8px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
    text-align:center;
    min-width:0;
    transition:.15s;
    white-space:normal;
    line-height:16px;
}

.tab:hover{
    background:#dce4ec;
}

.tab.active{
    background:#1f4e78;
    color:white;
    border-color:#1f4e78;
}

/* =========================
   SEARCH AREA
========================= */

.search-container{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    margin-bottom:10px;
}

.search-container input{
    width:100%;
    padding:11px 12px;
    border:1px solid #c6ced6;
    border-radius:6px;
    font-size:14px;
    outline:none;
    background:white;
}

.search-container input:focus{
    border-color:#1f4e78;
    box-shadow:0 0 0 2px rgba(31,78,120,.12);
}

.controls{
    display:flex;
    justify-content:center;
    margin-bottom:12px;
}

.clear-btn{
    border:0;
    background:#1f4e78;
    color:white;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.clear-btn:hover{
    background:#163a5b;
}

/* =========================
   STATUS
========================= */

.status{
    text-align:center;
    font-size:13px;
    color:#555;
    margin:8px 0;
}

.error-box{
    display:none;
    background:#f8d7da;
    color:#721c24;
    border:1px solid #f1b0b7;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
    white-space:pre-wrap;
}

/* =========================
   TABLE AREA
========================= */

.excel-area{
    width:100%;
    background:white;
    border:1px solid #c7cdd3;
    border-radius:7px;
    overflow:hidden;
}

/* Horizontal scrolling only when the table
   genuinely needs more width */
.excel-scroll{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
}

/* =========================
   HEADER
========================= */

.excel-header{
    display:grid;
    width:max-content;
    min-width:100%;
    background:#e9edf2;
    border-bottom:2px solid #b7c0c9;
    position:sticky;
    top:0;
    z-index:20;
}

.header-cell{
    position:relative;
    min-width:0;
    padding:9px 30px 9px 8px;
    border-right:1px solid #c5ccd3;
    font-size:12px;
    font-weight:bold;
    line-height:16px;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.filter-btn{
    position:absolute;
    right:4px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    border:1px solid #aeb7c0;
    background:white;
    border-radius:4px;
    cursor:pointer;
    font-size:11px;
    padding:0;
}

.filter-btn:hover{
    background:#edf2f6;
}

.filter-btn.filtered{
    background:#1f4e78;
    color:white;
}

/* =========================
   VIRTUAL CONTENT
========================= */

.virtual-content{
    position:relative;
    width:100%;
    overflow:hidden;
}

.data-row{
    position:absolute;
    left:0;
    display:grid;
    width:max-content;
    min-width:100%;
    border-bottom:1px solid #e1e5e8;
    background:white;
}

.data-row:hover{
    background:#f8fafc;
}

.data-cell{
    min-width:0;
    padding:7px 8px;
    border-right:1px solid #edf0f2;
    font-size:12px;
    line-height:17px;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;

    vertical-align:middle;
}

/* =========================
   YES / NO
========================= */

.thiqa-yes,
.basic-yes{
    background:#d9ead3 !important;
    color:#222 !important;
    font-weight:bold !important;
    text-align:center;
    vertical-align:middle;
}

.thiqa-no,
.basic-no{
    background:#f4cccc !important;
    color:#222 !important;
    font-weight:bold !important;
    text-align:center;
    vertical-align:middle;
}

/* =========================
   FROZEN RIGHT COLUMNS
========================= */

.frozen-right{
    position:sticky !important;
    z-index:15 !important;
}

.frozen-basic{
    position:sticky !important;
    right:0;
    z-index:18 !important;
    box-shadow:-3px 0 4px rgba(0,0,0,.08);
}

.frozen-thiqa{
    position:sticky !important;
    right:var(--basic-width,110px);
    z-index:18 !important;
    box-shadow:-2px 0 3px rgba(0,0,0,.05);
}

.excel-header .frozen-basic,
.excel-header .frozen-thiqa{
    z-index:25 !important;
    background:#e9edf2;
}

/* =========================
   FILTER POPUP
========================= */

.filter-popup{
    display:none;
    position:fixed;
    z-index:1000;
    background:white;
    border:1px solid #b9c1c8;
    border-radius:7px;
    box-shadow:0 5px 20px rgba(0,0,0,.18);
    width:280px;
    max-height:420px;
    overflow:hidden;
}

.filter-popup.show{
    display:block;
}

.filter-popup-header{
    padding:10px;
    border-bottom:1px solid #ddd;
    font-weight:bold;
    background:#f5f7f9;
}

.filter-search{
    padding:8px;
    border-bottom:1px solid #ddd;
}

.filter-search input{
    width:100%;
    padding:7px 8px;
    border:1px solid #c7cdd3;
    border-radius:4px;
}

.filter-actions{
    display:flex;
    gap:6px;
    padding:8px;
    border-bottom:1px solid #ddd;
}

.filter-actions button{
    flex:1;
    padding:7px;
    border:1px solid #c3cad1;
    background:white;
    border-radius:4px;
    cursor:pointer;
}

.filter-actions button:hover{
    background:#eef2f5;
}

.filter-values{
    max-height:280px;
    overflow-y:auto;
    padding:6px 8px;
}

.filter-value{
    display:flex;
    align-items:center;
    gap:7px;
    padding:5px 2px;
    font-size:12px;
}

.filter-value input{
    margin:0;
}

/* =========================
   SPECIAL PROACTIVE CONTENT
========================= */

.special-content{
    display:none;
    width:100%;
    padding:20px;
    background:white;
}

.special-content img{
    display:block;
    width:100%;
    max-width:1500px;
    height:auto;
    margin:0 auto 25px auto;
    object-fit:contain;
}

.special-content img:last-child{
    margin-bottom:0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    .tabs{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .search-container{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

@media(max-width:800px){

    .header{
        font-size:21px;
        padding:15px;
    }

    .container{
        padding:8px;
    }

    .tabs{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
    }

    .tab{
        font-size:12px;
        padding:9px 5px;
    }

    .search-container{
        grid-template-columns:1fr;
    }

    .special-content{
        padding:10px;
    }

    .special-content img{
        margin-bottom:15px;
    }
}

</style>
</head>

<div class="container">

<script>

/* =========================================================
   WORKSHEETS
========================================================= */

const WORKSHEETS = [

    {
        id:"thiqa",
        name:"Thiqa & Basic",
        file:"data.json"
    },

    {
        id:"haad",
        name:"HAAD",
        file:"HAAD_LIST.json"
    },

    {
        id:"apg",
        name:"APG FORMULARY 05-06",
        file:"APG FORMULARY 05-06.json"
    },

    {
        id:"icd10",
        name:"ICD10",
        file:"ICD10.json"
    },

    {
        id:"vitamin",
        name:"VITAMIN COVERAGE",
        file:"VITAMIN COVERAGE.json"
    },

    {
        id:"ppi",
        name:"PPI Coverage",
        file:"PPI Coverage.json"
    },

    /*
       IMPORTANT:
       PROACTIVE INSTRUCTION DOES NOT HAVE A JSON FILE.
       It displays two images instead.
    */

    {
        id:"proactive",
        name:"PROACTIVE INSTRUCTION",
        special:true
    },

    {
        id:"hcpc",
        name:"HCPC Cap & Ref Price",
        file:"HCPC Cap & REf Price.json"
    },

    {
        id:"validity",
        name:"VALIDITY AFTER OPENNING",
        file:"VALIDITY AFTER OPENNING.json"
    },

    {
        id:"cda",
        name:"CDA & CDB MAX DD",
        file:"CDA &CDB MAX DD.json"
    },

    {
        id:"adnic",
        name:"ADNIC (KHALIFA F.)",
        file:"ADNIC ( KHALIFA F. ).json"
    },

    {
        id:"nasHaad",
        name:"Nas TPA Formulary (HAAD)",
        file:"Nas TPA Formulary (HAAD).json"
    },

    {
        id:"nasDha",
        name:"Nas TPA Formulary (DHA)",
        file:"Nas TPA Formulary (DHA).json"
    },

    {
        id:"fmc",
        name:"FMC LIST 01-2026",
        file:"FMC LIST 01-2026.json"
    },

    {
        id:"oman",
        name:"OMAN FORMULARY 03-2024",
        file:"OMAN FORMULARY 03-2024.json"
    },

    {
        id:"phone",
        name:"PHONE CONTACTS",
        file:"PHONE CONTACTS.json"
    }

];


/* =========================================================
   GLOBAL DATA
========================================================= */

const sheetData = {};
const sheetColumns = {};
const filteredData = {};
const columnFilters = {};

const rowOffsets = {};
const totalHeights = {};

let currentSheet = "thiqa";
let renderTimer = null;

const MIN_ROW_HEIGHT = 42;
const LINE_HEIGHT = 17;
const ROW_VERTICAL_PADDING = 14;
const BUFFER_ROWS = 30;

let filterPopupState = {
    column:null,
    sheet:null,
    allValues:[],
    selected:new Set()
};


/* =========================================================
   DOM
========================================================= */

const tabsEl =
    document.getElementById("tabs");

const statusEl =
    document.getElementById("status");

const errorBox =
    document.getElementById("errorBox");

const excelArea =
    document.getElementById("excelArea");

const excelHeader =
    document.getElementById("excelHeader");

const virtualContent =
    document.getElementById("virtualContent");

const specialContent =
    document.getElementById("specialContent");

const searchArea =
    document.getElementById("searchArea");

const brandSearch =
    document.getElementById("brandSearch");

const genericSearch =
    document.getElementById("genericSearch");

const strengthSearch =
    document.getElementById("strengthSearch");

const dosageSearch =
    document.getElementById("dosageSearch");

const clearBtn =
    document.getElementById("clearBtn");

const filterPopup =
    document.getElementById("filterPopup");

const filterPopupHeader =
    document.getElementById("filterPopupHeader");

const filterValueSearch =
    document.getElementById("filterValueSearch");

const filterValues =
    document.getElementById("filterValues");

const selectAllBtn =
    document.getElementById("selectAllBtn");

const clearFilterBtn =
    document.getElementById("clearFilterBtn");


/* =========================================================
   INITIALIZE STORAGE
========================================================= */

function initializeSheetStorage(){

    WORKSHEETS.forEach(sheet => {

        sheetData[sheet.id] = [];
        sheetColumns[sheet.id] = [];
        filteredData[sheet.id] = [];
        columnFilters[sheet.id] = {};

        rowOffsets[sheet.id] = [];
        totalHeights[sheet.id] = 0;

    });

}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsEl.innerHTML = "";

    WORKSHEETS.forEach(sheet => {

        const btn =
            document.createElement("button");

        btn.type = "button";

        btn.className = "tab";

        if(sheet.id === currentSheet){
            btn.classList.add("active");
        }

        btn.textContent = sheet.name;

        btn.dataset.sheet = sheet.id;

        btn.addEventListener("click", () => {

            switchSheet(sheet.id);

        });

        tabsEl.appendChild(btn);

    });

}


/* =========================================================
   LOAD ALL JSON DATA
========================================================= */

async function loadAllData(){

    errorBox.style.display = "none";

    const errors = [];

    for(const sheet of WORKSHEETS){

        /*
           Skip PROACTIVE because it is image-only.
        */

        if(sheet.special){
            continue;
        }

        try{

            const response =
                await fetch(
                    sheet.file + "?v=" + Date.now(),
                    {
                        cache:"no-store"
                    }
                );

            if(!response.ok){
                throw new Error(
                    "HTTP " +
                    response.status
                );
            }

            const json =
                await response.json();

            const rows =
                normalizeJSON(json);

            sheetData[sheet.id] =
                rows;

            sheetColumns[sheet.id] =
                buildColumns(rows);

            filteredData[sheet.id] =
                [...rows];

            columnFilters[sheet.id] = {};

            buildRowOffsets(sheet.id);

        }
        catch(error){

            console.error(
                sheet.name,
                error
            );

            errors.push(
                sheet.name +
                ": " +
                error.message
            );

            sheetData[sheet.id] = [];
            sheetColumns[sheet.id] = [];
            filteredData[sheet.id] = [];

        }

    }

    /*
       PROACTIVE has no table data.
    */

    sheetData.proactive = [];
    sheetColumns.proactive = [];
    filteredData.proactive = [];

    if(errors.length){

        errorBox.textContent =
            "Some sheets could not be loaded:\n\n" +
            errors.join("\n");

        errorBox.style.display = "block";

    }

    switchSheet("thiqa");

}


/* =========================================================
   NORMALIZE JSON
========================================================= */

function normalizeJSON(json){

    if(Array.isArray(json)){
        return json;
    }

    if(
        json &&
        Array.isArray(json.data)
    ){
        return json.data;
    }

    if(
        json &&
        typeof json === "object"
    ){

        for(const key of Object.keys(json)){

            if(Array.isArray(json[key])){

                return json[key];

            }

        }

    }

    return [];

}


/* =========================================================
   BUILD COLUMNS
========================================================= */

function buildColumns(rows){

    const columns = [];

    rows.forEach(row => {

        if(
            row &&
            typeof row === "object" &&
            !Array.isArray(row)
        ){

            Object.keys(row).forEach(key => {

                if(!columns.includes(key)){
                    columns.push(key);
                }

            });

        }

    });

    return columns;

}


/* =========================================================
   DISPLAY VALUE
========================================================= */

function displayValue(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    if(typeof value === "object"){

        try{
            return JSON.stringify(value);
        }
        catch{
            return String(value);
        }

    }

    return String(value);

}


/* =========================================================
   SEARCH VALUE
========================================================= */

function matchesMultiSearch(
    value,
    search
){

    const query =
        String(search || "")
            .trim()
            .toLowerCase();

    if(!query){
        return true;
    }

    const text =
        displayValue(value)
            .toLowerCase();

    const terms =
        query
            .split("%")
            .map(x => x.trim())
            .filter(Boolean);

    return terms.every(
        term => text.includes(term)
    );

}


/* =========================================================
   COLUMN NAME HELPERS
========================================================= */

function findColumn(
    columns,
    patterns
){

    for(const pattern of patterns){

        const found =
            columns.find(col =>
                col
                    .toLowerCase()
                    .trim()
                    .includes(pattern)
            );

        if(found){
            return found;
        }

    }

    return null;

}


/* =========================================================
   FILTER DATA
========================================================= */

function getFilteredRows(type){

    const rows =
        sheetData[type] || [];

    const columns =
        sheetColumns[type] || [];

    if(!rows.length){
        return [];
    }

    const brandColumn =
        findColumn(
            columns,
            [
                "brand name",
                "brand",
                "product name",
                "item name",
                "package name"
            ]
        );

    const genericColumn =
        findColumn(
            columns,
            [
                "generic name",
                "active ingredient",
                "active ingredients",
                "generic",
                "ingredient"
            ]
        );

    const strengthColumn =
        findColumn(
            columns,
            [
                "strength"
            ]
        );

    const dosageColumn =
        findColumn(
            columns,
            [
                "dosage form",
                "dosage"
            ]
        );


    const brandQuery =
        brandSearch.value;

    const genericQuery =
        genericSearch.value;

    const strengthQuery =
        strengthSearch.value;

    const dosageQuery =
        dosageSearch.value;


    return rows.filter(row => {

        /*
           Standard searches
        */

        let brandMatch = true;
        let genericMatch = true;
        let strengthMatch = true;
        let dosageMatch = true;


        if(brandQuery){

            if(brandColumn){

                brandMatch =
                    matchesMultiSearch(
                        row[brandColumn],
                        brandQuery
                    );

            }
            else{

                brandMatch =
                    Object.values(row)
                        .some(value =>
                            matchesMultiSearch(
                                value,
                                brandQuery
                            )
                        );

            }

        }


        if(genericQuery){

            if(genericColumn){

                genericMatch =
                    matchesMultiSearch(
                        row[genericColumn],
                        genericQuery
                    );

            }
            else{

                genericMatch =
                    Object.values(row)
                        .some(value =>
                            matchesMultiSearch(
                                value,
                                genericQuery
                            )
                        );

            }

        }


        if(strengthQuery){

            if(strengthColumn){

                strengthMatch =
                    matchesMultiSearch(
                        row[strengthColumn],
                        strengthQuery
                    );

            }
            else{

                strengthMatch =
                    Object.values(row)
                        .some(value =>
                            matchesMultiSearch(
                                value,
                                strengthQuery
                            )
                        );

            }

        }


        if(dosageQuery){

            if(dosageColumn){

                dosageMatch =
                    matchesMultiSearch(
                        row[dosageColumn],
                        dosageQuery
                    );

            }
            else{

                dosageMatch =
                    Object.values(row)
                        .some(value =>
                            matchesMultiSearch(
                                value,
                                dosageQuery
                            )
                        );

            }

        }


        if(
            !brandMatch ||
            !genericMatch ||
            !strengthMatch ||
            !dosageMatch
        ){
            return false;
        }


        /*
           Excel column filters
        */

        const filters =
            columnFilters[type] || {};

        for(const column of Object.keys(filters)){

            const selected =
                filters[column];

            if(
                selected &&
                selected.size > 0
            ){

                const value =
                    displayValue(
                        row[column]
                    );

                if(
                    !selected.has(value)
                ){

                    return false;

                }

            }

        }


        return true;

    });

}


/* =========================================================
   APPLY FILTERS
========================================================= */

function applyFilters(type){

    if(
        type === "proactive"
    ){
        return;
    }

    filteredData[type] =
        getFilteredRows(type);

    buildRowOffsets(type);

    renderVirtualTable(type);

    updateStatus(type);

}


/* =========================================================
   SWITCH SHEET
========================================================= */

function switchSheet(type){

    currentSheet = type;

    document
        .querySelectorAll(".tab")
        .forEach(tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.sheet === type
            );

        });


    /*
       Clear top searches when changing sheet.
    */

    brandSearch.value = "";
    genericSearch.value = "";
    strengthSearch.value = "";
    dosageSearch.value = "";


    closeFilterPopup();


    /*
       SPECIAL PROACTIVE TAB
    */

    if(type === "proactive"){

        searchArea.style.display = "none";

        excelHeader.style.display = "none";

        virtualContent.style.display = "none";

        specialContent.style.display = "block";

        renderProactiveImages();

        statusEl.textContent =
            "PROACTIVE INSTRUCTION";

        return;

    }


    /*
       NORMAL JSON SHEET
    */

    searchArea.style.display = "block";

    excelHeader.style.display = "grid";

    virtualContent.style.display = "block";

    specialContent.style.display = "none";

    applyFilters(type);

    updatePlaceholders(type);

    excelArea.scrollTop = 0;

    const scroll =
        document.querySelector(".excel-scroll");

    if(scroll){
        scroll.scrollLeft = 0;
    }

    renderVirtualTable(type);

    updateStatus(type);

}

/* =========================================================
   PLACEHOLDERS
========================================================= */

function updatePlaceholders(type){

    const columns =
        sheetColumns[type] || [];

    const has =
        pattern =>
            columns.some(
                c =>
                    c
                        .toLowerCase()
                        .includes(pattern)
            );


    if(has("brand name") || has("brand")){

        brandSearch.placeholder =
            "Search Brand Name...";

    }
    else{

        brandSearch.placeholder =
            "Search Brand / Item...";

    }


    if(
        has("generic name") ||
        has("active ingredient") ||
        has("ingredient")
    ){

        genericSearch.placeholder =
            "Search Generic / Active Ingredient...";

    }
    else{

        genericSearch.placeholder =
            "Search Generic / Ingredient...";

    }


    strengthSearch.placeholder =
        has("strength")
            ? "Search Strength..."
            : "Search Strength / Value...";


    dosageSearch.placeholder =
        has("dosage")
            ? "Search Dosage Form..."
            : "Search Dosage / Form...";

}


/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus(type){

    if(type === "proactive"){
        statusEl.textContent =
            "PROACTIVE INSTRUCTION";
        return;
    }

    const total =
        (sheetData[type] || []).length;

    const shown =
        (filteredData[type] || []).length;

    statusEl.textContent =
        "Showing " +
        shown.toLocaleString() +
        " of " +
        total.toLocaleString() +
        " records";

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function getColumnWidth(column){

    const c =
        column.toLowerCase().trim();


    /*
       Long text columns
    */

    if(
        c.includes("generic") ||
        c.includes("active ingredient") ||
        c.includes("active ingredients") ||
        c.includes("package name") ||
        c.includes("product name") ||
        c.includes("item name") ||
        c.includes("description") ||
        c.includes("instruction") ||
        c.includes("indication") ||
        c.includes("proactive") ||
        c.includes("manufacturer") ||
        c.includes("formulary") ||
        c.includes("agent") ||
        c.includes("daman")
    ){

        return 280;

    }


    /*
       Medium columns
    */

    if(
        c.includes("strength") ||
        c.includes("dosage form") ||
        c === "dosage"
    ){

        return 160;

    }


    /*
       Price columns
    */

    if(
        c.includes("price") ||
        c.includes("markup") ||
        c.includes("reimbursement") ||
        c.includes("copay") ||
        c.includes("cap")
    ){

        return 155;

    }


    if(
        c.includes("date")
    ){

        return 140;

    }


    /*
       Frozen Thiqa / Basic
    */

    if(
        c === "thiqa" ||
        c === "basic"
    ){

        return 110;

    }


    return 150;

}


/* =========================================================
   GRID TEMPLATE
========================================================= */

function getGridTemplate(type){

    const columns =
        sheetColumns[type] || [];

    if(!columns.length){
        return "";
    }


    const baseWidths =
        columns.map(
            column =>
                getColumnWidth(column)
        );


    const excelWidth =
        excelArea.clientWidth ||
        window.innerWidth;


    const baseTotal =
        baseWidths.reduce(
            (sum,width) =>
                sum + width,
            0
        );


    /*
       If table is already wider than screen,
       keep natural widths.
    */

    if(baseTotal >= excelWidth){

        return baseWidths
            .map(width => width + "px")
            .join(" ");

    }


    /*
       There is empty space.

       Expand columns so the table fills
       the entire available width.

       Long text columns receive more
       of the extra width.
    */

    const weights =
        columns.map(column => {

            const c =
                column
                    .toLowerCase()
                    .trim();


            if(
                c.includes("item name") ||
                c.includes("active ingredient") ||
                c.includes("active ingredients") ||
                c.includes("generic name") ||
                c.includes("package name") ||
                c.includes("product name") ||
                c.includes("description") ||
                c.includes("instruction") ||
                c.includes("indication")
            ){

                return 3;

            }

            return 1;

        });


    /*
       Keep Thiqa and Basic fixed because
       they are frozen columns.
    */

    const frozenWidths =
        columns.map(
            (column,index) => {

                const c =
                    column
                        .toLowerCase()
                        .trim();

                return (
                    type === "thiqa" &&
                    (
                        c === "thiqa" ||
                        c === "basic"
                    )
                )
                    ? baseWidths[index]
                    : 0;

            }
        );


    const frozenTotal =
        frozenWidths.reduce(
            (sum,width) =>
                sum + width,
            0
        );


    const extra =
        excelWidth -
        baseTotal;


    const flexibleWeight =
        weights.reduce(
            (sum,weight,index) =>
                sum +
                (
                    frozenWidths[index]
                        ? 0
                        : weight
                ),
            0
        );


    const finalWidths =
        baseWidths.map(
            (width,index) => {

                if(frozenWidths[index]){
                    return width;
                }

                if(flexibleWeight <= 0){
                    return width;
                }

                return Math.round(
                    width +
                    (
                        extra *
                        weights[index] /
                        flexibleWeight
                    )
                );

            }
        );


    /*
       Update CSS variable for frozen
       Thiqa column.

       Basic is always the rightmost
       frozen column.
    */

    if(type === "thiqa"){

        const basicIndex =
            columns.findIndex(
                c =>
                    c
                        .toLowerCase()
                        .trim() === "basic"
            );


        if(basicIndex >= 0){

            document.documentElement.style.setProperty(
                "--basic-width",
                finalWidths[basicIndex] + "px"
            );

        }

    }


    return finalWidths
        .map(width => width + "px")
        .join(" ");

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderVirtualTable(type){

    if(type === "proactive"){

        excelHeader.style.display = "none";
        virtualContent.style.display = "none";
        specialContent.style.display = "block";

        renderProactiveImages();

        return;

    }


    excelHeader.style.display = "grid";
    virtualContent.style.display = "block";
    specialContent.style.display = "none";


    const columns =
        sheetColumns[type] || [];

    if(!columns.length){

        excelHeader.innerHTML = "";

        virtualContent.innerHTML = "";

        virtualContent.style.height = "0px";

        return;

    }


    const template =
        getGridTemplate(type);


    /*
       HEADER
    */

    excelHeader.style.gridTemplateColumns =
        template;

    excelHeader.innerHTML = "";


    columns.forEach(column => {

        const cell =
            document.createElement("div");

        cell.className =
            "header-cell";

        cell.textContent =
            column;


        const filterButton =
            document.createElement("button");

        filterButton.type = "button";

        filterButton.className =
            "filter-btn";

        filterButton.textContent =
            "▼";


        const filter =
            columnFilters[type][column];


        if(
            filter &&
            filter.size > 0
        ){

            filterButton.classList.add(
                "filtered"
            );

        }


        filterButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openFilterPopup(
                    type,
                    column,
                    filterButton
                );

            }
        );


        cell.appendChild(
            filterButton
        );

        excelHeader.appendChild(cell);

    });


    /*
       RENDER VISIBLE ROWS
    */

    renderVisibleRows(type);

}


/* =========================================================
   CALCULATE ROW HEIGHT
========================================================= */

function calculateRowHeight(
    type,
    row
){

    const columns =
        sheetColumns[type] || [];

    let maxLines = 1;


    columns.forEach(column => {

        const value =
            displayValue(
                row[column]
            );

        if(!value){
            return;
        }


        const width =
            getColumnWidth(column);


        const charsPerLine =
            Math.max(
                10,
                Math.floor(
                    width / 7
                )
            );


        const explicitLines =
            value.split("\n");


        let lines = 0;


        explicitLines.forEach(
            line => {

                lines += Math.max(
                    1,
                    Math.ceil(
                        line.length /
                        charsPerLine
                    )
                );

            }
        );


        maxLines =
            Math.max(
                maxLines,
                lines
            );

    });


    return Math.max(
        MIN_ROW_HEIGHT,
        maxLines *
            LINE_HEIGHT +
            ROW_VERTICAL_PADDING
    );

}


/* =========================================================
   BUILD ROW OFFSETS
========================================================= */

function buildRowOffsets(type){

    const rows =
        filteredData[type] || [];

    const offsets = [];

    let current =
        0;


    rows.forEach(row => {

        offsets.push(current);

        current +=
            calculateRowHeight(
                type,
                row
            );

    });


    rowOffsets[type] =
        offsets;

    totalHeights[type] =
        current;


    if(
        type === currentSheet &&
        type !== "proactive"
    ){

        virtualContent.style.height =
            current + "px";

    }

}


/* =========================================================
   FIND ROW
========================================================= */

function findRowAtPosition(
    offsets,
    position
){

    if(!offsets.length){
        return 0;
    }


    let low = 0;
    let high = offsets.length - 1;


    while(low <= high){

        const mid =
            Math.floor(
                (low + high) / 2
            );


        if(
            offsets[mid] <= position
        ){

            if(
                mid === offsets.length - 1 ||
                offsets[mid + 1] > position
            ){

                return mid;

            }

            low = mid + 1;

        }
        else{

            high = mid - 1;

        }

    }


    return 0;

}


/* =========================================================
   RENDER VISIBLE ROWS
========================================================= */

function renderVisibleRows(type){

    if(type === "proactive"){
        return;
    }


    const rows =
        filteredData[type] || [];

    const columns =
        sheetColumns[type] || [];


    if(!rows.length){

        virtualContent.innerHTML = "";

        virtualContent.style.height =
            "60px";

        return;

    }


    const template =
        getGridTemplate(type);


    const scroll =
        document.querySelector(".excel-scroll");


    if(!scroll){
        return;
    }


    /*
       Header height
    */

    const headerHeight =
        excelHeader.offsetHeight ||
        42;


    const scrollTop =
        scroll.scrollTop;


    const viewportHeight =
        scroll.clientHeight ||
        window.innerHeight;


    const startPosition =
        Math.max(
            0,
            scrollTop -
            headerHeight
        );


    const endPosition =
        scrollTop +
        viewportHeight;


    let startIndex =
        findRowAtPosition(
            rowOffsets[type],
            startPosition
        );


    let endIndex =
        findRowAtPosition(
            rowOffsets[type],
            endPosition
        );


    startIndex =
        Math.max(
            0,
            startIndex -
            BUFFER_ROWS
        );


    endIndex =
        Math.min(
            rows.length - 1,
            endIndex +
            BUFFER_ROWS
        );


    virtualContent.innerHTML = "";


    for(
        let i = startIndex;
        i <= endIndex;
        i++
    ){

        const row =
            rows[i];


        const rowEl =
            document.createElement("div");


        rowEl.className =
            "data-row";


        rowEl.style.gridTemplateColumns =
            template;


        const rowHeight =
            calculateRowHeight(
                type,
                row
            );


        rowEl.style.height =
            rowHeight + "px";


        rowEl.style.top =
            rowOffsets[type][i] + "px";


        columns.forEach(
            column => {

                const cell =
                    document.createElement("div");


                cell.className =
                    "data-cell";


                const value =
                    displayValue(
                        row[column]
                    );


                cell.textContent =
                    value;


                /*
                   Thiqa / Basic formatting
                */

                if(type === "thiqa"){

                    const normalizedColumn =
                        column
                            .toLowerCase()
                            .trim();


                    const normalizedValue =
                        value
                            .toLowerCase()
                            .trim();


                    if(
                        normalizedColumn ===
                        "thiqa"
                    ){

                        cell.classList.add(
                            "frozen-right",
                            "frozen-thiqa"
                        );


                        if(
                            normalizedValue === "yes"
                        ){

                            cell.classList.add(
                                "thiqa-yes"
                            );

                        }
                        else if(
                            normalizedValue === "no"
                        ){

                            cell.classList.add(
                                "thiqa-no"
                            );

                        }

                    }


                    if(
                        normalizedColumn ===
                        "basic"
                    ){

                        cell.classList.add(
                            "frozen-right",
                            "frozen-basic"
                        );


                        if(
                            normalizedValue === "yes"
                        ){

                            cell.classList.add(
                                "basic-yes"
                            );

                        }
                        else if(
                            normalizedValue === "no"
                        ){

                            cell.classList.add(
                                "basic-no"
                            );

                        }

                    }

                }


                rowEl.appendChild(
                    cell
                );

            }
        );


        virtualContent.appendChild(
            rowEl
        );

    }

}


/* =========================================================
   SCROLL HANDLER
========================================================= */

function handleScroll(){

    if(currentSheet === "proactive"){
        return;
    }


    if(renderTimer){
        cancelAnimationFrame(
            renderTimer
        );
    }


    renderTimer =
        requestAnimationFrame(
            () => {

                renderVisibleRows(
                    currentSheet
                );

            }
        );

}


/* =========================================================
   FILTER POPUP
========================================================= */

function openFilterPopup(
    type,
    column,
    button
){

    const rows =
        sheetData[type] || [];


    const values =
        [
            ...new Set(
                rows.map(
                    row =>
                        displayValue(
                            row[column]
                        )
                )
            )
        ]
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
        );


    filterPopupState = {

        column,
        sheet:type,
        allValues:values,

        selected:
            columnFilters[type][column]
                ? new Set(
                    columnFilters[type][column]
                )
                : new Set(values)

    };


    filterPopupHeader.textContent =
        "Filter: " + column;


    filterValueSearch.value =
        "";


    renderFilterValues();


    const rect =
        button.getBoundingClientRect();


    filterPopup.style.left =
        Math.min(
            rect.left,
            window.innerWidth -
            290
        ) + "px";


    filterPopup.style.top =
        Math.min(
            rect.bottom + 5,
            window.innerHeight - 430
        ) + "px";


    filterPopup.classList.add(
        "show"
    );

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
        filterValueSearch.value
            .trim()
            .toLowerCase();


    filterValues.innerHTML = "";


    const values =
        filterPopupState.allValues
            .filter(
                value =>
                    value
                        .toLowerCase()
                        .includes(search)
            );


    values.forEach(value => {

        const label =
            document.createElement("label");

        label.className =
            "filter-value";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.checked =
            filterPopupState.selected
                .has(value);


        checkbox.addEventListener(
            "change",
            () => {

                if(checkbox.checked){

                    filterPopupState.selected
                        .add(value);

                }
                else{

                    filterPopupState.selected
                        .delete(value);

                }

                applyPopupFilter();

            }
        );


        const text =
            document.createElement("span");

        text.textContent =
            value === ""
                ? "(Blanks)"
                : value;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            text
        );

        filterValues.appendChild(
            label
        );

    });

}


/* =========================================================
   APPLY POPUP FILTER
========================================================= */

function applyPopupFilter(){

    const {
        sheet,
        column,
        selected,
        allValues
    } = filterPopupState;


    if(
        selected.size === allValues.length
    ){

        delete columnFilters[sheet][column];

    }
    else{

        columnFilters[sheet][column] =
            new Set(selected);

    }


    applyFilters(sheet);

}


/* =========================================================
   SELECT ALL
========================================================= */

selectAllBtn.addEventListener(
    "click",
    () => {

        filterPopupState.selected =
            new Set(
                filterPopupState.allValues
            );

        renderFilterValues();

        applyPopupFilter();

    }
);


/* =========================================================
   CLEAR FILTER
========================================================= */

clearFilterBtn.addEventListener(
    "click",
    () => {

        const {
            sheet,
            column
        } = filterPopupState;


        delete columnFilters[sheet][column];

        filterPopupState.selected =
            new Set(
                filterPopupState.allValues
            );


        applyFilters(sheet);

        renderFilterValues();

    }
);


/* =========================================================
   FILTER SEARCH
========================================================= */

filterValueSearch.addEventListener(
    "input",
    renderFilterValues
);


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilterPopup(){

    filterPopup.classList.remove(
        "show"
    );

}


document.addEventListener(
    "click",
    event => {

        if(
            !filterPopup.contains(
                event.target
            )
        ){

            closeFilterPopup();

        }

    }
);


/* =========================================================
   SEARCH EVENTS
========================================================= */

[
    brandSearch,
    genericSearch,
    strengthSearch,
    dosageSearch
]
.forEach(input => {

    input.addEventListener(
        "input",
        () => {

            if(
                currentSheet ===
                "proactive"
            ){
                return;
            }

            applyFilters(
                currentSheet
            );

        }
    );

});


/* =========================================================
   CLEAR ALL
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        brandSearch.value = "";
        genericSearch.value = "";
        strengthSearch.value = "";
        dosageSearch.value = "";


        if(
            currentSheet !==
            "proactive"
        ){

            columnFilters[
                currentSheet
            ] = {};


            applyFilters(
                currentSheet
            );

        }

    }
);


/* =========================================================
   TABLE SCROLL
========================================================= */

document
    .querySelector(".excel-scroll")
    .addEventListener(
        "scroll",
        handleScroll,
        {
            passive:true
        }
    );


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if(
            currentSheet ===
            "proactive"
        ){
            return;
        }


        buildRowOffsets(
            currentSheet
        );

        renderVirtualTable(
            currentSheet
        );

    }
);


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        createTabs();

        initializeSheetStorage();

        loadAllData();

    }
);

</script>
